<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elythera Overlay Test</title>
  <style>
    :root{
      --blue:#71d6ff;
      --green:#72ff8b;
      --violet:#c087ff;
      --orange:#ffb25a;
      --sky:#66d8ff;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:#000;
      overflow:hidden;
      font-family:Arial, Helvetica, sans-serif;
      color:#eaf7ff;
    }
    .scene{
      position:relative;
      width:100vw;
      height:100vh;
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 14%, rgba(85,150,255,.12), rgba(0,0,0,0) 35%),
        linear-gradient(to bottom, rgba(10,25,44,.45), rgba(0,0,0,.1) 20%, rgba(0,0,0,.55) 100%);
    }
    .welcome-wrap{
      position:absolute;
      inset:0;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      pointer-events:none;
      z-index:40;
    }
    .welcome{
      margin-top:9vh;
      text-align:center;
      opacity:0;
      transform:translateY(10px) scale(.98);
      animation:welcomeIn 1s ease forwards, welcomeOut 1s ease forwards;
      animation-delay:.2s, 1.8s;
    }
    .welcome h1{
      margin:0;
      font-size:clamp(28px,4vw,54px);
      letter-spacing:.32em;
      text-transform:uppercase;
      text-shadow:0 0 18px rgba(113,214,255,.22);
    }
    .welcome p{
      margin:.55rem 0 0;
      font-size:clamp(10px,1vw,14px);
      letter-spacing:.22em;
      text-transform:uppercase;
      color:rgba(234,247,255,.72);
    }
    .stage{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      opacity:0;
      animation:stageIn 1.2s ease forwards;
      animation-delay:2.6s;
    }
    .frame{
      position:relative;
      width:min(100vw, 1536px);
      aspect-ratio:1536 / 1024;
      max-height:100vh;
    }
    .base,.overlay{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:contain;
      object-position:center center;
      user-select:none;
      pointer-events:none;
      -webkit-user-drag:none;
    }
    .base{
      z-index:5;
      opacity:0;
      transform:scale(.988);
      animation:baseIn 1.15s ease forwards;
      animation-delay:2.8s;
    }
    .overlay{
      z-index:25;
      opacity:0;
      animation:overlayIn 1s ease forwards;
      animation-delay:5.9s;
    }
    .effects{
      position:absolute;
      inset:0;
      z-index:18;
      pointer-events:none;
      opacity:0;
      animation:effectsOn .8s ease forwards;
      animation-delay:3.45s;
    }
    .palm,.ring,.label{
      position:absolute;
      transform:translate(-50%, -50%);
    }
    .palm{
      width:7.5%;
      aspect-ratio:1/1;
      opacity:0;
      animation:glowBuild 1s ease forwards, glowPulse 2.9s ease-in-out infinite;
      animation-delay:var(--delay), calc(var(--delay) + 1s);
      filter:blur(0.2px);
    }
    .palm::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        radial-gradient(circle, rgba(255,255,255,.98) 0%, var(--color) 20%, rgba(255,255,255,.1) 42%, rgba(0,0,0,0) 72%);
      filter:blur(10px);
      opacity:.95;
    }
    .palm::after{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      width:72%;
      height:72%;
      transform:translate(-50%,-50%);
      border-radius:50%;
      border:2px solid rgba(255,255,255,.5);
      box-shadow:
        0 0 10px var(--color),
        0 0 18px var(--color),
        inset 0 0 12px rgba(255,255,255,.18);
      opacity:.78;
    }
    .ring{
      width:9.5%;
      aspect-ratio:1/1;
      border-radius:50%;
      opacity:0;
      animation:ringIn .9s ease forwards, ringFloat 4s ease-in-out infinite, ringSpin 8s linear infinite;
      animation-delay:calc(var(--delay) + .55s), calc(var(--delay) + 1.45s), calc(var(--delay) + 1.45s);
    }
    .ring::before,.ring::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:50%;
      border:2px solid var(--color);
      box-shadow:0 0 10px var(--color), 0 0 18px rgba(255,255,255,.08);
    }
    .ring::after{
      inset:14%;
      opacity:.55;
    }
    .ring .spark{
      position:absolute;
      width:10%;
      height:10%;
      border-radius:50%;
      background:white;
      box-shadow:0 0 10px white, 0 0 18px var(--color);
      left:83%;
      top:18%;
      opacity:.95;
    }
    .label{
      opacity:0;
      padding:.3em .7em;
      border-radius:999px;
      background:rgba(4,8,18,.28);
      border:1px solid rgba(255,255,255,.1);
      box-shadow:0 0 18px rgba(255,255,255,.06), inset 0 0 14px rgba(255,255,255,.04);
      color:#eef8ff;
      font-size:clamp(7px,.75vw,12px);
      letter-spacing:.18em;
      text-transform:uppercase;
      backdrop-filter:blur(4px);
      white-space:nowrap;
      animation:labelIn .9s ease forwards, labelFloat 3.6s ease-in-out infinite;
      animation-delay:calc(var(--delay) + 1.45s), calc(var(--delay) + 2.35s);
    }
    .vixen { left:14.15%; top:55.25%; --color:var(--blue); --delay:3.55s; }
    .mareoj{ left:33.20%; top:56.00%; --color:var(--green); --delay:3.90s; }
    .vel   { left:50.15%; top:56.95%; --color:var(--violet); --delay:4.25s; }
    .lyra  { left:67.25%; top:56.20%; --color:var(--orange); --delay:4.60s; }
    .uniq  { left:85.05%; top:55.35%; --color:var(--sky); --delay:4.95s; }

    .vixen.label { top:61.2%; left:13.8%; }
    .mareoj.label{ top:62.2%; left:33.0%; }
    .vel.label   { top:63.3%; left:50.2%; }
    .lyra.label  { top:62.6%; left:67.3%; }
    .uniq.label  { top:61.3%; left:84.8%; }

    .legend{
      position:absolute;
      left:50%;
      bottom:14px;
      transform:translateX(-50%);
      z-index:45;
      font-size:10px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:rgba(234,247,255,.58);
      background:rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.08);
      border-radius:999px;
      padding:8px 12px;
      backdrop-filter:blur(5px);
    }
    canvas{
      position:absolute;
      inset:0;
      z-index:20;
      pointer-events:none;
      opacity:0;
      animation:effectsOn .8s ease forwards;
      animation-delay:3.45s;
    }

    @keyframes welcomeIn{
      from{opacity:0; transform:translateY(10px) scale(.98)}
      to{opacity:1; transform:translateY(0) scale(1)}
    }
    @keyframes welcomeOut{
      from{opacity:1; transform:translateY(0) scale(1)}
      to{opacity:0; transform:translateY(-8px) scale(1.01)}
    }
    @keyframes stageIn{from{opacity:0} to{opacity:1}}
    @keyframes baseIn{
      0%{opacity:0; transform:scale(.988)}
      100%{opacity:1; transform:scale(1)}
    }
    @keyframes effectsOn{from{opacity:0} to{opacity:1}}
    @keyframes glowBuild{
      0%{opacity:0; transform:translate(-50%,-50%) scale(.18)}
      70%{opacity:1; transform:translate(-50%,-50%) scale(1.14)}
      100%{opacity:.78; transform:translate(-50%,-50%) scale(1)}
    }
    @keyframes glowPulse{0%,100%{opacity:.68} 50%{opacity:1}}
    @keyframes ringIn{
      0%{opacity:0; transform:translate(-50%,-50%) scale(.15)}
      70%{opacity:.9; transform:translate(-50%,-50%) scale(1.07)}
      100%{opacity:.72; transform:translate(-50%,-50%) scale(1)}
    }
    @keyframes ringFloat{
      0%,100%{transform:translate(-50%,-50%) translateY(0)}
      50%{transform:translate(-50%,-50%) translateY(-4px)}
    }
    @keyframes ringSpin{from{rotate:0deg} to{rotate:360deg}}
    @keyframes labelIn{
      0%{opacity:0; transform:translate(-50%,-50%) scale(.7)}
      100%{opacity:1; transform:translate(-50%,-50%) scale(1)}
    }
    @keyframes labelFloat{
      0%,100%{transform:translate(-50%,-50%) translateY(0)}
      50%{transform:translate(-50%,-50%) translateY(-4px)}
    }
    @keyframes overlayIn{
      0%{opacity:0; filter:brightness(1.15)}
      100%{opacity:1; filter:brightness(1)}
    }

    @media (max-width: 900px){
      .legend{display:none}
      .frame{width:100vw}
      .palm{width:8.7%}
      .ring{width:10.8%}
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="welcome-wrap">
      <div class="welcome">
        <h1>Welcome to Elythera</h1>
        <p>Activation sequence begins</p>
      </div>
    </div>

    <div class="stage">
      <div class="frame" id="frame">
        <img class="base" src="assets/elythera/elythera_team_base.png" alt="Elythera team base">

        <div class="effects">
          <div class="palm vixen"></div>
          <div class="ring vixen"><div class="spark"></div></div>
          <div class="label vixen">Identifier</div>

          <div class="palm mareoj"></div>
          <div class="ring mareoj"><div class="spark"></div></div>
          <div class="label mareoj">Pond</div>

          <div class="palm vel"></div>
          <div class="ring vel"><div class="spark"></div></div>
          <div class="label vel">Archive</div>

          <div class="palm lyra"></div>
          <div class="ring lyra"><div class="spark"></div></div>
          <div class="label lyra">PhotoHouse</div>

          <div class="palm uniq"></div>
          <div class="ring uniq"><div class="spark"></div></div>
          <div class="label uniq">Locator</div>
        </div>

        <canvas id="particles"></canvas>

        <img class="overlay" src="assets/elythera/elythera_team_overlay.png" alt="Elythera team overlay with logos">
      </div>
    </div>

    <div class="legend">Only two images needed • base + overlay</div>
  </div>

  <script>
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    const frame = document.getElementById('frame');

    function resizeCanvas(){
      const dpr = window.devicePixelRatio || 1;
      const rect = frame.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const palms = [
      {x:0.1415, y:0.5525, color:'#71d6ff', delay:3550},
      {x:0.3320, y:0.5600, color:'#72ff8b', delay:3900},
      {x:0.5015, y:0.5695, color:'#c087ff', delay:4250},
      {x:0.6725, y:0.5620, color:'#ffb25a', delay:4600},
      {x:0.8505, y:0.5535, color:'#66d8ff', delay:4950},
    ];

    let particles = [];

    function hexToRgba(hex, a){
      const h = hex.replace('#','');
      const n = parseInt(h,16);
      const r = (n >> 16) & 255;
      const g = (n >> 8) & 255;
      const b = n & 255;
      return `rgba(${r},${g},${b},${a})`;
    }

    function spawnPalmBurst(palm){
      const rect = frame.getBoundingClientRect();
      const cx = rect.width * palm.x;
      const cy = rect.height * palm.y;

      for(let i=0;i<36;i++){
        particles.push({
          cx, cy,
          x: cx,
          y: cy,
          r: 12 + Math.random()*34,
          ang: Math.random()*Math.PI*2,
          drift: -8 - Math.random()*16,
          size: 1 + Math.random()*2.3,
          life: 0,
          max: 120 + Math.random()*80,
          color: palm.color
        });
      }
    }

    palms.forEach(p => {
      setTimeout(() => spawnPalmBurst(p), p.delay + 420);
    });

    function render(){
      const rect = frame.getBoundingClientRect();
      ctx.clearRect(0,0,rect.width,rect.height);

      particles = particles.filter(p => p.life < p.max);

      for(const p of particles){
        p.life++;
        const t = p.life / p.max;
        const x = p.cx + Math.cos(p.ang + t*6) * p.r * (1 - t*0.35);
        const y = p.cy + Math.sin(p.ang + t*5) * p.r * 0.4 + p.drift*t;
        const a = Math.max(0, 0.95*(1-t));

        ctx.beginPath();
        ctx.fillStyle = hexToRgba(p.color, a);
        ctx.shadowColor = hexToRgba(p.color, a);
        ctx.shadowBlur = 16;
        ctx.arc(x, y, p.size, 0, Math.PI*2);
        ctx.fill();
      }

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
