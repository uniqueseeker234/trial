<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<title>UI Test</title>

<style>

/* ===== BODY ===== */
body {
  margin: 0;
  background: radial-gradient(circle at center, #000814, #000);
  font-family: 'Inter', sans-serif;
  color: white;
}

/* TITLE */
.title {
  text-align: center;
  margin-top: 20px;
  font-family: 'Orbitron', sans-serif;
  font-size: 20px;
  color: cyan;
  text-shadow: 0 0 10px cyan;
}

/* CONTAINER */
.container {
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ===== CARD ===== */
.card {
  position: relative;
  height: 110px;
  border-radius: 18px;
  overflow: hidden;
  backdrop-filter: blur(12px);
  transition: 0.3s;
}

/* ===== IMAGE BACKGROUND ===== */
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: url("images2/file_0000000022fc7208a8adcba8c24ad6da.png") center/cover no-repeat;
  z-index: 0;
}

/* LIGHT OVERLAY */
.card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.15);
  z-index: 1;
}

/* TEXT */
.card h2 {
  position: absolute;
  bottom: 15px;
  left: 15px;
  margin: 0;
  font-size: 16px;
  z-index: 2;
}

/* ===== COLORS ===== */
.search { border: 1px solid cyan; }
.search:hover { box-shadow: 0 0 20px cyan, 0 0 40px cyan; }

.explore { border: 1px solid lime; }
.explore:hover { box-shadow: 0 0 20px lime, 0 0 40px lime; }

.compare { border: 1px solid violet; }
.compare:hover { box-shadow: 0 0 20px violet, 0 0 40px violet; }

/* ===== INDIA SPECIAL ===== */
.india {
  background: black;
  border: 1px solid cyan;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* REMOVE BG IMAGE */
.india::before {
  display: none;
}
.india::after {
  display: none;
}

/* INDIA IMAGE */
.india-img {
  position: absolute;
  width: 70%;

  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  z-index: 1;
  pointer-events: none;
}
/* INDIA TEXT */
.india h2 {
  position: absolute;
  bottom: 10px;
  left: 15px;
  z-index: 2;
}

/* INDIA GLOW */
.india:hover {
  box-shadow: 0 0 25px cyan, 0 0 50px cyan;
}

/* ===== CONTROLS ===== */
.controls {
  margin: 20px;
  padding: 10px;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
  backdrop-filter: blur(10px);
  font-size: 12px;
}

.controls input {
  width: 100%;
  margin-bottom: 10px;
}

</style>
</head>

<body>

<div class="title">ALGAE ARCHIVE SYSTEM</div>

<div class="container">

  <div class="card search">
    <h2>SEARCH ALGAE</h2>
  </div>

  <div class="card explore">
    <h2>EXPLORE WORLD</h2>
  </div>

  <div class="card compare">
    <h2>COMPARE ALGAE</h2>
  </div>

  <!-- INDIA CARD -->
  <div class="card india">
    <img src="images2/india-map.png" class="india-img">
    <h2>COMMON ALGAE IN INDIA</h2>
  </div>

</div>

<!-- SLIDER CONTROLS -->
<div class="controls">
  <label>Size</label>
  <input type="range" min="40" max="100" value="70" id="sizeSlider">

  <label>Vertical Position</label>
  <input type="range" min="-50" max="50" value="0" id="ySlider">
</div>

<script>
const img = document.querySelector(".india-img");

const sizeSlider = document.getElementById("sizeSlider");
const ySlider = document.getElementById("ySlider");

sizeSlider.addEventListener("input", () => {
  img.style.width = sizeSlider.value + "%";
});

ySlider.addEventListener("input", () => {
  img.style.transform = "translateY(" + ySlider.value + "px)";
});
</script>

</body>
</html>
