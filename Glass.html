<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Algae Gallery</title>

<style>
body{
  margin:0;
  background:#000814;
  font-family:sans-serif;
  color:white;
}

.title{
  text-align:center;
  padding:15px;
  font-size:22px;
  color:cyan;
}

/* GRID */
.gallery{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(120px,1fr));
  gap:10px;
  padding:10px;
}

/* IMAGE */
.gallery img{
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:10px;
  cursor:pointer;
  border:1px solid cyan;
  transition:0.3s;
}

.gallery img:hover{
  transform:scale(1.05);
  box-shadow:0 0 10px cyan;
}
</style>
</head>

<body>

<div class="title">ALGAE GALLERY</div>

<div class="gallery">

  <!-- SAMPLE IMAGES (replace gradually) -->
  <img src="images2/Cladophora1.jpg" onerror="this.src='images2/default.jpg'">
  <img src="images2/Ulva lactuca1.jpg" onerror="this.src='images2/default.jpg'">
  <img src="images2/Chlorella1.jpg" onerror="this.src='images2/default.jpg'">
  <img src="images2/Spirogyra1.jpg" onerror="this.src='images2/default.jpg'">
  <img src="images2/Botryococcus1.jpg" onerror="this.src='images2/default.jpg'">
  <img src="images2/Polysiphonia1.jpg" onerror="this.src='images2/default.jpg'">

</div>

</body>
</html>
