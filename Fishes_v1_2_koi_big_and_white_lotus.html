<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<title>UI Test</title>

<style>

/* ===== BODY ===== */
body {
  margin: 0;
  background: radial-gradient(circle at center, #000814, #000);
  font-family: 'Inter', sans-serif;
  color: white;
}

/* TITLE */
.title {
  text-align: center;
  margin-top: 20px;
  font-family: 'Orbitron', sans-serif;
  font-size: 20px;
  color: cyan;
  text-shadow: 0 0 10px cyan;
}

/* CONTAINER */
.container {
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ===== CARD ===== */
.card {
  position: relative;
  height: 110px;
  width: 100%;
  border-radius: 18px;
  overflow: hidden;
  backdrop-filter: blur(12px);
  transition: 0.3s;
}

/* ===== VIDEO ===== */
.bg-video {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  top: 0;
  left: 0;
  z-index: 0;
}

/* TEXT */
.card h2 {
  position: absolute;
  bottom: 15px;
  left: 15px;
  margin: 0;
  font-size: 16px;
  z-index: 2;
}

/* ===== COLORS ===== */
.search { border: 1px solid cyan; }
.search:hover { box-shadow: 0 0 20px cyan, 0 0 40px cyan; }

.explore { border: 1px solid lime; }
.explore:hover { box-shadow: 0 0 20px lime, 0 0 40px lime; }

.compare { border: 1px solid violet; }
.compare:hover { box-shadow: 0 0 20px violet, 0 0 40px violet; }

.india { border: 1px solid cyan; }
.india:hover { box-shadow: 0 0 25px cyan, 0 0 50px cyan; }

/* ===== CONTROLS ===== */
.controls {
  margin: 20px;
  padding: 10px;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
  backdrop-filter: blur(10px);
  font-size: 12px;
}

.controls input {
  width: 100%;
  margin-bottom: 10px;
}

@media (min-width: 768px) {
  .container {
    max-width: 700px;
    margin: auto;
  }
  .card {
    height: 150px;
  }
}

</style>
</head>

<body>

<div class="title">ALGAE ARCHIVE SYSTEM</div>

<div class="container">

  <div class="card search" id="searchCard">
    <video autoplay muted loop playsinline class="bg-video">
      <source src="images2/search.mp4" type="video/mp4">
    </video>
    <h2>SEARCH ALGAE</h2>
  </div>

  <div class="card explore" id="exploreCard">
    <video autoplay muted loop playsinline class="bg-video">
      <source src="images2/explore.mp4" type="video/mp4">
    </video>
    <h2>EXPLORE WORLD</h2>
  </div>

  <div class="card compare" id="compareCard">
    <video autoplay muted loop playsinline class="bg-video">
      <source src="images2/compare.mp4" type="video/mp4">
    </video>
    <h2>COMPARE ALGAE</h2>
  </div>

  <div class="card india" id="indiaCard">
    <video autoplay muted loop playsinline class="bg-video">
      <source src="images2/india.mp4" type="video/mp4">
    </video>
    <h2>COMMON ALGAE IN INDIA</h2>
  </div>

</div>

<!-- ===== BUTTON SLIDERS ===== -->
<div class="controls">

  <h3>SEARCH BUTTON</h3>
  Width: <span id="swVal">100</span>%  
  <input type="range" min="60" max="120" value="100" id="sw">
  Height: <span id="shVal">110</span>px  
  <input type="range" min="80" max="200" value="110" id="sh">
  Y: <span id="syVal">0</span>px  
  <input type="range" min="-50" max="50" value="0" id="sy">

  <h3>EXPLORE BUTTON</h3>
  Width: <span id="ewVal">100</span>%  
  <input type="range" min="60" max="120" value="100" id="ew">
  Height: <span id="ehVal">110</span>px  
  <input type="range" min="80" max="200" value="110" id="eh">
  Y: <span id="eyVal">0</span>px  
  <input type="range" min="-50" max="50" value="0" id="ey">

  <h3>COMPARE BUTTON</h3>
  Width: <span id="cwVal">100</span>%  
  <input type="range" min="60" max="120" value="100" id="cw">
  Height: <span id="chVal">110</span>px  
  <input type="range" min="80" max="200" value="110" id="ch">
  Y: <span id="cyVal">0</span>px  
  <input type="range" min="-50" max="50" value="0" id="cy">

  <h3>INDIA BUTTON</h3>
  Width: <span id="iwVal">100</span>%  
  <input type="range" min="60" max="120" value="100" id="iw">
  Height: <span id="ihVal">110</span>px  
  <input type="range" min="80" max="200" value="110" id="ih">
  Y: <span id="iyVal">0</span>px  
  <input type="range" min="-50" max="50" value="0" id="iy">

</div>

<script>

function control(cardId, w, h, y, wVal, hVal, yVal) {

  const card = document.getElementById(cardId);

  function update() {
    card.style.width = w.value + "%";
    card.style.height = h.value + "px";
    card.style.transform = "translateY(" + y.value + "px)";

    wVal.textContent = w.value;
    hVal.textContent = h.value;
    yVal.textContent = y.value;
  }

  w.addEventListener("input", update);
  h.addEventListener("input", update);
  y.addEventListener("input", update);

  update();
}

control(
  "searchCard",
  sw, sh, sy,
  swVal, shVal, syVal
);

control(
  "exploreCard",
  ew, eh, ey,
  ewVal, ehVal, eyVal
);

control(
  "compareCard",
  cw, ch, cy,
  cwVal, chVal, cyVal
);

control(
  "indiaCard",
  iw, ih, iy,
  iwVal, ihVal, iyVal
);

</script>

</body>
</html>
