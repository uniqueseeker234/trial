
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elythera Hotspot Debug</title>

<style>
body{
margin:0;
background:#000;
color:white;
font-family:Arial,Helvetica,sans-serif;
overflow-x:hidden;
}

/* TEAM AREA */

.scene{
display:flex;
justify-content:center;
align-items:center;
height:70vh;
margin-top:40px;
}

.team{
position:relative;
width:900px;
max-width:95%;
}

.team img{
width:100%;
position:absolute;
top:0;
left:0;
opacity:0;
transition:opacity 1s;
}

.team img.active{
opacity:1;
}

/* HOTSPOTS */

.hand-links{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
opacity:0;
}

.hand-links.show{
pointer-events:auto;
opacity:1;
}

/* DEBUG VISUAL CIRCLES */

.hand{
position:absolute;
width:95px;
height:95px;
transform:translate(-50%,-50%);
border-radius:50%;
background:red;
opacity:0.35;
border:2px solid white;
}

/* CURRENT PALM POSITIONS */

.h1{left:14.5%; top:66%;}
.h2{left:33.8%; top:66%;}
.h3{left:50.8%; top:67%;}
.h4{left:67.8%; top:66%;}
.h5{left:85.5%; top:65%;}

</style>
</head>

<body>

<div class="scene">

<div class="team">

<img class="frame active" src="assets/elythera/frame0_base.png">
<img class="frame" src="assets/elythera/frame1_glow.png">
<img class="frame" src="assets/elythera/frame2_glowstrong.png">
<img class="frame" src="assets/elythera/frame3_orb.png">
<img class="frame" src="assets/elythera/frame4_orbstrong.png">
<img class="frame" src="assets/elythera/frame5_logo.png">

<div class="hand-links" id="handLinks">

<a class="hand h1" href="#"></a>
<a class="hand h2" href="#"></a>
<a class="hand h3" href="#"></a>
<a class="hand h4" href="#"></a>
<a class="hand h5" href="#"></a>

</div>

</div>

</div>

<script>

const frames=document.querySelectorAll(".frame")
const handLinks=document.getElementById("handLinks")

let i=0

const interval=setInterval(()=>{

frames[i].classList.remove("active")
i++
frames[i].classList.add("active")

if(i===frames.length-1){
handLinks.classList.add("show")
clearInterval(interval)
}

},1800)

</script>

</body>
</html>
