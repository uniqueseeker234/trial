<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compare Algae</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  min-height:100vh;
  background: radial-gradient(circle at center, #020617, #000814);
  overflow:auto; /* ✅ FIXED SCROLL */
  font-family:sans-serif;
}

/* TITLE */
.title{
  text-align:center;
  font-family:'Cinzel', serif;
  font-size:32px;
  color:gold;
  letter-spacing:6px;
  margin-top:40px;
}

/* CONTAINER */
.container{
  width:95%;
  max-width:900px;
  margin:40px auto;
}

/* BOX */
.box{
  position:relative; /* ✅ VERY IMPORTANT */
  height:520px;
}

/* LINES */
.line{
  position:absolute;
  background:gold;
  box-shadow:0 0 15px gold,0 0 40px rgba(255,215,0,0.5);
}

/* OUTER */
.top{top:0;left:0;height:3px;width:100%;}
.right{top:0;right:0;width:3px;height:100%;}
.bottom{bottom:0;right:0;height:3px;width:100%;}
.left{bottom:0;left:0;width:3px;height:100%;}

/* CENTER */
.center{
  top:0;left:50%;width:3px;height:100%;
  transform:translateX(-50%);
}

/* ROWS */
.r1{top:70px;height:3px;width:100%;}
.r2{top:200px;height:3px;width:100%;} /* ✅ BIG IMAGE BOX */
.r3{top:300px;height:3px;width:100%;}
.r4{top:380px;height:3px;width:100%;}
.r5{top:450px;height:3px;width:100%;}

/* HEADINGS */
.head{
  position:absolute;
  top:20px;
  width:50%;
  text-align:center;
  color:gold;
  font-size:20px;
  cursor:pointer;
}

.leftHead{left:0;}
.rightHead{right:0;}

/* IMAGE */
.algae-img{
  width:130px;
  height:130px;
  object-fit:cover;
  border-radius:14px;
  box-shadow:0 0 15px rgba(255,215,0,0.4);
}

/* IMAGE POSITION */
/* IMAGE POSITION (FIXED) */
#imgLeft, #imgRight{
  position:absolute;
  top:140px;              /* 🔥 move into 2nd box */
  width:50%;
  height:140px;           /* 🔥 match image area */
  display:flex;
  align-items:center;     /* 🔥 vertical center */
  justify-content:center; /* 🔥 horizontal center */
}

/* PANEL */
.panel{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(0.95);
  width:90%;
  max-width:400px;
  height:75vh;
  background:#020c1a;
  border-radius:15px;
  display:flex;
  flex-direction:column;
  opacity:0;
  pointer-events:none;
  transition:0.3s;
}

.panel.active{
  opacity:1;
  pointer-events:auto;
  transform:translate(-50%,-50%) scale(1);
}

.panel-header{
  display:flex;
  justify-content:space-between;
  padding:10px;
  color:white;
}

.close{
  cursor:pointer;
}

.search{
  margin:10px;
  padding:10px;
  border-radius:8px;
  border:none;
}

.list{
  flex:1;
  overflow-y:auto;
}

/* ITEM */
.item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  color:white;
  cursor:pointer;
  border-bottom:1px solid #222;
}

.item img{
  width:45px;
  height:45px;
  border-radius:6px;
}
</style>
</head>

<body>

<div class="title">COMPARE ALGAE</div>

<div class="container">
  <div class="box">

    <div class="line top"></div>
    <div class="line right"></div>
    <div class="line bottom"></div>
    <div class="line left"></div>

    <div class="line center"></div>

    <div class="line r1"></div>
    <div class="line r2"></div>
    <div class="line r3"></div>
    <div class="line r4"></div>
    <div class="line r5"></div>

    <!-- HEADINGS -->
    <div class="head leftHead" id="algae1" onclick="openPanel('left')">Algae 1</div>
    <div class="head rightHead" id="algae2" onclick="openPanel('right')">Algae 2</div>

    <!-- IMAGES -->
    <div id="imgLeft"></div>
    <div id="imgRight"></div>

  </div>
</div>

<!-- PANEL -->
<div class="panel" id="panel">

  <div class="panel-header">
    <span>Select Algae</span>
    <span class="close" onclick="closePanel()">✖</span>
  </div>

  <input class="search" placeholder="Search algae..." onkeyup="filterList(this.value)">

  <div id="list" class="list">

<div class="item" onclick="selectAlgae('Cladophora','images2/Cladophora1.jpg')"><img src="images2/Cladophora1.jpg">Cladophora</div>
<div class="item" onclick="selectAlgae('Chlorella','images2/Chlorella1.jpg')"><img src="images2/Chlorella1.jpg">Chlorella</div>
<div class="item" onclick="selectAlgae('Spirogyra','images2/Spirogyra1.jpg')"><img src="images2/Spirogyra1.jpg">Spirogyra</div>

  </div>
</div>

<script>
let currentSide = "";

function openPanel(side){
  currentSide = side;
  document.getElementById("panel").classList.add("active");
}

function closePanel(){
  document.getElementById("panel").classList.remove("active");
}

function filterList(val){
  let items=document.querySelectorAll(".item");
  val=val.toLowerCase();

  items.forEach(i=>{
    i.style.display=i.innerText.toLowerCase().includes(val)?"flex":"none";
  });
}

function selectAlgae(name, img){

  if(currentSide === "left"){
    document.getElementById("algae1").innerText = name;
    document.getElementById("imgLeft").innerHTML =
      `<img src="${img}" class="algae-img">`;
  }

  if(currentSide === "right"){
    document.getElementById("algae2").innerText = name;
    document.getElementById("imgRight").innerHTML =
      `<img src="${img}" class="algae-img">`;
  }

  closePanel();
}
</script>

</body>
</html>
