<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compare Entry Animation</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at center, #020617, #000814);
  overflow:hidden;
}

/* GOLDEN BOX */
.compare-box{
  position:relative;
  width:80%;
  max-width:700px;
  height:300px;
  border-radius:12px;
  background: rgba(255,255,255,0.02);
  backdrop-filter: blur(10px);

  opacity:0;
  transform: scale(0.8);
  animation: appear 1s ease forwards;
  animation-delay: 0.5s;
}

/* BORDER DRAW EFFECT */
.compare-box::before,
.compare-box::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:12px;
  pointer-events:none;
}

/* GOLD LINE */
.compare-box::before{
  border:2px solid transparent;
  border-image: linear-gradient(90deg, gold, #fff5cc, gold) 1;

  clip-path: inset(0 100% 100% 0);
  animation: drawBorder 2s ease forwards;
  animation-delay: 1s;
}

/* GLOW */
.compare-box::after{
  border:2px solid gold;
  box-shadow: 0 0 25px gold, 0 0 60px rgba(255,215,0,0.4);
  opacity:0;
  animation: glowIn 1.5s ease forwards;
  animation-delay: 2.5s;
}

/* CONTENT */
.content{
  color:gold;
  text-align:center;
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:24px;
  letter-spacing:2px;

  opacity:0;
  animation: fadeIn 1s ease forwards;
  animation-delay: 3s;
}

/* ANIMATIONS */

@keyframes appear{
  to{
    opacity:1;
    transform: scale(1);
  }
}

@keyframes drawBorder{
  0%{
    clip-path: inset(0 100% 100% 0);
  }
  25%{
    clip-path: inset(0 0 100% 0);
  }
  50%{
    clip-path: inset(0 0 0 0);
  }
  75%{
    clip-path: inset(0 0 0 0);
  }
  100%{
    clip-path: inset(0 0 0 0);
  }
}

@keyframes glowIn{
  to{
    opacity:1;
  }
}

@keyframes fadeIn{
  to{
    opacity:1;
  }
}
</style>

</head>

<body>

<div class="compare-box">
  <div class="content">
    COMPARE ALGAE
  </div>
</div>

</body>
</html>
