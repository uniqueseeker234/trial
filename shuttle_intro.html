<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission Elythera Shuttle Test</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
    }
    #msg {
      position: fixed;
      top: 12px;
      left: 12px;
      color: white;
      font-family: Arial, sans-serif;
      background: rgba(0,0,0,0.45);
      padding: 8px 10px;
      border-radius: 10px;
      z-index: 10;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="msg">Loading corridor...</div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const msg = document.getElementById('msg');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      2000
    );
    camera.position.set(0, 2, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 2.0);
    scene.add(hemi);

    const dir = new THREE.DirectionalLight(0xffffff, 1.5);
    dir.position.set(5, 10, 7);
    scene.add(dir);

    const grid = new THREE.GridHelper(20, 20, 0x44aaff, 0x224466);
    scene.add(grid);

    const axes = new THREE.AxesHelper(3);
    scene.add(axes);

    const loader = new GLTFLoader();

    loader.load(
      './models/corridor.glb',
      (gltf) => {
        const model = gltf.scene;

        model.position.set(0, 0, 0);

        // Start small because many downloaded GLB interiors are huge.
        model.scale.set(0.01, 0.01, 0.01);

        scene.add(model);
        msg.textContent = 'Corridor loaded';
        console.log('GLB loaded successfully', gltf);
      },
      (xhr) => {
        if (xhr.total) {
          const percent = ((xhr.loaded / xhr.total) * 100).toFixed(0);
          msg.textContent = `Loading corridor... ${percent}%`;
        }
      },
      (error) => {
        msg.textContent = 'Failed to load corridor.glb';
        console.error('GLB load error:', error);
      }
    );

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
