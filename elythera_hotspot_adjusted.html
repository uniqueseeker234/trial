
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elythera Intro Hub</title>

<style>
body{
margin:0;
background:#000;
color:white;
font-family:Arial,Helvetica,sans-serif;
overflow-x:hidden;
}

/* TEAM AREA */

.scene{
display:flex;
justify-content:center;
align-items:center;
height:70vh;
margin-top:40px;
}

.team{
position:relative;
width:900px;
max-width:95%;
}

.team img{
width:100%;
position:absolute;
top:0;
left:0;
opacity:0;
transition:opacity 1s;
}

.team img.active{
opacity:1;
}

/* HOTSPOTS (INVISIBLE CLICK AREAS) */

.hand-links{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
opacity:0;
}

.hand-links.show{
pointer-events:auto;
opacity:1;
}

/* UPDATED SIZE (only change) */

.hand{
position:absolute;
width:90px;
height:90px;
transform:translate(-50%,-50%);
border-radius:50%;
background:transparent;
}

/* UPDATED PALM POSITIONS (only change) */

.h1{left:14.5%; top:56%;}
.h2{left:33.8%; top:56%;}
.h3{left:50.8%; top:57%;}
.h4{left:67.8%; top:56%;}
.h5{left:85.5%; top:55.5%;}

/* HUB */

.hub{
margin-top:60px;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.card{
background:#05080f;
border:1px solid rgba(255,255,255,.08);
border-radius:15px;
padding:20px;
text-align:center;
text-decoration:none;
color:white;
transition:.3s;
}

.card:hover{
transform:translateY(-6px);
box-shadow:0 0 20px rgba(255,255,255,.15);
}

.card img{
width:110px;
}

/* COLOR TEXT */

.identifier h3{color:#5edbff;}
.pond h3{color:#4cff79;}
.archive h3{color:#b96bff;}
.photohouse h3{color:#ffb347;}
.locator h3{color:#5edbff;}

.card p{
font-size:13px;
opacity:.8;
}

</style>
</head>

<body>

<div class="scene">

<div class="team">

<img class="frame active" src="assets/elythera/frame0_base.png">
<img class="frame" src="assets/elythera/frame1_glow.png">
<img class="frame" src="assets/elythera/frame2_glowstrong.png">
<img class="frame" src="assets/elythera/frame3_orb.png">
<img class="frame" src="assets/elythera/frame4_orbstrong.png">
<img class="frame" src="assets/elythera/frame5_logo.png">

<div class="hand-links" id="handLinks">

<a class="hand h1" href="identifier.html"></a>
<a class="hand h2" href="pond.html"></a>
<a class="hand h3" href="archive.html"></a>
<a class="hand h4" href="photohouse.html"></a>
<a class="hand h5" href="locator.html"></a>

</div>

</div>

</div>

<div class="hub">

<div class="grid">

<a class="card identifier" href="identifier.html">
<img src="assets/elythera/logo_identifier_black.png">
<h3>IDENTIFIER</h3>
<p>The microscope system used to identify algae.</p>
</a>

<a class="card pond" href="pond.html">
<img src="assets/elythera/logo_pond_black.png">
<h3>ALGAL POND</h3>
<p>The living pond ecosystem explorer.</p>
</a>

<a class="card archive" href="archive.html">
<img src="assets/elythera/logo_archive_black.png">
<h3>ARCHIVE</h3>
<p>The scientific database storing algae records.</p>
</a>

<a class="card photohouse" href="photohouse.html">
<img src="assets/elythera/logo_camera_black.png">
<h3>PHOTOHOUSE</h3>
<p>Enhance and prepare algae images.</p>
</a>

<a class="card locator" href="locator.html">
<img src="assets/elythera/logo_locator_black.png">
<h3>LOCATOR</h3>
<p>Map showing algae discovery locations.</p>
</a>

</div>

</div>

<script>

const frames=document.querySelectorAll(".frame")
const handLinks=document.getElementById("handLinks")

let i=0

const interval=setInterval(()=>{

frames[i].classList.remove("active")
i++
frames[i].classList.add("active")

if(i===frames.length-1){
handLinks.classList.add("show")
clearInterval(interval)
}

},1800)

</script>

</body>
</html>
