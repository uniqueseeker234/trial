<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLB Room Test - Auto Fit</title>
<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
  font-family:Arial, sans-serif;
}
#msg{
  position:fixed;
  top:12px;
  left:12px;
  color:white;
  background:rgba(0,0,0,0.5);
  padding:8px 10px;
  border-radius:10px;
  z-index:10;
  font-size:14px;
}
</style>

<script type="importmap">
{
 "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>
</head>
<body>

<div id="msg">Loading room...</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const msg = document.getElementById('msg');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  2000
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* lights */
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 2);
scene.add(hemi);

const dir = new THREE.DirectionalLight(0xffffff, 2);
dir.position.set(5, 10, 7);
scene.add(dir);

const fill = new THREE.PointLight(0xffffff, 3);
fill.position.set(-4, 3, 4);
scene.add(fill);

let room = null;
let pivot = new THREE.Group();
scene.add(pivot);

const loader = new GLTFLoader();

loader.load(
  './models/room.glb',
  (gltf) => {
    room = gltf.scene;

    // Start larger than before so the model is visible.
    room.scale.set(1, 1, 1);
    pivot.add(room);

    // Make sure inner faces also render if needed.
    room.traverse((child) => {
      if (child.isMesh && child.material) {
        child.material.side = THREE.DoubleSide;
      }
    });

    // Compute bounds, center the room, and auto-fit the camera.
    const box = new THREE.Box3().setFromObject(room);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    room.position.sub(center);

    const maxDim = Math.max(size.x, size.y, size.z);
    const fov = camera.fov * (Math.PI / 180);
    let cameraZ = Math.abs((maxDim / 2) / Math.tan(fov / 2));
    cameraZ *= 1.35;

    camera.position.set(0, size.y * 0.15, cameraZ);
    camera.lookAt(0, size.y * 0.05, 0);

    msg.textContent = 'Room loaded';
    console.log('Room loaded', {size, center, cameraZ});
  },
  (xhr) => {
    if (xhr.total) {
      const percent = ((xhr.loaded / xhr.total) * 100).toFixed(0);
      msg.textContent = `Loading room... ${percent}%`;
    }
  },
  (err) => {
    msg.textContent = 'Failed to load room.glb';
    console.error('Failed to load GLB', err);
  }
);

function animate(){
  requestAnimationFrame(animate);

  if (room) {
    pivot.rotation.y += 0.003;
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
