<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Microscope Lab Viewer</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070c;
  font-family:system-ui;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  top:14px;
  left:14px;
  z-index:10;

  padding:12px 14px;
  border-radius:16px;

  background:rgba(0,0,0,0.45);
  backdrop-filter:blur(10px);

  color:white;
  border:1px solid rgba(255,255,255,0.08);
}

#hud h1{
  margin:0;
  font-size:14px;
}

#hud p{
  margin:6px 0 0;
  font-size:12px;
  opacity:.8;
  line-height:1.4;
}
</style>
</head>

<body>

<div id="hud">
  <h1>Microscope Lab Viewer</h1>
  <p>
    Slight mouse movement = head movement<br>
    Future: microscope interaction system
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
(() => {

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);

renderer.outputEncoding = THREE.sRGBEncoding;

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x05070c);

scene.fog = new THREE.Fog(
  0x070a12,
  5,
  18
);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth/window.innerHeight,
  0.01,
  100
);





/* =========================
   HUMAN SEATED POV
========================= */

const eye = new THREE.Vector3(
  0.95,
  1.15,
  1.45
);

let yaw = 0;
let pitch = -0.08;

function updateLook(){

  const dir = new THREE.Vector3(
    Math.cos(pitch) * Math.sin(yaw),
    Math.sin(pitch),
    -Math.cos(pitch) * Math.cos(yaw)
  );

  camera.position.copy(eye);

  camera.lookAt(
    eye.clone().add(dir)
  );
}

updateLook();





/* =========================
   MOUSE HEAD MOVEMENT
========================= */

window.addEventListener("mousemove", e => {

  const nx = (e.clientX / window.innerWidth) - 0.5;
  const ny = (e.clientY / window.innerHeight) - 0.5;

  yaw = -nx * 0.55;

  pitch = -0.08 - ny * 0.18;

  /* LIMITS */

  yaw = Math.max(
    -0.5,
    Math.min(0.5, yaw)
  );

  pitch = Math.max(
    -0.28,
    Math.min(0.15, pitch)
  );

  updateLook();
});





/* =========================
   LIGHTING
========================= */

const hemi = new THREE.HemisphereLight(
  0x9fdcff,
  0x07101f,
  0.65
);

scene.add(hemi);

const key = new THREE.DirectionalLight(
  0xffffff,
  0.85
);

key.position.set(6,8,4);

key.castShadow = true;

key.shadow.mapSize.set(2048,2048);

scene.add(key);

const rim = new THREE.DirectionalLight(
  0x7fe7d2,
  0.45
);

rim.position.set(-5,3,-2);

scene.add(rim);

const ambient = new THREE.AmbientLight(
  0xffffff,
  0.30
);

scene.add(ambient);





/* =========================
   LOADER
========================= */

const loader = new THREE.GLTFLoader();

function loadModel(path){

  return new Promise((resolve,reject)=>{

    loader.load(
      path,
      gltf => resolve(gltf.scene),
      undefined,
      reject
    );

  });

}





/* =========================
   HELPERS
========================= */

function fixMaterials(root){

  root.traverse(o => {

    if(!o.isMesh) return;

    o.castShadow = true;
    o.receiveShadow = true;

    const mats = Array.isArray(o.material)
      ? o.material
      : [o.material];

    mats.forEach(m => {

      if(!m) return;

      m.side = THREE.DoubleSide;

      if(m.map){
        m.map.encoding = THREE.sRGBEncoding;
      }

      if("metalness" in m){
        m.metalness *= 0.55;
      }

      if("roughness" in m){
        m.roughness = Math.min(
          1,
          m.roughness + 0.05
        );
      }

      m.needsUpdate = true;

    });

  });

}





/* =========================
   LOAD SCENE
========================= */

(async()=>{

/* ROOM */

const room = await loadModel("./room.glb");

fixMaterials(room);

scene.add(room);





/* TABLE */

const table = await loadModel(
  "./models/lumen_hologram_table.glb"
);

fixMaterials(table);

room.add(table);

table.position.set(
  1.60,
  0.10,
  -0.80
);

table.scale.set(
  0.75,
  0.75,
  0.75
);

table.rotation.y = -3.14;





/* MICROSCOPE */

const microscope = await loadModel(
  "./models/microscope.glb"
);

fixMaterials(microscope);

room.add(microscope);

microscope.position.set(
  1.54,
  0.45,
  -0.28
);

microscope.scale.set(
  0.14,
  0.14,
  0.14
);

microscope.rotation.set(
  -0.02,
  1.7,
  0
);





/* JOURNAL */

const journal = await loadModel(
  "./models/journal.glb"
);

fixMaterials(journal);

room.add(journal);

journal.position.set(
  1.58,
  0.37,
  -0.62
);

journal.scale.set(
  0.05,
  0.05,
  0.05
);

journal.rotation.set(
  -1.66,
  0.68,
  1.69
);





/* CHAIR */

const chair = await loadModel(
  "./round_chair.glb"
);

fixMaterials(chair);

const chairBox = new THREE.Box3()
.setFromObject(chair);

const chairCenter = new THREE.Vector3();

chairBox.getCenter(chairCenter);

chair.position.sub(chairCenter);

room.add(chair);

chair.position.set(
  -0.35,
  -0.15,
  1.50
);

chair.scale.set(
  0.40,
  0.40,
  0.40
);

chair.rotation.y = 0.05;

})();





/* =========================
   RENDER LOOP
========================= */

function animate(){

  requestAnimationFrame(animate);

  renderer.render(
    scene,
    camera
  );
}

animate();





/* =========================
   RESIZE
========================= */

window.addEventListener("resize", ()=>{

  camera.aspect =
    window.innerWidth /
    window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

})();
</script>

</body>
</html>
