<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algae Archive System</title>

<!-- GOOGLE FONT (FUTURISTIC) -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<style>

/* ===== BODY ===== */
body {
  margin: 0;
  background: radial-gradient(circle at center, #000814, #000);
  font-family: 'Inter', sans-serif;
  color: white;
}

/* ===== TITLE ===== */
.title {
  text-align: center;
  margin-top: 25px;
  font-family: 'Orbitron', sans-serif;
  font-size: 26px;
  letter-spacing: 2px;
  color: cyan;

  text-shadow:
    0 0 10px cyan,
    0 0 30px rgba(0,255,255,0.5);
}

/* ===== CONTAINER ===== */
.container {
  margin-top: 20px;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ===== GLASS PANEL BUTTON ===== */
.card-btn {
  position: relative;
  height: 120px;
  border-radius: 20px;

  backdrop-filter: blur(14px);
  background: rgba(255,255,255,0.05);

  border: 1px solid rgba(255,255,255,0.15);

  overflow: hidden;
  padding: 20px;

  display: flex;
  align-items: flex-end;

  transition: 0.3s;
}

/* ===== COLOR GLOW CENTER ===== */
.card-btn::before {
  content: "";
  position: absolute;
  width: 120px;
  height: 120px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  filter: blur(40px);
  opacity: 0.8;
}

/* COLORS */
.green::before { background: #00ff88; }
.blue::before { background: #00eaff; }
.brown::before { background: #ffb347; }
.red::before { background: #ff4d6d; }
.yellow::before { background: #ccff33; }

/* ===== TEXT ===== */
.card-btn h2 {
  margin: 0;
  font-size: 18px;
  letter-spacing: 1px;
  z-index: 2;
}

/* ===== HOVER EFFECT ===== */
.card-btn:hover {
  transform: scale(1.03);
  box-shadow: 0 0 30px rgba(0,255,255,0.3);
}

/* ===== RESPONSIVE ===== */
@media (min-width: 600px) {
  .container {
    max-width: 500px;
    margin: auto;
  }
}

</style>
</head>

<body>

<div class="title">ALGAE ARCHIVE SYSTEM</div>

<div class="container">

  <div class="card-btn green">
    <h2>SEARCH ALGAE</h2>
  </div>

  <div class="card-btn blue">
    <h2>EXPLORE ALGAE WORLD</h2>
  </div>

  <div class="card-btn brown">
    <h2>COMPARE ALGAE</h2>
  </div>

  <div class="card-btn red">
    <h2>COMMON ALGAE IN INDIA</h2>
  </div>

</div>

</body>
</html>
