<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Microscope Viewer • Seated POV</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#05070c;
  font-family:Arial,Helvetica,sans-serif;
}

canvas{
  display:block;
}

#ui{
  position:fixed;
  top:12px;
  left:12px;
  z-index:20;

  width:320px;

  background:rgba(0,0,0,0.55);
  backdrop-filter:blur(12px);

  border-radius:18px;
  padding:14px;

  color:white;

  border:1px solid rgba(255,255,255,0.12);
}

#ui h2{
  margin:0 0 12px;
  font-size:15px;
}

.row{
  margin-bottom:12px;
}

.row label{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  margin-bottom:4px;
}

input[type=range]{
  width:100%;
}

.small{
  font-size:11px;
  opacity:.7;
  line-height:1.4;
}
</style>
</head>

<body>

<div id="ui">

<h2>Microscope POV Controls</h2>

<div class="row">
<label>X Position <span id="vx"></span></label>
<input id="x" type="range" min="-10" max="10" step="0.01" value="2.53">
</div>

<div class="row">
<label>Y Position <span id="vy"></span></label>
<input id="y" type="range" min="-5" max="5" step="0.01" value="0.48">
</div>

<div class="row">
<label>Z Position <span id="vz"></span></label>
<input id="z" type="range" min="-10" max="10" step="0.01" value="-0.70">
</div>

<div class="row">
<label>Center Look Yaw <span id="vyaw"></span></label>
<input id="yaw" type="range" min="-3.14" max="3.14" step="0.01" value="-1.86">
</div>

<div class="row">
<label>Look Up / Down <span id="vpitch"></span></label>
<input id="pitch" type="range" min="-1" max="1" step="0.01" value="0.02">
</div>

<div class="small">
Mouse / finger drag = limited seated head movement.
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
(() => {

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x05070c);

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(window.innerWidth, window.innerHeight);

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

renderer.outputEncoding = THREE.sRGBEncoding;

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth/window.innerHeight,
  0.01,
  100
);

/* =========================
   LIGHTS
========================= */

const hemi = new THREE.HemisphereLight(
  0xffffff,
  0x222233,
  1.2
);

scene.add(hemi);

const dir = new THREE.DirectionalLight(
  0xffffff,
  1.1
);

dir.position.set(5,8,5);

dir.castShadow = true;

scene.add(dir);

/* =========================
   CAMERA VALUES
========================= */

const CENTER_YAW = -1.86;

const MIN_YAW = -2.05;
const MAX_YAW = -1.08;

let currentYaw = CENTER_YAW;
let currentPitch = 0.02;

/* =========================
   CAMERA POSITION
========================= */

const sliders = {
  x: document.getElementById("x"),
  y: document.getElementById("y"),
  z: document.getElementById("z"),
  yaw: document.getElementById("yaw"),
  pitch: document.getElementById("pitch")
};

const vals = {
  x: document.getElementById("vx"),
  y: document.getElementById("vy"),
  z: document.getElementById("vz"),
  yaw: document.getElementById("vyaw"),
  pitch: document.getElementById("vpitch")
};

function updateLabels(){

  vals.x.textContent = sliders.x.value;
  vals.y.textContent = sliders.y.value;
  vals.z.textContent = sliders.z.value;
  vals.yaw.textContent = sliders.yaw.value;
  vals.pitch.textContent = sliders.pitch.value;
}

function updateCamera(){

  camera.position.set(
    parseFloat(sliders.x.value),
    parseFloat(sliders.y.value),
    parseFloat(sliders.z.value)
  );

  const dir = new THREE.Vector3(
    Math.sin(currentYaw),
    currentPitch,
    -Math.cos(currentYaw)
  );

  camera.lookAt(
    camera.position.clone().add(dir)
  );

  updateLabels();
}

Object.values(sliders).forEach(s => {

  s.addEventListener("input", () => {

    currentYaw = parseFloat(sliders.yaw.value);
    currentPitch = parseFloat(sliders.pitch.value);

    updateCamera();
  });

});

/* =========================
   LIMITED HEAD MOVEMENT
========================= */

let dragging = false;
let lastX = 0;
let lastY = 0;

renderer.domElement.addEventListener("pointerdown", e => {

  dragging = true;

  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener("pointerup", () => {
  dragging = false;
});

window.addEventListener("pointermove", e => {

  if(!dragging) return;

  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;

  lastX = e.clientX;
  lastY = e.clientY;

  currentYaw -= dx * 0.003;

  currentPitch -= dy * 0.002;

  currentYaw = THREE.MathUtils.clamp(
    currentYaw,
    MIN_YAW,
    MAX_YAW
  );

  currentPitch = THREE.MathUtils.clamp(
    currentPitch,
    -0.15,
    0.18
  );

  updateCamera();
});

/* =========================
   LOAD MODELS
========================= */

const loader = new THREE.GLTFLoader();

function load(path){

  return new Promise((resolve,reject)=>{

    loader.load(
      path,
      g => resolve(g.scene),
      undefined,
      reject
    );

  });

}

(async()=>{

/* ROOM */

const room = await load("./room.glb");

scene.add(room);

room.traverse(o=>{

  if(!o.isMesh) return;

  o.castShadow = true;
  o.receiveShadow = true;

  const mats = Array.isArray(o.material)
    ? o.material
    : [o.material];

  mats.forEach(m=>{

    if(!m) return;

    m.side = THREE.DoubleSide;

    if(m.map){
      m.map.encoding = THREE.sRGBEncoding;
    }

  });

});

/* TABLE */

const table = await load("./models/lumen_hologram_table.glb");

room.add(table);

table.position.set(1.60, 0.10, -0.80);

table.scale.set(0.75,0.75,0.75);

table.rotation.y = -3.14;

/* MICROSCOPE */

const microscope = await load("./models/microscope.glb");

room.add(microscope);

microscope.position.set(1.54, 0.45, -0.28);

microscope.scale.set(0.14,0.14,0.14);

microscope.rotation.set(-0.02,1.7,0);

/* CHAIR */

const chair = await load("./round_chair.glb");

room.add(chair);

chair.position.set(-0.35, -0.15, 1.50);

chair.scale.set(0.40,0.40,0.40);

chair.rotation.y = 0.05;

/* JOURNAL */

const journal = await load("./models/journal.glb");

room.add(journal);

journal.position.set(1.58, 0.37, -0.62);

journal.scale.set(0.05,0.05,0.05);

journal.rotation.set(-1.66,0.68,1.69);

/* INITIAL CAMERA */

updateCamera();

})();

/* =========================
   RENDER LOOP
========================= */

function animate(){

  requestAnimationFrame(animate);

  renderer.render(scene,camera);
}

animate();

/* =========================
   RESIZE
========================= */

window.addEventListener("resize", ()=>{

  camera.aspect =
    window.innerWidth/window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

})();
</script>

</body>
</html>
