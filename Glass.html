<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Algae Gallery</title>

<!-- Handwritten style font -->
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#000814;
  font-family:sans-serif;
  color:white;
}

/* TITLE */
.title{
  text-align:center;
  padding:20px;
  font-size:24px;
  color:cyan;
  letter-spacing:2px;
}

/* GALLERY GRID */
.gallery{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(140px,1fr));
  gap:20px;
  padding:20px;
}

/* POLAROID CARD */
.polaroid{
  background:white;
  padding:10px 10px 15px;
  border-radius:6px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.6);
  text-align:center;
  transform: rotate(-2deg);
  transition:0.3s;
}

/* RANDOM ROTATION */
.polaroid:nth-child(even){
  transform: rotate(2deg);
}

/* HOVER EFFECT */
.polaroid:hover{
  transform: scale(1.08) rotate(0deg);
  animation: none;
}

/* IMAGE */
.polaroid img{
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:4px;
}

/* NAME TEXT */
.polaroid p{
  margin-top:8px;
  font-size:13px;
  color:black;
  font-family: 'Permanent Marker', cursive;
}
  /* FLOAT ANIMATION */
@keyframes float1 {
  0% { transform: translateY(0px) rotate(-2deg); }
  50% { transform: translateY(-8px) rotate(-1deg); }
  100% { transform: translateY(0px) rotate(-2deg); }
}

@keyframes float2 {
  0% { transform: translateY(0px) rotate(2deg); }
  50% { transform: translateY(6px) rotate(3deg); }
  100% { transform: translateY(0px) rotate(2deg); }
}

/* APPLY ANIMATION */
.polaroid{
  animation: float1 4s ease-in-out infinite;
}

.polaroid:nth-child(even){
  animation: float2 5s ease-in-out infinite;
}
</style>
</head>

<body>

<div class="title">ALGAE GALLERY</div>

<div class="gallery">

  <div class="polaroid">
    <img src="images2/Cladophora1.jpg" onerror="this.src='images2/default.jpg'">
    <p>Cladophora</p>
  </div>

  <div class="polaroid">
    <img src="images2/Ulva lactuca1.jpg" onerror="this.src='images2/default.jpg'">
    <p>Ulva lactuca</p>
  </div>

  <div class="polaroid">
    <img src="images2/Chlorella1.jpg" onerror="this.src='images2/default.jpg'">
    <p>Chlorella</p>
  </div>

  <div class="polaroid">
    <img src="images2/Spirogyra1.jpg" onerror="this.src='images2/default.jpg'">
    <p>Spirogyra</p>
  </div>

  <div class="polaroid">
    <img src="images2/Botryococcus1.jpg" onerror="this.src='images2/default.jpg'">
    <p>Botryococcus</p>
  </div>

  <div class="polaroid">
    <img src="images2/Polysiphonia1.jpg" onerror="this.src='images2/default.jpg'">
    <p>Polysiphonia</p>
  </div>

</div>

</body>
</html>
