
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aquarium Layout Editor (Fixed)</title>
<style>
body{margin:0;background:#08151c;color:white;font-family:Arial}
#ui{position:fixed;left:10px;top:10px;background:rgba(0,0,0,.6);padding:12px;border-radius:10px}
button{margin:4px;padding:6px 10px}
</style>
</head>

<body>
<div id="ui">
<b>Aquarium Layout Editor</b><br>
Click object → drag arrows to move<br>
<button onclick="mode('translate')">Move</button>
<button onclick="mode('rotate')">Rotate</button>
<button onclick="mode('scale')">Scale</button>
</div>

<script type="module">

import * as THREE from "https://unpkg.com/three@0.161.0/build/three.module.js";
import {OrbitControls} from "https://unpkg.com/three@0.161.0/examples/jsm/controls/OrbitControls.js";
import {TransformControls} from "https://unpkg.com/three@0.161.0/examples/jsm/controls/TransformControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08151c);

const camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);
camera.position.set(0,5,10);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const orbit = new OrbitControls(camera,renderer.domElement);

const transform = new TransformControls(camera,renderer.domElement);
scene.add(transform);
transform.addEventListener("dragging-changed",e=>orbit.enabled=!e.value);

window.mode=(m)=>transform.setMode(m);

scene.add(new THREE.AmbientLight(0xffffff,.8));

const light=new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,10,5);
scene.add(light);

/* aquarium */

const tank=new THREE.Mesh(
 new THREE.BoxGeometry(8,4,5),
 new THREE.MeshBasicMaterial({color:0x44cccc,wireframe:true})
);
tank.position.y=2;
scene.add(tank);

/* objects */

function frog(){
 const g=new THREE.Group();
 const body=new THREE.Mesh(
  new THREE.SphereGeometry(.5,20,20),
  new THREE.MeshStandardMaterial({color:0x55aa55})
 );
 body.scale.set(1.4,.7,1.6);
 g.add(body);
 return g;
}

function pad(){
 return new THREE.Mesh(
  new THREE.CylinderGeometry(.7,.7,.1,32),
  new THREE.MeshStandardMaterial({color:0x2fa36b})
 );
}

function lotus(){
 return new THREE.Mesh(
  new THREE.SphereGeometry(.3,16,16),
  new THREE.MeshStandardMaterial({color:0xff88dd})
 );
}

const objects=[];

function add(name,obj,x,y,z){
 obj.name=name;
 obj.position.set(x,y,z);
 scene.add(obj);
 objects.push(obj);
}

add("frog",frog(),1,2.2,0);
add("pad",pad(),1,2,0);
add("lotus_left",lotus(),-2,2.1,0);
add("lotus_right",lotus(),2,2.1,0);

const ray=new THREE.Raycaster();
const mouse=new THREE.Vector2();

window.addEventListener("pointerdown",e=>{

mouse.x=(e.clientX/innerWidth)*2-1;
mouse.y=-(e.clientY/innerHeight)*2+1;

ray.setFromCamera(mouse,camera);

const hit=ray.intersectObjects(objects,true);

if(hit.length){
 let o=hit[0].object;
 while(o.parent && !objects.includes(o))o=o.parent;
 transform.attach(o);
}

});

function animate(){
 requestAnimationFrame(animate);
 orbit.update();
 renderer.render(scene,camera);
}
animate();

</script>
</body>
</html>
