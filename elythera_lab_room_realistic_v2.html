<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elythera Lab Room</title>

<style>
html,body{margin:0;height:100%;overflow:hidden;background:#eef3f7;font-family:Arial;}
#hud{position:fixed;top:10px;left:10px;background:rgba(0,0,0,0.55);color:white;padding:10px 12px;border-radius:8px;font-size:13px;}
</style>

<script type="importmap">
{
"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}
}
</script>
</head>

<body>

<div id="hud">
Mission Elythera Lab<br>
Drag mouse to look around
</div>

<script type="module">

import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf6f8fb);

const camera = new THREE.PerspectiveCamera(70,window.innerWidth/window.innerHeight,0.01,2000);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

const loader = new GLTFLoader();

scene.add(new THREE.HemisphereLight(0xffffff,0xdde6f0,2));

const dir = new THREE.DirectionalLight(0xffffff,2);
dir.position.set(5,7,5);
scene.add(dir);

function loadGLB(path){
return new Promise((resolve,reject)=>{
loader.load(path,g=>resolve(g.scene),undefined,reject);
});
}

function boxSize(obj){
return new THREE.Box3().setFromObject(obj).getSize(new THREE.Vector3());
}

function boxMinMax(obj){
const b = new THREE.Box3().setFromObject(obj);
return {min:b.min,max:b.max,size:b.getSize(new THREE.Vector3())};
}

function scaleTo(obj,target){
const s = boxSize(obj);
const m = Math.max(s.x,s.y,s.z);
obj.scale.multiplyScalar(target/m);
}

function scaleWidth(obj,w){
const s = boxSize(obj);
obj.scale.multiplyScalar(w/s.x);
}

let eye = new THREE.Vector3(0,1.2,0.8);
let yaw=0;
let pitch=0;
let drag=false;
let lx=0,ly=0;

function updateLook(){
const dir = new THREE.Vector3(
Math.cos(pitch)*Math.sin(yaw),
Math.sin(pitch),
-Math.cos(pitch)*Math.cos(yaw)
);
camera.position.copy(eye);
camera.lookAt(eye.clone().add(dir));
}

(async function(){

const room = await loadGLB("./room.glb");
scene.add(room);

const roomBox = boxMinMax(room);

eye.set(0,roomBox.size.y*0.18,roomBox.size.z*0.35);
updateLook();

const table = await loadGLB("./models/research_table.glb");
scene.add(table);
scaleWidth(table,1.5);
table.position.set(-0.4,0,-1.4);

const tbox = boxMinMax(table);

const top = tbox.max.y;
const lx = tbox.min.x;
const rx = tbox.max.x;
const fz = tbox.max.z;
const bz = tbox.min.z;

const microscope = await loadGLB("./models/microscope.glb");
scene.add(microscope);
scaleTo(microscope,0.25);
microscope.position.set(lx+0.3,top+0.01,bz+0.18);

const jar = await loadGLB("./models/algae_specimen_jar_lowpoly.glb");
scene.add(jar);
scaleTo(jar,0.12);
jar.position.set(lx+0.55,top+0.01,bz+0.2);

const journal = await loadGLB("./models/journal.glb");
scene.add(journal);
scaleTo(journal,0.27);
journal.position.set(rx-0.45,top+0.01,fz-0.2);

const laptop = await loadGLB("./models/laptop.glb");
scene.add(laptop);
scaleTo(laptop,0.35);
laptop.position.set(lx+0.55,top+0.01,fz-0.25);

const cup = await loadGLB("./models/coffee_cup.glb");
scene.add(cup);
scaleTo(cup,0.1);
cup.position.set(rx-0.25,top+0.01,fz-0.18);

const globe = await loadGLB("./models/glass_globe.glb");
scene.add(globe);
scaleTo(globe,0.22);
globe.position.set(rx-0.18,top+0.01,bz+0.15);

const books = await loadGLB("./models/books.glb");
scene.add(books);
scaleTo(books,0.28);
books.position.set(rx+0.1,0,bz+0.1);

const stand = await loadGLB("./models/marble_table_2.glb");
scene.add(stand);
scaleWidth(stand,0.9);
stand.position.set(1.4,0,-0.25);

})();

renderer.domElement.addEventListener("mousedown",e=>{
drag=true;
lx=e.clientX;
ly=e.clientY;
});

window.addEventListener("mouseup",()=>drag=false);

window.addEventListener("mousemove",e=>{
if(!drag)return;
const dx=e.clientX-lx;
const dy=e.clientY-ly;
lx=e.clientX;
ly=e.clientY;
yaw-=dx*0.005;
pitch-=dy*0.004;
pitch=Math.max(-1.2,Math.min(1.2,pitch));
updateLook();
});

function animate(){
requestAnimationFrame(animate);
renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>
</body>
</html>
