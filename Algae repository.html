<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<title>UI Test</title>

<style>
html{
scroll-behavior:smooth;
}
/* ===== BODY ===== */
body {
  margin: 0;
  background: radial-gradient(circle at center, #000814, #000);
  font-family: 'Inter', sans-serif;
  color: white;
}

/* TITLE */
.title {
  text-align: center;
  margin-top: 20px;
  font-family: 'Orbitron', sans-serif;
  font-size: 20px;
  color: cyan;
  text-shadow: 0 0 10px cyan;
}

/* CONTAINER */
.container {
  padding: 15px;
  display: flex;
  flex-direction: column;
}

/* ===== CARD BASE ===== */
.card {
  position: relative;
  border-radius: 18px;
  overflow: hidden;
  backdrop-filter: blur(12px);
  transition: 0.3s;
  margin-bottom: 18px;
}
.card video {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;

  top: 0;
  left: 0;

  transform: scale(1); /* reset */
}
/* ===== VIDEO ===== */
.search video {
  animation: zoomLoop 8s linear infinite;
}
.search video {
  width: 130%;
  left: -15%;
}
.explore video {
  animation: zoomLoop 6s linear infinite;
}

.compare video {
  animation: zoomLoop 5s linear infinite;
}

.india video {
  animation: none;
}
@keyframes zoomLoop {
  0% {
    transform: scale(1);
    opacity: 1;
  }
  90% {
    transform: scale(1.05);
    opacity: 0.98;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}
/* TEXT */
.card h2 {
  position: absolute;
  bottom: 15px;
  left: 15px;
  margin: 0;
  font-size: 16px;
  z-index: 2;
}

/* ===== INDIVIDUAL BUTTON SETTINGS ===== */

/* SEARCH */
.search {
  width: 96%;
  height: 141px;
  transform: translateY(12px);
  border: 1px solid cyan;
}
.search:hover {
  box-shadow: 0 0 20px cyan, 0 0 40px cyan;
}

/* EXPLORE */
.explore {
  width: 95%;
  height: 141px;
  transform: translateY(17px);
  border: 1px solid lime;
}
.explore:hover {
  box-shadow: 0 0 20px lime, 0 0 40px lime;
}

/* COMPARE */
.compare {
  width: 96%;
  height: 162px;
  transform: translateY(21px);
  border: 1px solid violet;
}
.compare:hover {
  box-shadow: 0 0 20px violet, 0 0 40px violet;
}

/* INDIA */
.india {
  width: 96%;
  height: 141px;
  transform: translateY(26px);
  border: 1px solid cyan;
}
.india:hover {
  box-shadow: 0 0 25px cyan, 0 0 50px cyan;
}
  .portal-message{

display:flex;
align-items:center;
justify-content:center;

height:82px;

/* push downward */
margin-top:42px;
margin-bottom:12px;

background:
linear-gradient(
90deg,
rgba(0,255,255,.06),
rgba(0,255,120,.06),
rgba(200,120,255,.06)
);

border:1px solid rgba(0,255,255,.14);

backdrop-filter:blur(8px);
}

.portal-message:hover{
box-shadow:
0 0 14px rgba(0,255,255,.12),
0 0 22px rgba(180,120,255,.10);
}

.portal-message h3{
margin:0;

font-family:'Orbitron',sans-serif;
font-size:14px;

letter-spacing:3px;

background:
linear-gradient(
90deg,
#5edbff,
#4cff79,
#d896ff
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

text-align:center;

padding:0 16px;
line-height:1.5;
}

/* ===== RESPONSIVE ===== */
@media (min-width: 768px) {
  .container {
    max-width: 700px;
    margin: auto;
  }
}

</style>
</head>

<body>

<div class="title">ALGAE REPOSITORY</div>

<div class="container">

  <div class="card search">
    <video autoplay muted loop playsinline class="bg-video">
      <source src="images2/library.mp4" type="video/mp4">
    </video>
    <h2>ALGAE LIBRARY</h2>
  </div>

  <div class="card explore">
    <video autoplay muted loop playsinline class="bg-video">
      <source src="images2/gallery.mp4" type="video/mp4">
    </video>
    <h2>ALGAE GALLERY</h2>
  </div>

  <div class="card compare">
    <video autoplay muted loop playsinline class="bg-video">
      <source src="images2/compare.mp4" type="video/mp4">
    </video>
    <h2>ALGAE COMPARE MODULE</h2>
  </div>

  <div class="card india">
    <video autoplay muted loop playsinline class="bg-video">
      <source src="images2/india.mp4" type="video/mp4">
    </video>
    <h2>COMMON ALGAE IN INDIA AND KERALA</h2>
  </div>
<div class="card portal-message">

<h3>CLICK ON THE MODULE TO VISIT THE PAGE</h3>

</div>
</div>

</body>
</html>
