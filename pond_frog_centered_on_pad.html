<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>

<title>Microscope Viewer • Smooth POV Test</title>

<style>

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:none;

  background:#05070c;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#hint{
  position:fixed;
  top:12px;
  left:12px;
  z-index:20;

  padding:12px 14px;

  background:rgba(0,0,0,0.45);
  backdrop-filter:blur(10px);

  border-radius:16px;

  color:white;

  font-family:Arial;
  font-size:12px;

  border:1px solid rgba(255,255,255,0.10);
}

#loading{
  position:fixed;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#05070c;

  z-index:100;

  color:white;

  font-family:Arial;
}

#loadingCard{

  width:min(340px,90vw);

  padding:18px;

  border-radius:18px;

  background:rgba(255,255,255,0.05);

  border:1px solid rgba(255,255,255,0.08);
}

#bar{
  height:10px;
  border-radius:999px;
  overflow:hidden;

  background:rgba(255,255,255,0.08);

  margin-top:14px;
}

#fill{
  width:0%;
  height:100%;

  background:#5FC2A7;
}

.small{
  margin-top:10px;
  font-size:12px;
  opacity:.7;
}

</style>
</head>

<body>

<div id="hint">
Drag screen smoothly to look around
</div>

<div id="loading">

<div id="loadingCard">

<div style="font-size:16px;font-weight:700">
Loading Microscope Lab...
</div>

<div class="small" id="status">
Preparing scene...
</div>

<div id="bar">
<div id="fill"></div>
</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

(() => {

/* =========================
   LOADING UI
========================= */

const fill = document.getElementById("fill");
const statusText = document.getElementById("status");
const loading = document.getElementById("loading");

function setProgress(p,text){

  fill.style.width = p + "%";

  if(text) statusText.textContent = text;
}

/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x05070c);

/* =========================
   RENDERER
========================= */

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

/* smoother on mobile */

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,1.5)
);

renderer.outputEncoding =
THREE.sRGBEncoding;

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

/* =========================
   CAMERA
========================= */

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth/window.innerHeight,
  0.01,
  100
);

/* =========================
   LIGHTS
========================= */

const hemi = new THREE.HemisphereLight(
  0xffffff,
  0x222233,
  1.2
);

scene.add(hemi);

const dir = new THREE.DirectionalLight(
  0xffffff,
  1.1
);

dir.position.set(5,8,5);

dir.castShadow = true;

dir.shadow.mapSize.set(1024,1024);

scene.add(dir);

/* =========================
   CAMERA POSITION
========================= */

const CAMERA_POS = new THREE.Vector3(
  2.53,
  0.48,
  -0.70
);

/* =========================
   VIEW LIMITS
========================= */

const MIN_YAW = -2.05;
const MAX_YAW = -1.08;

const MIN_PITCH = -0.15;
const MAX_PITCH = 0.18;

/* =========================
   SMOOTH CAMERA
========================= */

let targetYaw = -1.86;
let currentYaw = -1.86;

let targetPitch = 0.02;
let currentPitch = 0.02;

/* =========================
   DRAG CONTROLS
========================= */

let dragging = false;

let lastX = 0;
let lastY = 0;

/* PREVENT PAGE STRETCH */

document.body.addEventListener(
  "touchmove",
  e => e.preventDefault(),
  { passive:false }
);

/* POINTER DOWN */

renderer.domElement.addEventListener(
  "pointerdown",
  e => {

    dragging = true;

    lastX = e.clientX;
    lastY = e.clientY;
  }
);

/* POINTER UP */

window.addEventListener(
  "pointerup",
  () => dragging = false
);

/* POINTER MOVE */

window.addEventListener(
  "pointermove",
  e => {

    if(!dragging) return;

    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;

    lastX = e.clientX;
    lastY = e.clientY;

    /* MUCH FASTER + RESPONSIVE */

    targetYaw -= dx * 0.0085;

    targetPitch -= dy * 0.0045;

    targetYaw = THREE.MathUtils.clamp(
      targetYaw,
      MIN_YAW,
      MAX_YAW
    );

    targetPitch = THREE.MathUtils.clamp(
      targetPitch,
      MIN_PITCH,
      MAX_PITCH
    );

  }
);

/* =========================
   GLTF LOADER
========================= */

const loader = new THREE.GLTFLoader();

function load(path){

  return new Promise((resolve,reject)=>{

    loader.load(
      path,

      gltf => resolve(gltf.scene),

      undefined,

      reject
    );

  });

}

/* =========================
   LOAD MODELS
========================= */

(async()=>{

try{

/* ROOM */

setProgress(10,"Loading room...");

const room = await load("./room.glb");

scene.add(room);

room.traverse(o=>{

  if(!o.isMesh) return;

  o.castShadow = true;
  o.receiveShadow = true;

  const mats =
  Array.isArray(o.material)
  ? o.material
  : [o.material];

  mats.forEach(m=>{

    if(!m) return;

    m.side = THREE.DoubleSide;

    if(m.map){
      m.map.encoding =
      THREE.sRGBEncoding;
    }

  });

});

/* TABLE */

setProgress(30,"Loading table...");

const table = await load(
"./models/lumen_hologram_table.glb"
);

room.add(table);

table.position.set(
1.60,
0.10,
-0.80
);

table.scale.set(
0.75,
0.75,
0.75
);

table.rotation.y = -3.14;

/* MICROSCOPE */

setProgress(45,"Loading microscope...");

const microscope = await load(
"./models/microscope.glb"
);

room.add(microscope);

microscope.position.set(
1.54,
0.45,
-0.28
);

microscope.scale.set(
0.14,
0.14,
0.14
);

microscope.rotation.set(
-0.02,
1.7,
0
);

/* CHAIR */

setProgress(60,"Loading chair...");

const chair = await load(
"./round_chair.glb"
);

room.add(chair);

chair.position.set(
-0.35,
-0.15,
1.50
);

chair.scale.set(
0.40,
0.40,
0.40
);

chair.rotation.y = 0.05;

/* JOURNAL */

setProgress(72,"Loading journal...");

const journal = await load(
"./models/journal.glb"
);

room.add(journal);

journal.position.set(
1.58,
0.37,
-0.62
);

journal.scale.set(
0.05,
0.05,
0.05
);

journal.rotation.set(
-1.66,
0.68,
1.69
);

/* NEW 13MB GLB */

setProgress(82,"Loading specimen slides case...");

const slidesCase = await load(
"./models/microscope_slides__case.glb"
);

room.add(slidesCase);

/* TEMP SAME SCALE FEEL AS JOURNAL */

slidesCase.position.set(
1.75,
0.37,
-0.75
);

slidesCase.scale.set(
0.05,
0.05,
0.05
);

slidesCase.rotation.set(
0,
-1.5,
0
);

setProgress(100,"Scene loaded");

setTimeout(()=>{

loading.style.display = "none";

},500);

}catch(err){

console.error(err);

statusText.textContent =
"Failed to load scene.";

}

})();

/* =========================
   CAMERA UPDATE
========================= */

function updateCamera(){

  /* MUCH SMOOTHER */

  currentYaw +=
  (targetYaw - currentYaw) * 0.22;

  currentPitch +=
  (targetPitch - currentPitch) * 0.22;

  camera.position.copy(CAMERA_POS);

  const dir = new THREE.Vector3(
    Math.sin(currentYaw),
    currentPitch,
    -Math.cos(currentYaw)
  );

  camera.lookAt(
    camera.position.clone().add(dir)
  );

}

/* =========================
   RENDER LOOP
========================= */

function animate(){

  requestAnimationFrame(animate);

  updateCamera();

  renderer.render(scene,camera);

}

animate();

/* =========================
   RESIZE
========================= */

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

})();

</script>

</body>
</html>
