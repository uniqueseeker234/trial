<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algae Archive System</title>

<style>

/* ===== BODY ===== */
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at center, #000814, #000);
  color: white;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  height: 100vh;
}

/* TITLE */
.title {
  margin-top: 20px;
  font-size: 26px;
  color: cyan;
}

/* ===== CENTER AREA ===== */
.center-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center; /* THIS FIXES YOUR ISSUE */
  align-items: center;
  width: 100%;
  gap: 20px;
}

/* ===== HUD BUTTON ===== */
.hud-btn {
  width: 80%;
  max-width: 500px;
  padding: 18px;
  text-align: center;
  font-size: 18px;
  border-radius: 12px;

  background: rgba(0,255,255,0.05);
  backdrop-filter: blur(12px);

  border: 1px solid rgba(255,255,255,0.2);

  position: relative;
  overflow: hidden;

  transition: 0.3s;
}

/* INNER NEON LINE */
.hud-btn::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 4px;
}

/* COLORS */
.search::before { background: cyan; }
.explore::before { background: lime; }
.compare::before { background: violet; }
.india::before { background: orange; }

/* HOVER GLOW */
.search:hover {
  box-shadow: 0 0 20px cyan, 0 0 40px cyan;
}
.explore:hover {
  box-shadow: 0 0 20px lime, 0 0 40px lime;
}
.compare:hover {
  box-shadow: 0 0 20px violet, 0 0 40px violet;
}
.india:hover {
  box-shadow: 0 0 20px orange, 0 0 40px orange;
}

/* TEXT */
.hud-btn span {
  display: block;
  font-size: 13px;
  color: #aaa;
}

</style>
</head>

<body>

<div class="title">ALGAE ARCHIVE SYSTEM</div>

<div class="center-area">

  <div class="hud-btn search">
    Search Algae
    <span>Find specific algae</span>
  </div>

  <div class="hud-btn explore">
    Explore Algae World
    <span>View all algae</span>
  </div>

  <div class="hud-btn compare">
    Compare Algae
    <span>Compare two algae</span>
  </div>

  <div class="hud-btn india">
    Common Algae in India
    <span>View Indian species</span>
  </div>

</div>

</body>
</html>
