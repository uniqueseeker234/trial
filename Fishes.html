<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algae Archive System</title>

<style>

/* ===== BODY ===== */
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at center, #000814, #000);
  color: white;
}

/* TITLE */
.title {
  text-align: center;
  margin-top: 25px;
  font-size: 28px;
  color: cyan;
}

/* ===== MENU ===== */
.menu {
  display: flex;
  justify-content: center;
  gap: 25px;
  margin-top: 40px;
}

/* BUTTONS */
.btn {
  padding: 18px 28px;
  border-radius: 15px;
  backdrop-filter: blur(10px);
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.2);
  cursor: pointer;
  transition: 0.3s;
  text-align: center;
}

/* GLOW COLORS */
.btn.search:hover { box-shadow: 0 0 20px cyan; }
.btn.explore:hover { box-shadow: 0 0 20px lime; }
.btn.compare:hover { box-shadow: 0 0 20px violet; }
.btn.india:hover { box-shadow: 0 0 20px orange; }

/* ===== VELMORANE ===== */
.velmorane {
  position: fixed;
  bottom: 20px;
  left: 20px;
  width: 120px;
  opacity: 0;
  transition: 0.5s;
}

.velmorane img {
  width: 100%;
}

/* TEXT */
.vel-text {
  position: fixed;
  bottom: 140px;
  left: 20px;
  background: rgba(0,255,255,0.1);
  padding: 10px;
  border-radius: 10px;
  border: 1px solid cyan;
  font-size: 14px;
  opacity: 0;
  transition: 0.5s;
}

/* ===== PANEL ===== */
.panel {
  display: none;
  margin: 50px auto;
  width: 550px;
  padding: 25px;
  border-radius: 16px;

  background: rgba(0,255,255,0.05);
  backdrop-filter: blur(12px);

  border: 1px solid rgba(0,255,255,0.4);

  box-shadow:
    0 0 25px cyan,
    0 0 70px rgba(0,255,255,0.4),
    inset 0 0 25px rgba(0,255,255,0.2);
}

/* IMAGES */
.images {
  display: flex;
  gap: 10px;
}

.images img {
  width: 50%;
  border-radius: 10px;
}

/* CLOSE */
.close {
  float: right;
  cursor: pointer;
  color: red;
}

/* SHOW */
.show {
  display: block;
}

</style>
</head>

<body>

<div class="title">ALGAE ARCHIVE SYSTEM</div>

<!-- MENU -->
<div class="menu">
  <div class="btn search" onclick="openCard()">Search</div>
  <div class="btn explore">Explore</div>
  <div class="btn compare">Compare</div>
  <div class="btn india">India</div>
</div>

<!-- VELMORANE -->
<div class="velmorane" id="velmorane">
  <img src="images2/velmorane.png">
</div>

<div class="vel-text" id="velText"></div>

<!-- CLADOPHORA PANEL -->
<div class="panel" id="card">

  <div class="close" onclick="closeCard()">✖</div>

  <div class="images">
    <img src="images2/Cladophora1.jpg">
    <img src="images2/Cladophora2.jpg">
  </div>

  <h2>Cladophora</h2>

  <p>
  Filamentous green algae forming dense mats in aquatic environments.
  </p>

</div>

<script>

/* ===== OPEN CARD ===== */
function openCard() {
  document.getElementById("card").classList.add("show");
}

/* ===== CLOSE CARD ===== */
function closeCard() {
  document.getElementById("card").classList.remove("show");
}

/* ===== VELMORANE GUIDE ===== */
const messages = [
  "Use SEARCH to find specific algae 🔍",
  "Explore all algae in one view 🌊",
  "Compare two algae side-by-side ⚖",
  "View common algae in India 🇮🇳"
];

let index = 0;

function showGuide() {
  const vel = document.getElementById("velmorane");
  const text = document.getElementById("velText");

  vel.style.opacity = 1;
  text.style.opacity = 1;
  text.innerText = messages[index];

  setTimeout(() => {
    text.style.opacity = 0;
    index++;

    if(index < messages.length){
      setTimeout(showGuide, 1000);
    }
  }, 2000);
}

/* START GUIDE */
setTimeout(showGuide, 1000);

</script>

</body>
</html>
