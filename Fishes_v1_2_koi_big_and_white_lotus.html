<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<title>UI Test</title>

<style>

/* ===== BODY ===== */
body {
  margin: 0;
  background: radial-gradient(circle at center, #000814, #000);
  font-family: 'Inter', sans-serif;
  color: white;
}

/* TITLE */
.title {
  text-align: center;
  margin-top: 20px;
  font-family: 'Orbitron', sans-serif;
  font-size: 20px;
  color: cyan;
  text-shadow: 0 0 10px cyan;
}

/* CONTAINER */
.container {
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ===== GLASS IMAGE BOX ===== */
.card {
  position: relative;
  height: 110px;
  border-radius: 18px;
  overflow: hidden;

  backdrop-filter: blur(12px);

  transition: 0.3s;

  /* REMOVE generic border */
  border: none;
}
  /* SEARCH (CYAN) */
.search {
  border: 1px solid cyan;
}
.search:hover {
  box-shadow: 0 0 20px cyan, 0 0 40px cyan;
}

/* EXPLORE (GREEN) */
.explore {
  border: 1px solid lime;
}
.explore:hover {
  box-shadow: 0 0 20px lime, 0 0 40px lime;
}

/* COMPARE (PURPLE) */
.compare {
  border: 1px solid violet;
}
.compare:hover {
  box-shadow: 0 0 20px violet, 0 0 40px violet;
}

/* INDIA (ORANGE) */
.india {
  border: 1px solid orange;
}
.india:hover {
  box-shadow: 0 0 20px orange, 0 0 40px orange;
}

/* ===== IMAGE BACKGROUND (FIXED PATH) ===== */
/* IMAGE */
.card::before {
  content: "";
  position: absolute;
  inset: 0;

  background: url("images2/file_0000000022fc7208a8adcba8c24ad6da.png") center/cover no-repeat;

  z-index: 0;
}

/* LIGHT OVERLAY (VERY SOFT) */
.card::after {
  content: "";
  position: absolute;
  inset: 0;

  background: rgba(0, 0, 0, 0.2); /* MUCH lighter */

  z-index: 1;
}
/* ===== TEXT ===== */
.card h2 {
  position: absolute;
  bottom: 15px;
  left: 15px;
  margin: 0;
  font-size: 16px;
  z-index: 2;
  letter-spacing: 1px;
}

/* ===== HOVER ===== */
.card:hover {
  transform: scale(1.03);
  box-shadow: 0 0 25px cyan;
}

</style>
</head>

<body>

<div class="title">UI IMAGE BUTTON TEST</div>

<div class="container">

  <div class="card">
    <h2>SEARCH ALGAE</h2>
  </div>

  <div class="card">
    <h2>EXPLORE WORLD</h2>
  </div>

  <div class="card">
    <h2>COMPARE ALGAE</h2>
  </div>

  <div class="card">
    <h2>INDIA ALGAE</h2>
  </div>

</div>

</body>
</html>
