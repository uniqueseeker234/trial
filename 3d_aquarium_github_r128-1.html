<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elythera Lab Room V5.5</title>

<style>
html,body{
margin:0;
height:100%;
overflow:hidden;
background:#edf1f5;
font-family:Arial,sans-serif;
}

#hud{
position:fixed;
top:10px;
left:10px;
background:rgba(0,0,0,0.55);
color:white;
padding:10px 14px;
border-radius:10px;
font-size:13px;
z-index:20;
line-height:1.4;
}
</style>

<script type="importmap">
{
"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}
}
</script>
</head>

<body>

<div id="hud">
Mission Elythera Lab V5.5<br>
Drag mouse to look around
</div>

<script type="module">

import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'

const scene = new THREE.Scene()
scene.background = new THREE.Color(0xf1f4f7)

const camera = new THREE.PerspectiveCamera(
70,
window.innerWidth/window.innerHeight,
0.01,
2000
)

const renderer = new THREE.WebGLRenderer({antialias:true})
renderer.setSize(window.innerWidth,window.innerHeight)
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2))
renderer.outputColorSpace = THREE.SRGBColorSpace

document.body.appendChild(renderer.domElement)
    renderer.domElement.style.position = "fixed"
renderer.domElement.style.top = "0"
renderer.domElement.style.left = "0"
renderer.domElement.style.zIndex = "0"

const loader = new GLTFLoader()

scene.add(new THREE.HemisphereLight(0xffffff,0xdfe6ee,2.0))

const dir = new THREE.DirectionalLight(0xffffff,1.8)
dir.position.set(5,7,5)
scene.add(dir)

const warm = new THREE.PointLight(0xfff0de,0.35,10)
warm.position.set(-0.8,1.6,-1.1)
scene.add(warm)

const tech = new THREE.PointLight(0x9df7ff,0.28,10)
tech.position.set(2.1,1.7,-1.3)
scene.add(tech)

function loadGLB(path){
return new Promise((resolve,reject)=>{
loader.load(path,g=>resolve(g.scene),undefined,reject)
})
}

function boxSize(obj){
return new THREE.Box3().setFromObject(obj).getSize(new THREE.Vector3())
}

function boxMinMax(obj){
const b = new THREE.Box3().setFromObject(obj)
return {min:b.min.clone(),max:b.max.clone(),size:b.getSize(new THREE.Vector3())}
}

function scaleTo(obj,target){
const s = boxSize(obj)
const m = Math.max(s.x,s.y,s.z)
if(m>0) obj.scale.multiplyScalar(target/m)
}

function scaleWidth(obj,w){
const s = boxSize(obj)
if(s.x>0) obj.scale.multiplyScalar(w/s.x)
}

function prep(root){
root.traverse(c=>{
if(!c.isMesh) return
const mats = Array.isArray(c.material)?c.material:[c.material]
mats.forEach(mat=>{
if(!mat) return
mat.side = THREE.DoubleSide
if(mat.map) mat.map.colorSpace = THREE.SRGBColorSpace
if(mat.color){
const b=(mat.color.r+mat.color.g+mat.color.b)/3
if(b<0.12) mat.color.set(0xd8dee6)
else if(b<0.55) mat.color.lerp(new THREE.Color(0xdfe5ec),0.48)
else mat.color.set(0xdfe5ec)
}
if('metalness' in mat) mat.metalness*=0.55
if('roughness' in mat) mat.roughness=Math.min(1,mat.roughness+0.04)
// ✅ ONLY FIX PURE WHITE WALLS (safe)
// 🎯 Only fix overly bright white walls (safe detection)
if(mat.color){
const b = (mat.color.r + mat.color.g + mat.color.b) / 3

// target only extreme white surfaces (not everything)
if(b > 0.92 && mat.roughness > 0.5){
mat.color.lerp(new THREE.Color(0xdfe5ec), 0.6)
}
}
mat.needsUpdate=true
})
})
}

let eye=new THREE.Vector3(0,1.2,0.8)
let yaw=0
let pitch=0
let drag=false
let lastX=0,lastY=0

function updateLook(){
const dir=new THREE.Vector3(
Math.cos(pitch)*Math.sin(yaw),
Math.sin(pitch),
-Math.cos(pitch)*Math.cos(yaw)
)
camera.position.copy(eye)
camera.lookAt(eye.clone().add(dir))
}

function makeGlowStrip(x,y,z,w,h){
const m=new THREE.Mesh(
new THREE.PlaneGeometry(w,h),
new THREE.MeshBasicMaterial({color:0x96f5ff,transparent:true,opacity:0.75})
)
m.position.set(x,y,z)
scene.add(m)
}

function makeAnimatedMonitor(x,y,z,w,h){

const canvas=document.createElement("canvas")
canvas.width=700
canvas.height=420

const ctx=canvas.getContext("2d")
const tex=new THREE.CanvasTexture(canvas)
tex.colorSpace=THREE.SRGBColorSpace


const screen=new THREE.Mesh(
new THREE.PlaneGeometry(w*0.92,h*0.84),
new THREE.MeshBasicMaterial({map:tex})
)

screen.position.set(x,y,z+0.01)
scene.add(screen)

const lines=[
"GRAVITY FIELD",
"STATUS: ENABLED",
"CABIN STABILITY: NORMAL",
"ATMOSPHERE: STABLE"
]

let charCount=0
let lineIndex=0
let timer=0

function draw(){
ctx.fillStyle="#101923"
ctx.fillRect(0,0,canvas.width,canvas.height)
ctx.strokeStyle="#3fe5ff"
ctx.lineWidth=6
ctx.strokeRect(16,16,canvas.width-32,canvas.height-32)
ctx.fillStyle="#90f7ff"
ctx.font="bold 42px Arial"
ctx.fillText(lines[0].slice(0,lineIndex===0?charCount:lines[0].length),34,72)
ctx.fillStyle="#ddfdff"
ctx.font="29px Arial"
const y=[150,205,260]
for(let i=1;i<lines.length;i++){
let txt=""
if(i<lineIndex) txt=lines[i]
else if(i===lineIndex) txt=lines[i].slice(0,charCount)
ctx.fillText(txt,34,y[i-1])
}
tex.needsUpdate=true
}

function update(dt){
timer+=dt
if(timer>55){
timer=0
charCount++
const current=lines[lineIndex]
if(charCount>current.length){
lineIndex++
charCount=0
if(lineIndex>=lines.length){
lineIndex=0
charCount=0
}}
draw()
}}
draw()
return { update, mesh: screen } // ✅ FIX
}

function makeEarthBoard(x,y,z,w,h){
const canvas=document.createElement("canvas")
canvas.width=700
canvas.height=420
const ctx=canvas.getContext("2d")

ctx.fillStyle="#f4f0e5"
ctx.fillRect(0,0,canvas.width,canvas.height)

ctx.strokeStyle="#8a8a8a"
ctx.lineWidth=8
ctx.strokeRect(14,14,canvas.width-28,canvas.height-28)

ctx.fillStyle="#263746"
ctx.font="bold 30px Arial"
ctx.fillText("Discovery Globe",28,46)

const cx=350, cy=230, r=120

const grad=ctx.createRadialGradient(cx-25,cy-25,10,cx,cy,r)
grad.addColorStop(0,"#59b8ff")
grad.addColorStop(1,"#214b82")

ctx.fillStyle=grad
ctx.beginPath()
ctx.arc(cx,cy,r,0,Math.PI*2)
ctx.fill()

const tex=new THREE.CanvasTexture(canvas)
tex.colorSpace=THREE.SRGBColorSpace


const board=new THREE.Mesh(
new THREE.PlaneGeometry(w*0.94,h*0.90),
new THREE.MeshBasicMaterial({map:tex})
)

board.position.set(x,y,z+0.01)
scene.add(board)

return board // ✅ FIX
}
function makeNeonText(text,x,y,z,w,h){
const canvas=document.createElement("canvas")
canvas.width=1024
canvas.height=256
const ctx=canvas.getContext("2d")

ctx.fillStyle="#000000"
ctx.fillRect(0,0,canvas.width,canvas.height)

ctx.shadowColor="#5dfcff"
ctx.shadowBlur=40

ctx.fillStyle="#9dfcff"
ctx.font="bold 70px Arial"
ctx.textAlign="center"
ctx.fillText(text,canvas.width/2,160)

const tex=new THREE.CanvasTexture(canvas)

const mesh=new THREE.Mesh(
new THREE.PlaneGeometry(w,h),
new THREE.MeshBasicMaterial({
map:tex,
transparent:true,
depthTest:false   // 🔥 important fix
})
)

mesh.position.set(x,y,z)
mesh.rotation.y = -Math.PI/2
scene.add(mesh)
}

const animatedPanels=[];
let aquarium
// ===== ADD OBJECTS (UNCHANGED LOGIC) =====
function createAquarium(scene){

// ===== ORIGINAL VARIABLES (UNCHANGED) =====
const loadingEl = document.getElementById('loading') || {style:{display:'none'}}
const pctEl = document.getElementById('pct') || {textContent:''}
const fileEl = document.getElementById('file') || {textContent:''}
const fillEl = document.getElementById('fill') || {style:{width:'0%'}}

const setProgress = (p,label) => {
p=Math.max(0,Math.min(100,p))
pctEl.textContent = Math.round(p) + '%'
fillEl.style.width = p + '%'
if(label) fileEl.textContent = label
}

// ❌ REMOVED renderer, camera, controls (room already has them)

// ===== SCENE ELEMENTS (KEPT) =====
const TANK = { w:3.25, h:1.95, d:2.25, glass:0.04, waterFill:0.80 }

const tank = new THREE.Group()
tank.position.set(0, 0, 0)
scene.add(tank)

// ===== GLASS =====
const glassGroup = new THREE.Group()
tank.add(glassGroup)

const glassMat = new THREE.MeshPhysicalMaterial({
color:0xffffff,
transmission:1.0,
transparent:true,
opacity:1.0,
roughness:0.02,
metalness:0,
ior:1.02,
thickness:0.05,
depthWrite:false
})

const glass = new THREE.Mesh(
new THREE.BoxGeometry(TANK.w,TANK.h,TANK.d),
glassMat
)
glassGroup.add(glass)

const innerMat = glassMat.clone()
innerMat.side = THREE.BackSide
innerMat.roughness = 0.06

const inner = new THREE.Mesh(
new THREE.BoxGeometry(
TANK.w - TANK.glass*2,
TANK.h - TANK.glass*2,
TANK.d - TANK.glass*2
),
innerMat
)
glassGroup.add(inner)

const edge = new THREE.LineSegments(
new THREE.EdgesGeometry(new THREE.BoxGeometry(TANK.w,TANK.h,TANK.d)),
new THREE.LineBasicMaterial({color:0x7fe7d2,transparent:true,opacity:0.35})
)
glassGroup.add(edge)

glassGroup.scale.set(1,1,1.1)

// ===== WATER =====
const waterH = (TANK.h - TANK.glass*2) * TANK.waterFill

const waterMat = new THREE.MeshPhysicalMaterial({
color:new THREE.Color('#3CC19E'),
transmission:0.70,
transparent:true,
opacity:0.86,
roughness:0.10,
metalness:0,
ior:1.33,
thickness:0.9
})

const water = new THREE.Mesh(
new THREE.BoxGeometry(
TANK.w - TANK.glass*2 - 0.03,
waterH,
TANK.d - TANK.glass*2 - 0.03
),
waterMat
)

water.position.y = -TANK.h/2 + TANK.glass + waterH/2
tank.add(water)

// ===== SURFACE =====
const surfaceGeo = new THREE.PlaneGeometry(
TANK.w - TANK.glass*2 - 0.05,
TANK.d - TANK.glass*2 - 0.05,
40,40
)

const surfaceMat = new THREE.MeshStandardMaterial({
color:new THREE.Color('#5FC2A7'),
roughness:0.22,
metalness:0.02,
transparent:true,
opacity:0.50
})

const surface = new THREE.Mesh(surfaceGeo,surfaceMat)
surface.rotation.x = -Math.PI/2
surface.position.y = water.position.y + waterH/2 + 0.01
tank.add(surface)

// ===== SOIL =====
const soil = new THREE.Mesh(
new THREE.BoxGeometry(
TANK.w - TANK.glass*2 - 0.06,
0.18,
TANK.d - TANK.glass*2 - 0.06
),
new THREE.MeshStandardMaterial({color:0x6b5338,roughness:0.98})
)

soil.position.y = -TANK.h/2 + TANK.glass + 0.09
tank.add(soil)

// ===== UNDERWATER GROUP =====
const underwater = new THREE.Group()
tank.add(underwater)

// ===== HELPERS =====
function fitCenter(obj,targetMax){
const box = new THREE.Box3().setFromObject(obj)
const size = new THREE.Vector3()
box.getSize(size)
const maxDim = Math.max(size.x,size.y,size.z)||1
const s = targetMax/maxDim
obj.scale.setScalar(s)
box.setFromObject(obj)
const center = new THREE.Vector3()
box.getCenter(center)
obj.position.sub(center)
}

// ===== LOADER =====
const loader = new THREE.GLTFLoader()

const assets = [
{k:'env',f:'under_water_light_house.glb'},
{k:'clown',f:'clown_fish_low_poly_animated.glb'},
{k:'plant',f:'marine_plant.glb'},
{k:'bigfish',f:'Animation_fish_low_poly.glb'},
{k:'house',f:'small_house.glb'},
{k:'wood',f:'drift_wood.glb'},
{k:'shell',f:'sea_shell_photogrammetry.glb'}
]

const loaded = {}
let clown, clownMixer
let bigfish, bigfishMixer
let house

const clock = new THREE.Clock()

function loadOne(a){
return new Promise((resolve,reject)=>{
loader.load(a.f,g=>resolve(g),undefined,reject)
})
}

// ===== LOAD EVERYTHING =====
;(async()=>{
for(const a of assets){
const gltf = await loadOne(a)
loaded[a.k] = gltf
}

// ===== ADD OBJECTS (UNCHANGED LOGIC) =====
house = loaded.house.scene
fitCenter(house,0.54)
house.position.set(0.4, soil.position.y+0.1, -0.4)
tank.add(house)

// fish
clown = loaded.clown.scene
fitCenter(clown,0.6)
underwater.add(clown)

clownMixer = new THREE.AnimationMixer(clown)
clownMixer.clipAction(loaded.clown.animations[0]).play()

bigfish = loaded.bigfish.scene
fitCenter(bigfish,0.6)
underwater.add(bigfish)

bigfishMixer = new THREE.AnimationMixer(bigfish)
bigfishMixer.clipAction(loaded.bigfish.animations[0]).play()

})()

// ===== ANIMATION (MOVED FROM ORIGINAL animate()) =====
tank.userData.update = (dt)=>{

const t = clock.getElapsedTime()

// surface wave
const pos = surface.geometry.attributes.position
for(let i=0;i<pos.count;i++){
const x = pos.getX(i)
const z = pos.getY(i)
pos.setZ(i,
Math.sin(t*0.85 + x*2.3)*0.006 +
Math.cos(t*0.75 + z*2.1)*0.006
)
}
pos.needsUpdate = true

if(clownMixer) clownMixer.update(dt)
if(bigfishMixer) bigfishMixer.update(dt)
}

return tank
}
(async function(){

const room=await loadGLB("./room.glb")

scene.add(room)
prep(room)
// ===== CLONE REAL WALL FROM ROOM =====

let wallClone = null

scene.traverse(obj=>{
    if(obj.isMesh){

        const size = new THREE.Box3().setFromObject(obj).getSize(new THREE.Vector3())

        // detect wall-like object
        if(size.x > 2 && size.y > 1.5 && size.z < 0.5 && !wallClone){
            wallClone = obj.clone()
            console.log("Wall found:", obj.name)
        }
    }
})

if(wallClone){
    wallClone.position.set(2.5, 1.12, 0)
    wallClone.scale.set(1.2, 1.78, 1)
    wallClone.rotation.y = -Math.PI / 2

    scene.add(wallClone)
}
  
const roomBox=boxMinMax(room)
eye.set(0,roomBox.size.y*0.18,roomBox.size.z*0.35)
updateLook()

// ===== RIGHT WALL FIX =====
// ===== FINAL LOCKED UI =====

// monitor
const monitorObj = makeAnimatedMonitor(2.8,2.01,-0.55,2.75,1.75)
monitorObj.mesh.rotation.y = -Math.PI/2
animatedPanels.push(monitorObj)

// globe
const boardObj = makeEarthBoard(2.8,0.54,-0.55,2.35,1.5)
boardObj.rotation.y = -Math.PI/2
    
function makeNeonText(text,x,y,z,w,h){
const canvas=document.createElement("canvas")
canvas.width=1024
canvas.height=256
const ctx=canvas.getContext("2d")

ctx.fillStyle="#0b1118"
ctx.fillRect(0,0,canvas.width,canvas.height)

ctx.shadowColor="#5dfcff"
ctx.shadowBlur=25

ctx.fillStyle="#9dfcff"
ctx.font="bold 60px Arial"
ctx.textAlign="center"
ctx.fillText(text,canvas.width/2,150)

const tex=new THREE.CanvasTexture(canvas)

const mesh=new THREE.Mesh(
new THREE.PlaneGeometry(w,h),
new THREE.MeshBasicMaterial({map:tex,transparent:true})
)

mesh.position.set(x,y,z)
mesh.rotation.y=-Math.PI/2
scene.add(mesh)
}
const glow = new THREE.Mesh(
new THREE.PlaneGeometry(0.92,0.04),
new THREE.MeshBasicMaterial({color:0x96f5ff,transparent:true,opacity:0.75})
)
glow.position.set(2.25,2.15,-0.65)
glow.rotation.y = -Math.PI/2
scene.add(glow)

// TABLE (unchanged)
const table=await loadGLB("./models/research_table.glb")
scene.add(table)
prep(table)
scaleWidth(table,1.50)
table.position.set(-0.40,0,-1.40)

const tbox=boxMinMax(table)
const top=tbox.max.y
const left=tbox.min.x
const right=tbox.max.x
const front=tbox.max.z
const back=tbox.min.z

const microscope=await loadGLB("./models/microscope.glb")
scene.add(microscope)
prep(microscope)
scaleTo(microscope,0.25)
microscope.position.set(left+0.25,top+0.01,back+0.15)

const jar=await loadGLB("./models/algae_specimen_jar_lowpoly.glb")
scene.add(jar)
prep(jar)
scaleTo(jar,0.14)
jar.position.set(left+0.45,top+0.01,front-0.25)

const laptop=await loadGLB("./models/laptop.glb")
scene.add(laptop)
prep(laptop)
scaleTo(laptop,0.35)
laptop.position.set(left+0.65,top+0.01,front-0.25)

const journal=await loadGLB("./models/journal.glb")
scene.add(journal)
prep(journal)
scaleTo(journal,0.27)
journal.rotation.x=-Math.PI/2
journal.rotation.z=0.25
journal.position.set(right-0.35,top+0.02,front-0.22)

const cup=await loadGLB("./models/coffee_cup.glb")
scene.add(cup)
prep(cup)
scaleTo(cup,0.10)
cup.position.set(right-0.15,top+0.01,front-0.18)

const books=await loadGLB("./models/books.glb")
scene.add(books)
prep(books)
scaleTo(books,0.22)
books.position.set(right-0.20,top+0.01,back+0.20)

const globe=await loadGLB("./models/glass_globe.glb")
scene.add(globe)
prep(globe)
scaleTo(globe,0.22)
globe.position.set(right-0.05,top+0.01,back+0.05)

// 👉 ADD HERE
aquarium = createAquarium(scene)

// place on center table
aquarium.scale.set(0.45,0.45,0.45)
aquarium.position.set(0, 0.85, -0.2)

scene.add(aquarium)
})()

renderer.domElement.addEventListener("mousedown",e=>{
drag=true
lastX=e.clientX
lastY=e.clientY
})

window.addEventListener("mouseup",()=>drag=false)

window.addEventListener("mousemove",e=>{
if(!drag) return
const dx=e.clientX-lastX
const dy=e.clientY-lastY
lastX=e.clientX
lastY=e.clientY
yaw-=dx*0.005
pitch-=dy*0.004
pitch=Math.max(-1.2,Math.min(1.2,pitch))
updateLook()
})

let last=performance.now()

function animate(now){
requestAnimationFrame(animate)
const dt=now-last
last=now
animatedPanels.forEach(p=>p.update(dt))
    if(aquarium && aquarium.userData.update){
aquarium.userData.update(dt)
}
renderer.render(scene,camera)
}
requestAnimationFrame(animate)

window.addEventListener("resize",()=>{
camera.aspect=window.innerWidth/window.innerHeight
camera.updateProjectionMatrix()
renderer.setSize(window.innerWidth,window.innerHeight)
})

</script>
</body>
</html>
