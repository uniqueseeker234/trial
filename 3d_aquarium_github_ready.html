<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compare Animation</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at center, #020617, #000814);
  overflow:hidden;
}

/* CONTAINER */
.container{
  position:relative;
  width:85%;
  max-width:850px;
  height:420px;
}

/* TITLE */
.title{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  color:gold;
  font-size:30px;
  letter-spacing:4px;

  animation: moveUp 1.5s ease forwards;
  animation-delay:0.3s;
}

@keyframes moveUp{
  to{
    top:10px;
    transform:translateX(-50%);
    font-size:22px;
  }
}

/* BOX */
.box{
  position:absolute;
  top:60px;
  left:0;
  width:100%;
  height:330px;
}

/* BORDER LINES */
.line{
  position:absolute;
  background:gold;
  box-shadow:0 0 15px gold, 0 0 40px rgba(255,215,0,0.5);
}

/* TOP */
.top{
  top:0;
  left:0;
  height:3px;
  width:0;
  animation: drawWidth 0.8s forwards;
  animation-delay:1s;
}

/* RIGHT */
.right{
  top:0;
  right:0;
  width:3px;
  height:0;
  animation: drawHeight 0.8s forwards;
  animation-delay:1.8s;
}

/* BOTTOM */
.bottom{
  bottom:0;
  right:0;
  height:3px;
  width:0;
  animation: drawWidth 0.8s forwards;
  animation-delay:2.6s;
}

/* LEFT */
.left{
  bottom:0;
  left:0;
  width:3px;
  height:0;
  animation: drawHeight 0.8s forwards;
  animation-delay:3.4s;
}

/* CENTER LINE */
.center{
  top:0;
  left:50%;
  width:3px;
  height:0;
  transform:translateX(-50%);
  animation: drawHeight 1s forwards;
  animation-delay:4.2s;
}

/* ROW LINES */
.row{
  left:0;
  height:3px;
  width:0;
  animation: drawWidth 0.8s forwards;
}

.r1{ top:60px; animation-delay:4.8s;}
.r2{ top:120px; animation-delay:5s;}
.r3{ top:180px; animation-delay:5.2s;}
.r4{ top:240px; animation-delay:5.4s;}
.r5{ top:300px; animation-delay:5.6s;}

/* HEADINGS */
.head{
  position:absolute;
  top:15px;
  width:50%;
  text-align:center;
  color:gold;
  font-size:18px;
  opacity:0;
  animation: fadeIn 1s forwards;
  animation-delay:6.2s;
}

.leftHead{ left:0; }
.rightHead{ right:0; }

/* ANIMATIONS */
@keyframes drawWidth{
  to{ width:100%; }
}

@keyframes drawHeight{
  to{ height:100%; }
}

@keyframes fadeIn{
  to{ opacity:1; }
}

/* 3D EFFECT */
.box{
  transform: perspective(900px) rotateX(6deg);
}
</style>

</head>

<body>

<div class="container">

  <div class="title">COMPARE ALGAE</div>

  <div class="box">

    <!-- OUTER BOX -->
    <div class="line top"></div>
    <div class="line right"></div>
    <div class="line bottom"></div>
    <div class="line left"></div>

    <!-- CENTER -->
    <div class="line center"></div>

    <!-- ROWS -->
    <div class="line row r1"></div>
    <div class="line row r2"></div>
    <div class="line row r3"></div>
    <div class="line row r4"></div>
    <div class="line row r5"></div>

    <!-- HEADINGS -->
    <div class="head leftHead">Algae 1</div>
    <div class="head rightHead">Algae 2</div>

  </div>

</div>

</body>
</html>
