
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elythera Portal Hub</title>

<style>
:root{
  --line:rgba(255,255,255,0.08);
  --text:#ecf7ff;
  --blue:#5edbff;
  --green:#4cff79;
  --violet:#b96bff;
  --orange:#ffb347;
}

*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
min-height:100%;
background:#000;
color:var(--text);
font-family:Arial,Helvetica,sans-serif;
}

body{
background:
radial-gradient(circle at 50% 8%, rgba(94,156,255,.10), transparent 24%),
linear-gradient(180deg,#02040a 0%,#000 45%,#02040a 100%);
}

#welcome{
position:fixed;
inset:0;
background:#000;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
letter-spacing:4px;
z-index:999;
}

#welcomeText::after{
content:"|";
animation:blink 1s infinite;
}

@keyframes blink{
0%,100%{opacity:1}
50%{opacity:0}
}

.page{
width:min(1440px,100%);
margin:0 auto;
padding:0 16px 26px;
}

.hero{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:20px 10px;
}

.team{
position:relative;
width:1000px;
max-width:95%;
aspect-ratio:1536/1024;
}

.team img{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:contain;
opacity:0;
transition:opacity 1s;
pointer-events:none;
}

.team img.active{opacity:1}

.systems{
text-align:center;
margin-top:40px;
width:min(1100px,100%);
opacity:0;
transition:opacity .9s ease;
}

.systems.show{opacity:1}

.systems h2{
margin:0 0 30px;
letter-spacing:4px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.card{
background:#000;
border-radius:15px;
padding:20px;
border:1px solid var(--line);
text-decoration:none;
color:var(--text);
transition:.3s;
}

.card:hover{
transform:translateY(-6px);
box-shadow:0 0 20px rgba(255,255,255,.12);
}

.logo-shell{
width:110px;
height:110px;
display:flex;
align-items:center;
justify-content:center;
margin:0 auto 10px;
animation:hoverFloat 3.8s ease-in-out infinite;
}

.logo-shell img{
max-width:100%;
max-height:100%;
}

.identifier h3,.identifier p{color:var(--blue)}
.pond h3,.pond p{color:var(--green)}
.archive h3,.archive p{color:var(--violet)}
.photohouse h3,.photohouse p{color:var(--orange)}
.locator h3,.locator p{color:var(--blue)}

.card h3{
margin:0 0 8px;
letter-spacing:.12em;
text-transform:uppercase;
}

.card p{
margin:0;
line-height:1.5;
opacity:.92;
font-size:13px;
}

@keyframes hoverFloat{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-7px)}
}
</style>
</head>

<body>

<div id="welcome">
<span id="welcomeText"></span>
</div>

<div class="page">
<section class="hero">

<div class="team">
<img class="frame active" src="assets/elythera/frame0_base.png">
<img class="frame" src="assets/elythera/frame1_glow.png">
<img class="frame" src="assets/elythera/frame2_glowstrong.png">
<img class="frame" src="assets/elythera/frame3_orb.png">
<img class="frame" src="assets/elythera/frame5_logo.png">
</div>

<div class="systems" id="systems">

<h2>ELYTHERA SYSTEMS</h2>

<div class="grid">

<a class="card identifier" href="identifier.html">
<div class="logo-shell"><img src="assets/elythera/logo_identifier_black.png"></div>
<h3>Identifier</h3>
<p>Helps to identify algae based on simple questions.</p>
</a>

<a class="card pond" href="pond.html">
<div class="logo-shell"><img src="assets/elythera/logo_pond_black.png"></div>
<h3>Algal Pond</h3>
<p>Algae pond built by members of Elythera.</p>
</a>

<a class="card archive" href="archive.html">
<div class="logo-shell"><img src="assets/elythera/logo_archive_black.png"></div>
<h3>Archive</h3>
<p>Visual encyclopedia of algae.</p>
</a>

<a class="card photohouse" href="photohouse.html">
<div class="logo-shell"><img src="assets/elythera/logo_camera_black.png"></div>
<h3>PhotoHouse</h3>
<p>Enhance your image.</p>
</a>

<a class="card locator" href="locator.html">
<div class="logo-shell"><img src="assets/elythera/logo_locator_black.png"></div>
<h3>Locator</h3>
<p>Geological location and their common algaes.</p>
</a>

</div>
</div>
</section>
</div>

<script>

const text="WELCOME TO ELYTHERA"
const el=document.getElementById("welcomeText")
let i=0

function type(){
if(i<text.length){
el.innerHTML+=text.charAt(i)
i++
setTimeout(type,80)
}else{
setTimeout(()=>{
document.getElementById("welcome").style.display="none"
startAnimation()
},1000)
}
}

window.onload=type

const frames=document.querySelectorAll(".frame")
const systems=document.getElementById("systems")
let f=0

function startAnimation(){

setTimeout(()=>{

const interval=setInterval(()=>{

frames[f].classList.remove("active")
f++
frames[f].classList.add("active")

if(f===frames.length-1){
systems.classList.add("show")
clearInterval(interval)
}

},1400)

},2000)

}

</script>

</body>
</html>
