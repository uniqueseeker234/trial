<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elythera Overlay Spiral Summon Test</title>
<style>
  :root{
    --blue:#8ae4ff;
    --green:#96ff92;
    --violet:#d59cff;
    --orange:#ffc36e;
    --sky:#86e8ff;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
    color:#eef8ff;
  }
  .scene{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 10%, rgba(95,160,255,.12), rgba(0,0,0,0) 30%),
      linear-gradient(to bottom, rgba(8,16,34,.40), rgba(0,0,0,.06) 25%, rgba(0,0,0,.58) 100%);
  }

  .intro{
    position:absolute;
    inset:0;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    z-index:50;
    pointer-events:none;
  }
  .intro-box{
    margin-top:9vh;
    text-align:center;
    opacity:0;
    transform:translateY(10px) scale(.985);
    animation:introIn 1.25s ease forwards, introOut 1.1s ease forwards;
    animation-delay:.15s, 3.0s;
  }
  .intro-box h1{
    margin:0;
    font-size:clamp(28px,4vw,54px);
    letter-spacing:.34em;
    text-transform:uppercase;
    text-shadow:0 0 18px rgba(138,228,255,.22);
  }
  .intro-box p{
    margin:.55rem 0 0;
    font-size:clamp(10px,1vw,14px);
    letter-spacing:.22em;
    text-transform:uppercase;
    color:rgba(238,248,255,.72);
  }

  .stage{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    animation:stageIn 1.0s ease forwards;
    animation-delay:4.05s;
  }
  .frame{
    position:relative;
    width:min(100vw, 1536px);
    aspect-ratio:1536 / 1024;
    max-height:100vh;
  }

  .base,.overlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center center;
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
  }
  .base{
    z-index:5;
    opacity:0;
    transform:scale(.992);
    animation:baseIn 1.5s ease forwards;
    animation-delay:4.25s;
  }
  .overlay{
    z-index:25;
    opacity:0;
    filter:brightness(1.35);
    animation:overlayIn 1.3s ease forwards;
    animation-delay:9.7s;
  }

  .effects{
    position:absolute;
    inset:0;
    z-index:18;
    opacity:0;
    pointer-events:none;
    animation:effectsOn .7s ease forwards;
    animation-delay:5.0s;
  }

  .palm{
    position:absolute;
    transform:translate(-50%,-50%);
    width:7.2%;
    aspect-ratio:1/1;
    opacity:0;
    animation:
      palmAppear 1.1s ease forwards,
      palmPulse 3.8s ease-in-out infinite,
      palmBright 1.6s ease forwards;
    animation-delay:var(--delay), calc(var(--delay) + 1.1s), 8.2s;
  }
  .palm::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:
      radial-gradient(circle, rgba(255,255,255,.98) 0%, var(--color) 18%, rgba(255,255,255,.24) 38%, rgba(0,0,0,0) 74%);
    filter:blur(12px);
    opacity:.95;
  }
  .palm::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:56%;
    height:56%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.75) 0%, rgba(255,255,255,.20) 36%, rgba(0,0,0,0) 76%);
    box-shadow:0 0 18px var(--color), 0 0 38px var(--color), 0 0 60px color-mix(in srgb, var(--color) 75%, white 25%);
    filter:blur(1px);
    opacity:.82;
  }

  .halo{
    position:absolute;
    transform:translate(-50%,-50%);
    width:8.2%;
    aspect-ratio:1/1;
    border-radius:50%;
    opacity:0;
    animation:haloIn 1.4s ease forwards, haloPulse 3.6s ease-in-out infinite;
    animation-delay:calc(var(--delay) + 1.1s), calc(var(--delay) + 2.5s);
  }
  .halo::before{
    content:"";
    position:absolute;
    inset:18%;
    border-radius:50%;
    border:1.5px solid rgba(255,255,255,.45);
    box-shadow:0 0 10px var(--color), 0 0 24px var(--color);
    opacity:.65;
  }

  .vixen { left:14.15%; top:55.20%; --color:var(--blue);   --delay:5.25s; }
  .mareoj{ left:33.15%; top:55.95%; --color:var(--green);  --delay:5.75s; }
  .vel   { left:50.10%; top:56.90%; --color:var(--violet); --delay:6.25s; }
  .lyra  { left:67.20%; top:56.15%; --color:var(--orange); --delay:6.75s; }
  .uniq  { left:85.00%; top:55.30%; --color:var(--sky);    --delay:7.25s; }

  canvas{
    position:absolute;
    inset:0;
    z-index:20;
    pointer-events:none;
    opacity:0;
    animation:effectsOn .7s ease forwards;
    animation-delay:5.0s;
  }

  .legend{
    position:absolute;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    z-index:55;
    font-size:10px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:rgba(238,248,255,.56);
    background:rgba(0,0,0,.18);
    border:1px solid rgba(255,255,255,.06);
    border-radius:999px;
    padding:8px 12px;
    backdrop-filter:blur(5px);
  }

  @keyframes introIn{
    from{opacity:0; transform:translateY(10px) scale(.985)}
    to{opacity:1; transform:translateY(0) scale(1)}
  }
  @keyframes introOut{
    from{opacity:1; transform:translateY(0) scale(1)}
    to{opacity:0; transform:translateY(-8px) scale(1.015)}
  }
  @keyframes stageIn{from{opacity:0}to{opacity:1}}
  @keyframes baseIn{
    0%{opacity:0; transform:scale(.992)}
    100%{opacity:1; transform:scale(1)}
  }
  @keyframes effectsOn{from{opacity:0}to{opacity:1}}
  @keyframes palmAppear{
    0%{opacity:0; transform:translate(-50%,-50%) scale(.18)}
    70%{opacity:1; transform:translate(-50%,-50%) scale(1.10)}
    100%{opacity:.76; transform:translate(-50%,-50%) scale(1)}
  }
  @keyframes palmPulse{
    0%,100%{opacity:.72}
    50%{opacity:1}
  }
  @keyframes palmBright{
    0%{filter:brightness(1)}
    50%{filter:brightness(1.25)}
    100%{filter:brightness(2)}
  }
  @keyframes haloIn{
    0%{opacity:0; transform:translate(-50%,-50%) scale(.4)}
    100%{opacity:1; transform:translate(-50%,-50%) scale(1)}
  }
  @keyframes haloPulse{
    0%,100%{opacity:.22}
    50%{opacity:.55}
  }
  @keyframes overlayIn{
    0%{opacity:0; filter:brightness(1.7)}
    100%{opacity:1; filter:brightness(1)}
  }

  @media (max-width:900px){
    .legend{display:none}
    .frame{width:100vw}
    .palm{width:7.8%}
    .halo{width:8.8%}
  }
  @media (max-width:640px){
    .intro-box{margin-top:8vh}
    .intro-box h1{font-size:22px; letter-spacing:.18em}
    .intro-box p{font-size:9px}
    .frame{width:100vw}
    .palm{width:8.0%}
    .halo{width:9.1%}
    .vixen { left:14.15%; top:55.20%; }
    .mareoj{ left:33.15%; top:55.95%; }
    .vel   { left:50.10%; top:56.95%; }
    .lyra  { left:67.20%; top:56.15%; }
    .uniq  { left:85.00%; top:55.30%; }
  }
</style>
</head>
<body>
<div class="scene">
  <div class="intro">
    <div class="intro-box">
      <h1>Welcome to Elythera</h1>
      <p>Activation sequence begins</p>
    </div>
  </div>

  <div class="stage">
    <div class="frame" id="frame">
      <img class="base" src="assets/elythera/elythera_team_base.png" alt="Elythera team base">

      <div class="effects">
        <div class="palm vixen"></div><div class="halo vixen"></div>
        <div class="palm mareoj"></div><div class="halo mareoj"></div>
        <div class="palm vel"></div><div class="halo vel"></div>
        <div class="palm lyra"></div><div class="halo lyra"></div>
        <div class="palm uniq"></div><div class="halo uniq"></div>
      </div>

      <canvas id="particles"></canvas>

      <img class="overlay" src="assets/elythera/elythera_team_overlay.png" alt="Elythera team overlay">
    </div>
  </div>

  <div class="legend">Slow summon • glow dust spirals in palm • brighten • overlay</div>
</div>

<script>
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
const frame = document.getElementById('frame');

function resizeCanvas(){
  const dpr = window.devicePixelRatio || 1;
  const rect = frame.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const palms = [
  {x:0.1415, y:0.5520, color:'#8ae4ff', delay:5250},
  {x:0.3315, y:0.5595, color:'#96ff92', delay:5750},
  {x:0.5010, y:0.5690, color:'#d59cff', delay:6250},
  {x:0.6720, y:0.5615, color:'#ffc36e', delay:6750},
  {x:0.8500, y:0.5530, color:'#86e8ff', delay:7250},
];

let particles = [];

function hexToRgba(hex,a){
  const h = hex.replace('#','');
  const n = parseInt(h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

function spawnSpiralSet(palm, count=55){
  const rect = frame.getBoundingClientRect();
  const cx = rect.width * palm.x;
  const cy = rect.height * palm.y;

  for(let i=0;i<count;i++){
    particles.push({
      cx, cy,
      angle: Math.random() * Math.PI * 2,
      baseR: 16 + Math.random() * 26,
      shrink: 0.35 + Math.random() * 0.25,
      rise: 8 + Math.random() * 22,
      size: 0.35 + Math.random() * 0.85,
      life: 0,
      max: 180 + Math.random() * 140,
      alpha: 0.25 + Math.random() * 0.35,
      color: palm.color,
      spin: 2.4 + Math.random() * 2.8,
      noise: Math.random() * Math.PI * 2
    });
  }
}

palms.forEach(p=>{
  setTimeout(()=>spawnSpiralSet(p, 35), p.delay + 250);
  setTimeout(()=>spawnSpiralSet(p, 45), p.delay + 1100);
  setTimeout(()=>spawnSpiralSet(p, 55), p.delay + 2200);
});

function render(){
  const rect = frame.getBoundingClientRect();
  ctx.clearRect(0, 0, rect.width, rect.height);

  particles = particles.filter(p => p.life < p.max);

  for(const p of particles){
    p.life++;
    const t = p.life / p.max;

    // Spiral motion that tightens while rising gently
    const r = Math.max(0, p.baseR * (1 - t * p.shrink));
    const a = p.angle + t * p.spin * Math.PI * 2 + Math.sin(t * 4 + p.noise) * 0.12;
    const x = p.cx + Math.cos(a) * r;
    const y = p.cy - (p.rise * t) + Math.sin(a * 1.5) * (r * 0.08);

    const alpha = Math.max(0, p.alpha * (1 - t));

    ctx.beginPath();
    ctx.fillStyle = hexToRgba(p.color, alpha);
    ctx.shadowColor = hexToRgba(p.color, alpha * 0.9);
    ctx.shadowBlur = 8;
    ctx.arc(x, y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
