<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<title>Algae System</title>

<style>

/* ===== BODY ===== */
body {
  margin: 0;
  background: radial-gradient(circle at center, #000814, #000);
  font-family: 'Inter', sans-serif;
  color: white;
}

/* ===== TITLE ===== */
.title {
  text-align: center;
  margin-top: 20px;
  font-family: 'Orbitron', sans-serif;
  font-size: 22px;
  color: cyan;

  text-shadow: 0 0 10px cyan;
}

/* ===== CONTAINER ===== */
.container {
  margin-top: 20px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

/* ===== BUTTON ===== */
.btn {
  height: 80px;
  border-radius: 18px;

  backdrop-filter: blur(14px);

  border: 1px solid rgba(255,255,255,0.15);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 16px;
  letter-spacing: 1px;

  transition: 0.3s;
}

/* ===== COLOR THEMES ===== */

/* SEARCH */
.search {
  background: rgba(0,255,255,0.08);
  border: 1px solid cyan;
}
.search:hover {
  box-shadow: 0 0 25px cyan, 0 0 50px cyan;
}

/* EXPLORE */
.explore {
  background: rgba(0,255,100,0.08);
  border: 1px solid lime;
}
.explore:hover {
  box-shadow: 0 0 25px lime, 0 0 50px lime;
}

/* COMPARE */
.compare {
  background: rgba(180,0,255,0.08);
  border: 1px solid violet;
}
.compare:hover {
  box-shadow: 0 0 25px violet, 0 0 50px violet;
}

/* INDIA */
.india {
  background: rgba(255,150,0,0.08);
  border: 1px solid orange;
}
.india:hover {
  box-shadow: 0 0 25px orange, 0 0 50px orange;
}

/* ===== TEXT ===== */
.btn span {
  display: block;
  font-size: 12px;
  color: #aaa;
}

/* ===== RESPONSIVE ===== */
@media (min-width: 600px) {
  .container {
    max-width: 450px;
    margin: auto;
  }
}

</style>

</head>

<body>

<div class="title">ALGAE ARCHIVE SYSTEM</div>

<div class="container">

  <div class="btn search">
    <div>
      SEARCH ALGAE
      <span>Find specific algae</span>
    </div>
  </div>

  <div class="btn explore">
    <div>
      EXPLORE WORLD
      <span>Browse all algae</span>
    </div>
  </div>

  <div class="btn compare">
    <div>
      COMPARE
      <span>Compare 2 algae</span>
    </div>
  </div>

  <div class="btn india">
    <div>
      INDIA ALGAE
      <span>Common species</span>
    </div>
  </div>

</div>

</body>
</html>
