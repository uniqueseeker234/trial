<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elythera Orb Weave Test</title>
<style>
  :root{
    --blue:#8fe7ff;
    --green:#9bff95;
    --violet:#d8a1ff;
    --orange:#ffc873;
    --sky:#8aeaff;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;width:100%;overflow:hidden;background:#000;
    font-family:Arial,Helvetica,sans-serif;color:#eef8ff;
  }
  .scene{
    position:relative;width:100vw;height:100vh;overflow:hidden;
    background:
      radial-gradient(circle at 50% 10%, rgba(95,160,255,.12), rgba(0,0,0,0) 30%),
      linear-gradient(to bottom, rgba(7,15,32,.40), rgba(0,0,0,.05) 24%, rgba(0,0,0,.58) 100%);
  }
  .intro{
    position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;
    z-index:50;pointer-events:none;
  }
  .intro-box{
    margin-top:9vh;text-align:center;opacity:0;transform:translateY(10px) scale(.985);
    animation:introIn 1.2s ease forwards, introOut 1.0s ease forwards;
    animation-delay:.2s, 3.0s;
  }
  .intro-box h1{
    margin:0;font-size:clamp(28px,4vw,54px);letter-spacing:.34em;text-transform:uppercase;
    text-shadow:0 0 18px rgba(143,231,255,.24);
  }
  .intro-box p{
    margin:.55rem 0 0;font-size:clamp(10px,1vw,14px);letter-spacing:.22em;
    text-transform:uppercase;color:rgba(238,248,255,.72);
  }

  .stage{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:0;animation:stageIn 1s ease forwards;animation-delay:4.0s;
  }
  .frame{
    position:relative;width:min(100vw,1536px);aspect-ratio:1536/1024;max-height:100vh;
  }
  .base,.overlay{
    position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center center;
    user-select:none;pointer-events:none;-webkit-user-drag:none;
  }
  .base{
    z-index:5;opacity:0;transform:scale(.993);
    animation:baseIn 1.4s ease forwards;animation-delay:4.2s;
  }
  .overlay{
    z-index:25;opacity:0;filter:brightness(1.35);
    animation:overlayIn 1.2s ease forwards;animation-delay:9.6s;
  }

  .effects{
    position:absolute;inset:0;z-index:18;pointer-events:none;opacity:0;
    animation:effectsOn .7s ease forwards;animation-delay:5.0s;
  }
  .palm{
    position:absolute;transform:translate(-50%,-50%);width:6.9%;aspect-ratio:1/1;opacity:0;
    animation:palmAppear 1.0s ease forwards,palmPulse 3.8s ease-in-out infinite,palmBright 1.4s ease forwards;
    animation-delay:var(--delay), calc(var(--delay) + 1s), 8.1s;
  }
  .palm::before{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.98) 0%, var(--color) 18%, rgba(255,255,255,.22) 38%, rgba(0,0,0,0) 74%);
    filter:blur(12px);opacity:.96;
  }
  .palm::after{
    content:"";position:absolute;left:50%;top:50%;width:54%;height:54%;transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.76) 0%, rgba(255,255,255,.18) 36%, rgba(0,0,0,0) 76%);
    box-shadow:0 0 18px var(--color),0 0 42px var(--color),0 0 64px color-mix(in srgb, var(--color) 75%, white 25%);
    opacity:.82;filter:blur(1px);
  }

  /* adjusted from screenshot */
  .vixen { left:14.75%; top:53.65%; --color:var(--blue);   --delay:5.2s; }
  .mareoj{ left:33.95%; top:54.85%; --color:var(--green);  --delay:5.7s; }
  .vel   { left:50.90%; top:55.95%; --color:var(--violet); --delay:6.2s; }
  .lyra  { left:68.05%; top:55.15%; --color:var(--orange); --delay:6.7s; }
  .uniq  { left:85.85%; top:54.10%; --color:var(--sky);    --delay:7.2s; }

  canvas{
    position:absolute;inset:0;z-index:20;pointer-events:none;opacity:0;
    animation:effectsOn .7s ease forwards;animation-delay:5.0s;
  }
  .legend{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:55;
    font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(238,248,255,.56);
    background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.06);border-radius:999px;
    padding:8px 12px;backdrop-filter:blur(5px);
  }

  @keyframes introIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes introOut{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-8px) scale(1.015)}}
  @keyframes stageIn{from{opacity:0}to{opacity:1}}
  @keyframes baseIn{0%{opacity:0;transform:scale(.993)}100%{opacity:1;transform:scale(1)}}
  @keyframes effectsOn{from{opacity:0}to{opacity:1}}
  @keyframes palmAppear{0%{opacity:0;transform:translate(-50%,-50%) scale(.18)}70%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}100%{opacity:.76;transform:translate(-50%,-50%) scale(1)}}
  @keyframes palmPulse{0%,100%{opacity:.72}50%{opacity:1}}
  @keyframes palmBright{0%{filter:brightness(1)}50%{filter:brightness(1.25)}100%{filter:brightness(2)}}
  @keyframes overlayIn{0%{opacity:0;filter:brightness(1.7)}100%{opacity:1;filter:brightness(1)}}

  @media (max-width:900px){
    .legend{display:none}
    .frame{width:100vw}
    .palm{width:7.6%}
  }
  @media (max-width:640px){
    .intro-box{margin-top:8vh}
    .intro-box h1{font-size:22px;letter-spacing:.18em}
    .intro-box p{font-size:9px}
    .frame{width:100vw}
    .palm{width:7.8%}
    .vixen { left:14.75%; top:53.65%; }
    .mareoj{ left:33.95%; top:54.85%; }
    .vel   { left:50.90%; top:55.95%; }
    .lyra  { left:68.05%; top:55.15%; }
    .uniq  { left:85.85%; top:54.10%; }
  }
</style>
</head>
<body>
<div class="scene">
  <div class="intro">
    <div class="intro-box">
      <h1>Welcome to Elythera</h1>
      <p>Activation sequence begins</p>
    </div>
  </div>

  <div class="stage">
    <div class="frame" id="frame">
      <img class="base" src="assets/elythera/elythera_team_base.png" alt="Elythera team base">
      <div class="effects">
        <div class="palm vixen"></div>
        <div class="palm mareoj"></div>
        <div class="palm vel"></div>
        <div class="palm lyra"></div>
        <div class="palm uniq"></div>
      </div>
      <canvas id="particles"></canvas>
      <img class="overlay" src="assets/elythera/elythera_team_overlay.png" alt="Elythera team overlay">
    </div>
  </div>

  <div class="legend">Orb weave test • dust circles and tightens • brighten • overlay</div>
</div>

<script>
const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');
const frame=document.getElementById('frame');

function resizeCanvas(){
  const dpr=window.devicePixelRatio||1;
  const rect=frame.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  canvas.style.width=rect.width+'px';
  canvas.style.height=rect.height+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

const palms=[
  {x:0.1475,y:0.5365,color:'#8ae4ff',delay:5200},
  {x:0.3395,y:0.5485,color:'#96ff92',delay:5700},
  {x:0.5090,y:0.5595,color:'#d8a1ff',delay:6200},
  {x:0.6805,y:0.5515,color:'#ffc873',delay:6700},
  {x:0.8585,y:0.5410,color:'#8aeaff',delay:7200},
];

let particles=[];

function rgba(hex,a){
  const h=hex.replace('#','');
  const n=parseInt(h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

function spawnWeave(palm, count, orbitScale=1){
  const rect=frame.getBoundingClientRect();
  const cx=rect.width*palm.x;
  const cy=rect.height*palm.y;

  for(let i=0;i<count;i++){
    particles.push({
      cx,cy,
      startAngle:Math.random()*Math.PI*2,
      loops:1.8+Math.random()*2.5,
      radius:(10+Math.random()*22)*orbitScale,
      endRadius:2+Math.random()*5,
      size:0.35+Math.random()*0.65,
      life:0,
      max:160+Math.random()*120,
      alpha:0.35+Math.random()*0.3,
      color:palm.color,
      lift:-2-Math.random()*8,
      tilt:-0.12+Math.random()*0.24
    });
  }
}

palms.forEach(p=>{
  setTimeout(()=>spawnWeave(p, 26, 1.15), p.delay + 250);
  setTimeout(()=>spawnWeave(p, 34, 1.0), p.delay + 1100);
  setTimeout(()=>spawnWeave(p, 42, 0.85), p.delay + 2200);
});

function render(){
  const rect=frame.getBoundingClientRect();
  ctx.clearRect(0,0,rect.width,rect.height);
  particles=particles.filter(p=>p.life<p.max);

  for(const p of particles){
    p.life++;
    const t=p.life/p.max;
    const ang=p.startAngle + (Math.PI*2*p.loops*t);
    const rad=p.radius + (p.endRadius-p.radius)*t;
    const ex=Math.cos(ang)*rad;
    const ey=Math.sin(ang)*rad*0.48 + p.lift*t;
    const x=p.cx + ex;
    const y=p.cy + ey + ex*p.tilt*0.1;
    const a=Math.max(0,p.alpha*(1-t));

    ctx.beginPath();
    ctx.fillStyle=rgba(p.color,a);
    ctx.shadowColor=rgba(p.color,a*0.95);
    ctx.shadowBlur=7;
    ctx.arc(x,y,p.size,0,Math.PI*2);
    ctx.fill();
  }
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
