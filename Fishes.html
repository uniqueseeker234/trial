<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Algae Archive System</title>

<style>

/* ===== BODY ===== */
body {
  margin: 0;
  background: radial-gradient(circle at center, #000814, #000);
  font-family: 'Segoe UI', sans-serif;
  color: white;
}

/* TITLE */
.title-main {
  text-align: center;
  margin: 20px;
  color: cyan;
  text-shadow: 0 0 10px cyan;
}

/* FILTER PANEL */
.filter-panel {
  margin: 15px;
  padding: 15px;
  border-radius: 14px;
  background: rgba(0,255,255,0.05);
  border: 1px solid rgba(0,255,255,0.3);
}

.filter-btn {
  padding: 8px 14px;
  margin: 5px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.2);
  cursor: pointer;
}

.filter-btn.active {
  background: cyan;
  color: black;
}

/* SEARCH */
input {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
}

/* CARDS */
.results {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}

.card {
  width: 200px;
  margin: 10px;
  padding: 10px;
  border-radius: 12px;
  border: 1px solid cyan;
  cursor: pointer;
}

.card img {
  width: 100%;
  border-radius: 10px;
}

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  justify-content: center;
  align-items: center;
  overflow:auto;
}

.close {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 25px;
  cursor: pointer;
  color: red;
}

/* ===== YOUR PANEL STYLE (UNCHANGED) ===== */
.panel {
  width: 560px;
  padding: 25px;
  position: relative;
  border-radius: 16px;

  background: rgba(0,255,255,0.05);
  backdrop-filter: blur(12px);

  border: 1px solid rgba(0,255,255,0.4);

  box-shadow:
    0 0 25px cyan,
    0 0 70px rgba(0,255,255,0.4),
    inset 0 0 25px rgba(0,255,255,0.2);
}

.panel::before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 16px;
  background: linear-gradient(90deg, transparent, cyan, transparent);
  animation: scan 4s linear infinite;
}

@keyframes scan {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.header { color: cyan; margin-bottom: 10px; }

.images { display: flex; gap: 10px; }
.images img { width: 50%; border: 1px solid cyan; }

.section { margin-top: 10px; }
.section h4 { color: cyan; }

</style>
</head>

<body>

<div class="title-main">ALGAE ARCHIVE SYSTEM</div>

<!-- SEARCH -->
<div class="filter-panel">
  <input type="text" id="search" placeholder="Search algae...">
</div>

<!-- CLASS -->
<div class="filter-panel">
  <div>Class</div>
  <div class="filter-btn">Chlorophyceae</div>
  <div class="filter-btn">Cyanophyceae</div>
  <div class="filter-btn">Phaeophyceae</div>
  <div class="filter-btn">Rhodophyceae</div>
</div>

<!-- HABITAT -->
<div class="filter-panel">
  <div>Habitat</div>
  <div class="filter-btn">Freshwater</div>
  <div class="filter-btn">Marine</div>
  <div class="filter-btn">Soil</div>
</div>

<div class="results" id="results"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="close" onclick="closeModal()">X</div>
  <div id="modalContent"></div>
</div>

<script>

/* DATA */
const algae = [
{
  name:"Cladophora",
  class:"Chlorophyceae",
  habitat:"Freshwater",
  short:"Filamentous green algae",
  full: `
  <div class="panel">

  <div class="header">⚠ ALGAE SYSTEM DATA</div>

  <div class="images">
    <img src="images2/Cladophora1.jpg">
    <img src="images2/Cladophora2.jpg">
  </div>

  <div class="title">Cladophora</div>

  <div class="section">
    <h4>Systematic Position</h4>
    <p>Division: Chlorophyta <br> Class: Ulvophyceae <br> Order: Cladophorales</p>
  </div>

  <div class="section">
    <h4>Morphology</h4>
    <p>• Filamentous, branched multicellular thallus</p>
  </div>

  <div class="section">
    <h4>Economic Importance</h4>
    <p>• Primary producer</p>
  </div>

  </div>
  `
},

{
  name:"Spirogyra",
  class:"Chlorophyceae",
  habitat:"Freshwater",
  short:"Spiral chloroplast algae",
  full:`<div class="panel"><h2>Spirogyra</h2></div>`
}

];

/* FILTER */
const btns=document.querySelectorAll(".filter-btn");

btns.forEach(b=>{
 b.onclick=()=>{
  b.classList.toggle("active");

  if(b.innerText==="Phaeophyceae"){
    document.querySelectorAll(".filter-btn").forEach(x=>{
      if(x.innerText==="Freshwater"||x.innerText==="Soil"){
        x.style.display="none";
      }
    });
  }

  update();
 }
});

document.getElementById("search").oninput=update;

function update(){
 const active=[...document.querySelectorAll(".active")].map(x=>x.innerText);
 const s=document.getElementById("search").value.toLowerCase();

 const f=algae.filter(a=>
  a.name.toLowerCase().includes(s) &&
  active.every(x=>a.class===x||a.habitat===x)
 );

 show(f);
}

function show(list){
 const r=document.getElementById("results");

 r.innerHTML=list.map(a=>`
 <div class="card" onclick="openCard('${a.name}')">
  <img src="images2/${a.name}1.jpg">
  <h4>${a.name}</h4>
  <p>${a.short}</p>
 </div>`).join("");
}

function openCard(name){
 const a=algae.find(x=>x.name===name);
 document.getElementById("modal").style.display="flex";
 document.getElementById("modalContent").innerHTML=a.full;
}

function closeModal(){
 document.getElementById("modal").style.display="none";
}

update();

</script>

</body>
</html>
