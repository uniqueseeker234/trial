<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Algae Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:sans-serif;
  color:white;
  overflow-x:hidden;
}

/* BACKGROUND */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background: url("images2/bg.jpg") center/cover no-repeat;
  filter: blur(12px) brightness(0.4);
  z-index:-1;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background: radial-gradient(circle at center, rgba(0,0,0,0.3), #000814);
  z-index:-1;
}

/* TITLE */
.title{
  text-align:center;
  padding:20px;
  font-size:26px;
  font-family: 'Special Elite', monospace;
}

/* GALLERY */
.gallery{
  display:flex;
  flex-direction:column;
  gap:40px;
  padding:25px;
}

/* EACH ROW */
.row{
  position:relative;
  display:flex;
  justify-content:space-around;
}

/* 🔥 FULL ROPE */
.row::before{
  content:"";
  position:absolute;
  top:-10px;
  left:0;
  width:100%;
  height:3px;
  background: linear-gradient(to right, #ccc, #fff, #ccc);
}

/* POLAROID WRAPPER */
.polaroid-wrapper{
  animation: float 5s ease-in-out infinite;
}

/* POLAROID */
.polaroid{
  background:white;
  padding:10px 10px 15px;
  border-radius:6px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.6);
  text-align:center;
  transform: rotate(var(--rot));
  transition: transform 0.3s ease;
  position: relative;
}

/* CLIP */
.polaroid::before{
  content:"";
  position:absolute;
  top:-8px;
  left:50%;
  transform:translateX(-50%);
  width:12px;
  height:6px;
  background:#ccc;
  border-radius:2px;
}

/* IMAGE */
.polaroid img{
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:4px;
}

/* NAME */
.polaroid p{
  margin-top:8px;
  font-size:13px;
  color:black;
  font-family: 'Permanent Marker', cursive;
}

/* HOVER */
.polaroid:hover{
  transform: scale(1.08) rotate(0deg);
}

/* FLOAT */
@keyframes float{
  0%{ transform: translateY(0px); }
  50%{ transform: translateY(-10px); }
  100%{ transform: translateY(0px); }
}

/* ROTATIONS */
.polaroid-wrapper:nth-child(1){ --rot: -3deg; }
.polaroid-wrapper:nth-child(2){ --rot: 2deg; }

</style>
</head>

<body>

<div class="title">ALGAE GALLERY</div>

<div class="gallery">

  <!-- ROW 1 -->
  <div class="row">
    <div class="polaroid-wrapper">
      <div class="polaroid">
        <img src="images2/Cladophora1.jpg" onerror="this.src='images2/default.jpg'">
        <p>Cladophora</p>
      </div>
    </div>

    <div class="polaroid-wrapper">
      <div class="polaroid">
        <img src="images2/Ulva lactuca1.jpg" onerror="this.src='images2/default.jpg'">
        <p>Ulva lactuca</p>
      </div>
    </div>
  </div>

  <!-- ROW 2 -->
  <div class="row">
    <div class="polaroid-wrapper">
      <div class="polaroid">
        <img src="images2/Chlorella1.jpg" onerror="this.src='images2/default.jpg'">
        <p>Chlorella</p>
      </div>
    </div>

    <div class="polaroid-wrapper">
      <div class="polaroid">
        <img src="images2/Spirogyra1.jpg" onerror="this.src='images2/default.jpg'">
        <p>Spirogyra</p>
      </div>
    </div>
  </div>

  <!-- ROW 3 -->
  <div class="row">
    <div class="polaroid-wrapper">
      <div class="polaroid">
        <img src="images2/Botryococcus1.jpg" onerror="this.src='images2/default.jpg'">
        <p>Botryococcus</p>
      </div>
    </div>

    <div class="polaroid-wrapper">
      <div class="polaroid">
        <img src="images2/Polysiphonia1.jpg" onerror="this.src='images2/default.jpg'">
        <p>Polysiphonia</p>
      </div>
    </div>
  </div>

</div>

</body>
</html>
