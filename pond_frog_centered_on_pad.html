<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Microscope Lab Viewer</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070c;
  font-family:system-ui;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  top:14px;
  left:14px;
  z-index:20;

  padding:14px;
  border-radius:16px;

  background:rgba(0,0,0,0.55);
  backdrop-filter:blur(10px);

  color:white;

  border:1px solid rgba(255,255,255,0.08);

  min-width:280px;
}

#hud h1{
  margin:0 0 12px;
  font-size:15px;
}

.row{
  margin-bottom:12px;
}

.label{
  display:flex;
  justify-content:space-between;
  margin-bottom:6px;
  font-size:12px;
}

.value{
  color:#7fe7d2;
}

input[type=range]{
  width:100%;
}

#info{
  margin-top:10px;
  font-size:12px;
  opacity:.8;
  line-height:1.5;
}
</style>
</head>

<body>

<div id="hud">

  <h1>Camera POV Controls</h1>

  <div class="row">
    <div class="label">
      <span>Left / Right (X)</span>
      <span class="value" id="vx">0.95</span>
    </div>
    <input id="sx" type="range" min="-10" max="10" step="0.01" value="0.95">
  </div>

  <div class="row">
    <div class="label">
      <span>Up / Down (Y)</span>
      <span class="value" id="vy">1.15</span>
    </div>
    <input id="sy" type="range" min="-10" max="10" step="0.01" value="1.15">
  </div>

  <div class="row">
    <div class="label">
      <span>Forward / Backward (Z)</span>
      <span class="value" id="vz">1.45</span>
    </div>
    <input id="sz" type="range" min="-15" max="15" step="0.01" value="1.45">
  </div>

  <div class="row">
    <div class="label">
      <span>Look Left / Right</span>
      <span class="value" id="vyaw">0</span>
    </div>
    <input id="syaw" type="range" min="-3.14" max="3.14" step="0.01" value="0">
  </div>

  <div class="row">
    <div class="label">
      <span>Look Up / Down</span>
      <span class="value" id="vpitch">-0.08</span>
    </div>
    <input id="spitch" type="range" min="-1.5" max="1.5" step="0.01" value="-0.08">
  </div>

  <div id="info">
    Adjust camera until it feels like sitting naturally on the chair looking into microscope.
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
(() => {

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);

renderer.outputEncoding = THREE.sRGBEncoding;

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x05070c);

scene.fog = new THREE.Fog(
  0x070a12,
  5,
  18
);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth/window.innerHeight,
  0.01,
  100
);

/* =========================
   CAMERA VALUES
========================= */

const eye = new THREE.Vector3(
  0.95,
  1.15,
  1.45
);

let yaw = 0;
let pitch = -0.08;

/* =========================
   SLIDERS
========================= */

const sx = document.getElementById("sx");
const sy = document.getElementById("sy");
const sz = document.getElementById("sz");

const syaw = document.getElementById("syaw");
const spitch = document.getElementById("spitch");

const vx = document.getElementById("vx");
const vy = document.getElementById("vy");
const vz = document.getElementById("vz");

const vyaw = document.getElementById("vyaw");
const vpitch = document.getElementById("vpitch");

function updateCamera(){

  eye.x = parseFloat(sx.value);
  eye.y = parseFloat(sy.value);
  eye.z = parseFloat(sz.value);

  yaw = parseFloat(syaw.value);
  pitch = parseFloat(spitch.value);

  vx.textContent = eye.x.toFixed(2);
  vy.textContent = eye.y.toFixed(2);
  vz.textContent = eye.z.toFixed(2);

  vyaw.textContent = yaw.toFixed(2);
  vpitch.textContent = pitch.toFixed(2);

  const dir = new THREE.Vector3(
    Math.cos(pitch) * Math.sin(yaw),
    Math.sin(pitch),
    -Math.cos(pitch) * Math.cos(yaw)
  );

  camera.position.copy(eye);

  camera.lookAt(
    eye.clone().add(dir)
  );
}

[sx,sy,sz,syaw,spitch].forEach(el=>{
  el.addEventListener("input", updateCamera);
});

updateCamera();

/* =========================
   LIGHTING
========================= */

const hemi = new THREE.HemisphereLight(
  0x9fdcff,
  0x07101f,
  0.65
);

scene.add(hemi);

const key = new THREE.DirectionalLight(
  0xffffff,
  0.85
);

key.position.set(6,8,4);

key.castShadow = true;

key.shadow.mapSize.set(2048,2048);

scene.add(key);

const rim = new THREE.DirectionalLight(
  0x7fe7d2,
  0.45
);

rim.position.set(-5,3,-2);

scene.add(rim);

const ambient = new THREE.AmbientLight(
  0xffffff,
  0.30
);

scene.add(ambient);

/* =========================
   LOADER
========================= */

const loader = new THREE.GLTFLoader();

function loadModel(path){

  return new Promise((resolve,reject)=>{

    loader.load(
      path,
      gltf => resolve(gltf.scene),
      undefined,
      reject
    );

  });

}

/* =========================
   MATERIAL FIX
========================= */

function fixMaterials(root){

  root.traverse(o => {

    if(!o.isMesh) return;

    o.castShadow = true;
    o.receiveShadow = true;

    const mats = Array.isArray(o.material)
      ? o.material
      : [o.material];

    mats.forEach(m => {

      if(!m) return;

      m.side = THREE.DoubleSide;

      if(m.map){
        m.map.encoding = THREE.sRGBEncoding;
      }

      if("metalness" in m){
        m.metalness *= 0.55;
      }

      if("roughness" in m){
        m.roughness = Math.min(
          1,
          m.roughness + 0.05
        );
      }

      m.needsUpdate = true;

    });

  });

}

/* =========================
   LOAD SCENE
========================= */

(async()=>{

const room = await loadModel("./room.glb");

fixMaterials(room);

scene.add(room);

/* TABLE */

const table = await loadModel(
  "./models/lumen_hologram_table.glb"
);

fixMaterials(table);

room.add(table);

table.position.set(
  1.60,
  0.10,
  -0.80
);

table.scale.set(
  0.75,
  0.75,
  0.75
);

table.rotation.y = -3.14;

/* MICROSCOPE */

const microscope = await loadModel(
  "./models/microscope.glb"
);

fixMaterials(microscope);

room.add(microscope);

microscope.position.set(
  1.54,
  0.45,
  -0.28
);

microscope.scale.set(
  0.14,
  0.14,
  0.14
);

microscope.rotation.set(
  -0.02,
  1.7,
  0
);

/* JOURNAL */

const journal = await loadModel(
  "./models/journal.glb"
);

fixMaterials(journal);

room.add(journal);

journal.position.set(
  1.58,
  0.37,
  -0.62
);

journal.scale.set(
  0.05,
  0.05,
  0.05
);

journal.rotation.set(
  -1.66,
  0.68,
  1.69
);

/* CHAIR */

const chair = await loadModel(
  "./round_chair.glb"
);

fixMaterials(chair);

const chairBox = new THREE.Box3()
.setFromObject(chair);

const chairCenter = new THREE.Vector3();

chairBox.getCenter(chairCenter);

chair.position.sub(chairCenter);

room.add(chair);

chair.position.set(
  -0.35,
  -0.15,
  1.50
);

chair.scale.set(
  0.40,
  0.40,
  0.40
);

chair.rotation.y = 0.05;

})();

/* =========================
   LOOP
========================= */

function animate(){

  requestAnimationFrame(animate);

  renderer.render(scene,camera);
}

animate();

/* =========================
   RESIZE
========================= */

window.addEventListener("resize", ()=>{

  camera.aspect =
    window.innerWidth /
    window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

})();
</script>

</body>
</html>
