<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inside Room 360 Test</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
  }
  #msg {
    position: fixed;
    top: 12px;
    left: 12px;
    color: white;
    background: rgba(0,0,0,0.55);
    padding: 10px 12px;
    border-radius: 12px;
    z-index: 10;
    font-size: 14px;
    line-height: 1.4;
  }
  #msg small {
    opacity: 0.85;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="msg">Loading room...<br><small>Drag to look around inside.</small></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const msg = document.getElementById('msg');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.01,
  2000
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 2.2);
scene.add(hemi);

const dir = new THREE.DirectionalLight(0xffffff, 1.6);
dir.position.set(5, 8, 5);
scene.add(dir);

const fill = new THREE.PointLight(0xffffff, 2.2, 30);
fill.position.set(-3, 2.8, 2.5);
scene.add(fill);

const loader = new GLTFLoader();

let room = null;
let eye = new THREE.Vector3(0, 1.6, 0);
let yaw = 0;
let pitch = 0;
let dragging = false;
let lastX = 0;
let lastY = 0;

function updateLook() {
  const direction = new THREE.Vector3(
    Math.cos(pitch) * Math.sin(yaw),
    Math.sin(pitch),
    -Math.cos(pitch) * Math.cos(yaw)
  );
  const target = eye.clone().add(direction);
  camera.position.copy(eye);
  camera.lookAt(target);
}

loader.load(
  './models/room.glb',
  (gltf) => {
    room = gltf.scene;
    room.scale.set(1, 1, 1);
    scene.add(room);

    room.traverse((child) => {
      if (child.isMesh && child.material) {
        child.material.side = THREE.DoubleSide;

        const n = (child.name || '').toLowerCase();

        // Hide obvious giant backdrop / studio plane / shadow catcher meshes if present.
        if (
          n.includes('backdrop') ||
          n.includes('background') ||
          n.includes('shadow') ||
          n.includes('plane') ||
          n.includes('studio')
        ) {
          child.visible = false;
        }
      }
    });

    const box = new THREE.Box3().setFromObject(room);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    // Center the whole model at world origin.
    room.position.sub(center);

    // Recompute after centering.
    const box2 = new THREE.Box3().setFromObject(room);
    const size2 = box2.getSize(new THREE.Vector3());

    // Place the camera INSIDE the room.
    // Tuned for open-front room type like your screenshots.
    eye.set(
      0,
      Math.max(0.9, size2.y * 0.22),
      Math.max(0.2, size2.z * 0.10)
    );

    yaw = 0;
    pitch = 0;
    updateLook();

    msg.innerHTML = 'Room loaded<br><small>Drag to look around inside.</small>';
    console.log('Room size:', size2);
  },
  (xhr) => {
    if (xhr.total) {
      const percent = ((xhr.loaded / xhr.total) * 100).toFixed(0);
      msg.innerHTML = `Loading room... ${percent}%<br><small>Drag to look around inside.</small>`;
    }
  },
  (err) => {
    msg.innerHTML = 'Failed to load room.glb';
    console.error(err);
  }
);

// Mouse / touch look-around
renderer.domElement.addEventListener('mousedown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener('mouseup', () => {
  dragging = false;
});

window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;

  yaw -= dx * 0.005;
  pitch -= dy * 0.004;
  pitch = Math.max(-1.3, Math.min(1.3, pitch));
  updateLook();
});

renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  dragging = true;
  lastX = e.touches[0].clientX;
  lastY = e.touches[0].clientY;
}, { passive: true });

renderer.domElement.addEventListener('touchmove', (e) => {
  if (!dragging || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - lastX;
  const dy = e.touches[0].clientY - lastY;
  lastX = e.touches[0].clientX;
  lastY = e.touches[0].clientY;

  yaw -= dx * 0.005;
  pitch -= dy * 0.004;
  pitch = Math.max(-1.3, Math.min(1.3, pitch));
  updateLook();
}, { passive: true });

window.addEventListener('touchend', () => {
  dragging = false;
});

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  updateLook();
});
</script>
</body>
</html>
