<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<title>Algae Archive System</title>

<style>

/* ===== BODY ===== */
body {
  margin: 0;
  background: radial-gradient(circle at center, #000814, #000);
  font-family: 'Inter', sans-serif;
  color: white;
}

/* TITLE */
.title {
  text-align: center;
  margin: 20px;
  font-family: 'Orbitron', sans-serif;
  font-size: 24px;
  color: cyan;
  text-shadow: 0 0 20px cyan;
}

/* PANEL */
.panel-ui {
  margin: 20px 15px;
  padding: 18px;
  border-radius: 18px;
  background: rgba(0,255,255,0.03);
  border: 1px solid rgba(0,255,255,0.3);
}

/* SECTION TITLE */
.section-title {
  margin-bottom: 12px;
  color: cyan;
  font-size: 14px;
  letter-spacing: 1px;
}

/* GROUP */
.group {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* BUTTON */
.filter-btn {
  padding: 12px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.05);
  cursor: pointer;
  transition: 0.25s;

  /* POP OUT EFFECT */
  box-shadow:
    0 5px 10px rgba(0,0,0,0.6),
    inset 0 0 5px rgba(255,255,255,0.1);
}

/* HOVER */
.filter-btn:hover {
  transform: translateY(-2px);
  box-shadow:
    0 0 10px cyan,
    0 10px 20px rgba(0,0,0,0.8);
}

/* ACTIVE */
.filter-btn.active {
  background: rgba(0,255,255,0.2);
  border-color: cyan;
  box-shadow:
    0 0 15px cyan,
    0 0 30px cyan;
}

/* PRESS EFFECT */
.filter-btn:active {
  transform: scale(0.95);
  box-shadow: 0 0 25px cyan;
}

/* SEARCH */
.search-box {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
}

/* RESULTS */
.results {
  padding: 10px;
}

/* CARD */
.card {
  display: flex;
  gap: 12px;
  margin: 15px;
  padding: 12px;
  border-radius: 16px;

  border: 1px solid rgba(0,255,255,0.4);

  background: rgba(0,255,255,0.04);
  backdrop-filter: blur(10px);

  box-shadow:
    0 0 10px rgba(0,255,255,0.2),
    inset 0 0 10px rgba(0,255,255,0.1);

  transition: 0.3s;
}

.card:hover {
  transform: scale(1.03);
  box-shadow:
    0 0 20px cyan,
    inset 0 0 15px rgba(0,255,255,0.3);
}

.card img {
  width: 90px;
  height: 90px;
  object-fit: cover;
  border-radius: 12px;
  border: 1px solid cyan;
  box-shadow: 0 0 10px rgba(0,255,255,0.5);
}

.card-text h4 {
  margin: 0;
}

.card-text p {
  margin: 5px 0 0;
  color: #bdfcff;
}

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: none;
  overflow-y: auto;
  padding: 20px;
}

.close {
  position: fixed;
  top: 20px;
  right: 20px;
  color: red;
  font-size: 25px;
  cursor: pointer;
}

/* FULL CARD */
.panel {
  max-width: 560px;
  margin: 20px auto;
  padding: 25px;
  border-radius: 20px;

  background: rgba(0,255,255,0.05);
  backdrop-filter: blur(12px);

  border: 1px solid rgba(0,255,255,0.4);

  box-shadow:
    0 0 25px cyan,
    0 0 70px rgba(0,255,255,0.4),
    inset 0 0 25px rgba(0,255,255,0.2);
}

.images {
  display: flex;
  gap: 10px;
}

.images img {
  width: 50%;
  border-radius: 12px;
  border: 1px solid cyan;
}

.section {
  margin-top: 12px;
}

.section h4 {
  color: cyan;
}

.section p {
  color: #bdfcff;
  line-height: 1.6;
}

</style>
</head>

<body>

<div class="title">ALGAE ARCHIVE SYSTEM</div>

<!-- SEARCH -->
<div class="panel-ui">
  <input type="text" id="search" class="search-box" placeholder="Search algae...">
</div>

<!-- CLASS -->
<div class="panel-ui">
  <div class="section-title">CLASSES OF ALGAE</div>
  <div class="group">
    <div class="filter-btn">Chlorophyceae</div>
    <div class="filter-btn">Cyanophyceae</div>
    <div class="filter-btn">Phaeophyceae</div>
    <div class="filter-btn">Rhodophyceae</div>
  </div>
</div>

<!-- HABITAT -->
<div class="panel-ui">
  <div class="section-title">HABITAT</div>
  <div class="group">
    <div class="filter-btn">Freshwater</div>
    <div class="filter-btn">Marine</div>
    <div class="filter-btn">Soil</div>
  </div>
</div>

<div class="results" id="results"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="close" onclick="closeModal()">X</div>
  <div id="modalContent"></div>
</div>

<script>

/* DATA */
const algae = [
{
  name:"Cladophora",
  class:"Chlorophyceae",
  habitat:"Freshwater",
  short:"Filamentous green algae",
  full: `
  <div class="panel">
    <div class="images">
      <img src="images2/Cladophora1.jpg">
      <img src="images2/Cladophora2.jpg">
    </div>

    <h2>Cladophora</h2>

    <div class="section">
      <h4>Systematic Position</h4>
      <p>Division: Chlorophyta<br>Class: Ulvophyceae<br>Order: Cladophorales</p>
    </div>

    <div class="section">
      <h4>Morphology</h4>
      <p>• Filamentous branched multicellular thallus</p>
    </div>
  </div>
  `
},

{
  name:"Spirogyra",
  class:"Chlorophyceae",
  habitat:"Freshwater",
  short:"Spiral chloroplast algae"
}
];

/* FILTER SYSTEM */
const btns = document.querySelectorAll(".filter-btn");

btns.forEach(btn=>{
  btn.onclick=()=>{
    btn.classList.toggle("active");
    update();
  }
});

document.getElementById("search").oninput = update;

function update(){
  const active=[...document.querySelectorAll(".active")].map(x=>x.innerText);
  const search=document.getElementById("search").value.toLowerCase();

  const filtered=algae.filter(a=>
    a.name.toLowerCase().includes(search) &&
    active.every(f=>a.class===f || a.habitat===f)
  );

  show(filtered);
}

function show(list){
  const r=document.getElementById("results");

  r.innerHTML=list.map(a=>`
  <div class="card" onclick="openCard('${a.name}')">
    <img src="images2/${a.name}1.jpg" onerror="this.src='images2/default.jpg'">
    <div class="card-text">
      <h4>${a.name}</h4>
      <p>${a.short}</p>
    </div>
  </div>
  `).join("");
}

function openCard(name){
  const a=algae.find(x=>x.name===name);
  document.getElementById("modal").style.display="block";
  document.getElementById("modalContent").innerHTML = a.full || `
    <div class="panel"><h2>${name}</h2><p>Full data coming soon</p></div>
  `;
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

update();

</script>

</body>
</html>
