<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algae System Panel</title>

<style>

body {
  margin: 0;
  background: radial-gradient(circle at center, #000814, #000);
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* ===== MAIN PANEL ===== */
.panel {
  width: 500px;
  padding: 25px;
  position: relative;
  border-radius: 15px;

  /* GLASS */
  background: rgba(0, 255, 255, 0.05);
  backdrop-filter: blur(12px);

  /* NEON BORDER */
  border: 1px solid rgba(0,255,255,0.4);

  /* OUTER GLOW */
  box-shadow:
    0 0 20px cyan,
    0 0 60px rgba(0,255,255,0.4),
    inset 0 0 20px rgba(0,255,255,0.2);

  transition: 0.4s;
}

/* ANIMATION GLOW */
.panel::before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 15px;
  background: linear-gradient(90deg, transparent, cyan, transparent);
  animation: scan 4s linear infinite;
  opacity: 0.6;
}

@keyframes scan {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

/* HEADER */
.header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
  color: cyan;
  font-weight: bold;
  letter-spacing: 1px;
}

/* TITLE */
.title {
  font-size: 22px;
  color: white;
  margin-bottom: 10px;
}

/* TEXT */
.text {
  color: #bdfcff;
  line-height: 1.5;
  font-size: 14px;
}

/* IMAGE SECTION */
.images {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

.images img {
  width: 50%;
  border-radius: 8px;
  border: 1px solid cyan;
}

/* HOVER EFFECT */
.panel:hover {
  transform: scale(1.05);
  box-shadow:
    0 0 40px cyan,
    0 0 80px rgba(0,255,255,0.6),
    inset 0 0 25px rgba(0,255,255,0.4);
}

</style>
</head>

<body>

<div class="panel">

  <div class="header">
    ⚠ SYSTEM DATA
  </div>

  <div class="images">
    <img src="https://via.placeholder.com/200">
    <img src="https://via.placeholder.com/200">
  </div>

  <div class="title">Cladophora</div>

  <div class="text">
    Filamentous green algae commonly found in freshwater and marine environments. 
    Exhibits rapid growth and forms dense mats.
  </div>

</div>

</body>
</html>
