<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compare Animation</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at center, #020617, #000814);
  overflow:hidden;
}

/* MAIN BOX */
.container{
  position:relative;
  width:80%;
  max-width:800px;
  height:400px;
}

/* TITLE */
.title{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  color:gold;
  font-size:28px;
  letter-spacing:3px;

  animation: moveUp 1.5s ease forwards;
  animation-delay:0.5s;
}

/* MOVE TITLE UP */
@keyframes moveUp{
  to{
    top:20px;
    transform:translateX(-50%);
    font-size:22px;
  }
}

/* TABLE */
.table{
  position:absolute;
  top:60px;
  left:0;
  width:100%;
  height:300px;
}

/* VERTICAL LINE */
.vertical{
  position:absolute;
  top:0;
  left:50%;
  width:4px;
  height:0;
  background:gold;
  box-shadow:0 0 15px gold;
  transform:translateX(-50%);
  animation: drawVertical 1s ease forwards;
  animation-delay:1.8s;
}

/* HORIZONTAL LINES */
.row-line{
  position:absolute;
  left:0;
  width:0%;
  height:3px;
  background:gold;
  box-shadow:0 0 10px gold;
  animation: drawHorizontal 1s ease forwards;
}

/* ROW POSITIONS */
.row1{ top:40px; animation-delay:2.2s;}
.row2{ top:90px; animation-delay:2.4s;}
.row3{ top:140px; animation-delay:2.6s;}
.row4{ top:190px; animation-delay:2.8s;}
.row5{ top:240px; animation-delay:3s;}

/* DRAW ANIMATIONS */
@keyframes drawVertical{
  to{ height:100%; }
}

@keyframes drawHorizontal{
  to{ width:100%; }
}

/* HEADINGS */
.head{
  position:absolute;
  top:10px;
  width:50%;
  text-align:center;
  color:gold;
  font-size:18px;
  opacity:0;
  animation: fadeIn 1s ease forwards;
  animation-delay:3.2s;
}

.head.left{ left:0; }
.head.right{ right:0; }

/* ROW TEXT */
.cell{
  position:absolute;
  width:50%;
  text-align:center;
  color:white;
  font-size:14px;
  opacity:0;
  animation: fadeIn 0.8s ease forwards;
}

/* LEFT CELLS */
.l1{ top:50px; left:0; animation-delay:3.5s;}
.l2{ top:100px; left:0; animation-delay:3.7s;}
.l3{ top:150px; left:0; animation-delay:3.9s;}
.l4{ top:200px; left:0; animation-delay:4.1s;}
.l5{ top:250px; left:0; animation-delay:4.3s;}

/* RIGHT CELLS */
.r1{ top:50px; right:0; animation-delay:3.5s;}
.r2{ top:100px; right:0; animation-delay:3.7s;}
.r3{ top:150px; right:0; animation-delay:3.9s;}
.r4{ top:200px; right:0; animation-delay:4.1s;}
.r5{ top:250px; right:0; animation-delay:4.3s;}

/* FADE */
@keyframes fadeIn{
  to{ opacity:1; }
}

/* 3D EFFECT */
.table{
  transform: perspective(800px) rotateX(5deg);
}
</style>
</head>

<body>

<div class="container">

  <div class="title">COMPARE ALGAE</div>

  <div class="table">

    <!-- HEADINGS -->
    <div class="head left">Algae 1</div>
    <div class="head right">Algae 2</div>

    <!-- LINES -->
    <div class="vertical"></div>

    <div class="row-line row1"></div>
    <div class="row-line row2"></div>
    <div class="row-line row3"></div>
    <div class="row-line row4"></div>
    <div class="row-line row5"></div>

    <!-- LEFT -->
    <div class="cell l1">Colour</div>
    <div class="cell l2">Habitat</div>
    <div class="cell l3">Morphology</div>
    <div class="cell l4">Salient Features</div>
    <div class="cell l5">Economic Importance</div>

    <!-- RIGHT -->
    <div class="cell r1">---</div>
    <div class="cell r2">---</div>
    <div class="cell r3">---</div>
    <div class="cell r4">---</div>
    <div class="cell r5">---</div>

  </div>

</div>

</body>
</html>
