<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Algae System</title>

<style>

/* ===== BODY ===== */
body {
  margin: 0;
  background: radial-gradient(circle at center, #000814, #000);
  font-family: 'Segoe UI', sans-serif;
  color: white;
}

/* TITLE */
.title {
  text-align: center;
  margin: 20px;
  font-size: 22px;
  color: cyan;
  text-shadow: 0 0 15px cyan;
}

/* PANEL */
.panel-filter {
  margin: 15px;
  padding: 15px;
  border-radius: 14px;
  border: 1px solid rgba(0,255,255,0.3);
  background: rgba(0,255,255,0.05);
}

/* BUTTON */
.filter-btn {
  margin: 5px;
  padding: 8px 12px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.2);
  cursor: pointer;
}

.filter-btn.active {
  background: cyan;
  color: black;
}

/* SEARCH */
input {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
}

/* RESULT GRID */
.results {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}

/* ===== YOUR CARD ===== */
.panel {
  width: 500px;
  margin: 15px;
  padding: 20px;
  border-radius: 16px;
  background: rgba(0,255,255,0.05);
  border: 1px solid rgba(0,255,255,0.4);
  box-shadow: 0 0 20px cyan;
}

.images {
  display: flex;
  gap: 10px;
}

.images img {
  width: 50%;
}

.title-card {
  font-size: 20px;
  margin: 10px 0;
}

.section {
  margin-top: 10px;
}

</style>
</head>

<body>

<div class="title">ALGAE SYSTEM</div>

<!-- SEARCH -->
<div class="panel-filter">
  <input type="text" id="searchInput" placeholder="Search algae name...">
</div>

<!-- CLASS -->
<div class="panel-filter">
  <div>Class:</div>
  <div class="filter-btn">Chlorophyceae</div>
  <div class="filter-btn">Cyanophyceae</div>
  <div class="filter-btn">Phaeophyceae</div>
  <div class="filter-btn">Rhodophyceae</div>
</div>

<!-- HABITAT -->
<div class="panel-filter">
  <div>Habitat:</div>
  <div class="filter-btn">Freshwater</div>
  <div class="filter-btn">Marine</div>
  <div class="filter-btn">Soil</div>
</div>

<!-- RESULTS -->
<div class="results" id="results"></div>

<script>

/* ===== DATA (ADD ALL 50 HERE) ===== */
const algaeData = [
  {
    name: "Cladophora",
    class: "Chlorophyceae",
    habitat: "Freshwater",
    desc: "Filamentous branched green algae"
  },
  {
    name: "Spirogyra",
    class: "Chlorophyceae",
    habitat: "Freshwater",
    desc: "Spiral chloroplast filamentous algae"
  }
];

/* FILTER LOGIC */
const buttons = document.querySelectorAll(".filter-btn");

buttons.forEach(btn => {
  btn.onclick = () => {
    btn.classList.toggle("active");
    update();
  };
});

document.getElementById("searchInput").addEventListener("input", update);

function update() {

  const active = [...document.querySelectorAll(".filter-btn.active")]
    .map(b => b.innerText);

  const search = document.getElementById("searchInput").value.toLowerCase();

  const filtered = algaeData.filter(a => {

    const matchSearch = a.name.toLowerCase().includes(search);

    const matchFilter = active.every(f =>
      a.class === f || a.habitat === f
    );

    return matchSearch && matchFilter;
  });

  display(filtered);
}

/* DISPLAY CARDS */
function display(list) {

  const results = document.getElementById("results");

  if (list.length === 0) {
    results.innerHTML = "<p>No algae found</p>";
    return;
  }

  results.innerHTML = list.map(a => `
    <div class="panel">

      <div class="images">
        <img src="images2/${a.name}1.jpg">
        <img src="images2/${a.name}2.jpg">
      </div>

      <div class="title-card">${a.name}</div>

      <div class="section">
        ${a.desc}
      </div>

    </div>
  `).join("");
}

update();

</script>

</body>
</html>
