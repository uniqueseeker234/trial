<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elythera Lab Room</title>

<style>
html,body{
margin:0;
height:100%;
overflow:hidden;
background:#eef2f6;
font-family:Arial, sans-serif;
}

#hud{
position:fixed;
top:10px;
left:10px;
background:rgba(0,0,0,0.55);
color:white;
padding:10px 14px;
border-radius:10px;
font-size:13px;
z-index:10;
}
</style>

<script type="importmap">
{
"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}
}
</script>
</head>

<body>

<div id="hud">
Mission Elythera Lab<br>
Drag mouse to look around
</div>

<script type="module">

import * as THREE from 'three'
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js'

const scene=new THREE.Scene()
scene.background=new THREE.Color(0xe9eef3)

const camera=new THREE.PerspectiveCamera(
70,
window.innerWidth/window.innerHeight,
0.01,
1000
)

const renderer=new THREE.WebGLRenderer({antialias:true})
renderer.setSize(window.innerWidth,window.innerHeight)
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2))
renderer.outputColorSpace=THREE.SRGBColorSpace
document.body.appendChild(renderer.domElement)

scene.add(new THREE.HemisphereLight(0xffffff,0xdfe7ee,2))

const light=new THREE.DirectionalLight(0xffffff,1.5)
light.position.set(4,6,4)
scene.add(light)

const loader=new GLTFLoader()

function loadModel(path){
return new Promise((resolve,reject)=>{
loader.load(path,g=>resolve(g.scene),undefined,reject)
})
}

let eye=new THREE.Vector3(0,1.2,1)
let yaw=0
let pitch=0

let drag=false
let lx=0
let ly=0

function updateLook(){

const dir=new THREE.Vector3(
Math.cos(pitch)*Math.sin(yaw),
Math.sin(pitch),
-Math.cos(pitch)*Math.cos(yaw)
)

camera.position.copy(eye)
camera.lookAt(eye.clone().add(dir))

}

renderer.domElement.addEventListener("mousedown",e=>{
drag=true
lx=e.clientX
ly=e.clientY
})

window.addEventListener("mouseup",()=>drag=false)

window.addEventListener("mousemove",e=>{

if(!drag)return

const dx=e.clientX-lx
const dy=e.clientY-ly

lx=e.clientX
ly=e.clientY

yaw-=dx*0.005
pitch-=dy*0.004

pitch=Math.max(-1.2,Math.min(1.2,pitch))

updateLook()

})

async function init(){

const room=await loadModel("./room.glb")
scene.add(room)

const table=await loadModel("./models/research_table.glb")
table.position.set(0,0,0)
scene.add(table)

const microscope=await loadModel("./models/microscope.glb")
microscope.position.set(-0.35,0.75,-0.15)
microscope.scale.setScalar(0.3)
scene.add(microscope)

const jar=await loadModel("./models/algae_specimen_jar_lowpoly.glb")
jar.position.set(0.15,0.75,-0.05)
jar.scale.setScalar(0.35)
scene.add(jar)

const laptop=await loadModel("./models/laptop.glb")
laptop.position.set(0.4,0.75,0.2)
laptop.scale.setScalar(0.3)
scene.add(laptop)

const cup=await loadModel("./models/coffee_cup.glb")
cup.position.set(0.15,0.75,0.35)
cup.scale.setScalar(0.25)
scene.add(cup)

const books=await loadModel("./models/books.glb")
books.position.set(-0.2,0.75,0.3)
books.scale.setScalar(0.35)
scene.add(books)

const journal=await loadModel("./models/journal.glb")
journal.position.set(0,0.75,0.1)
journal.rotation.x=-0.35
journal.scale.setScalar(0.35)
scene.add(journal)

const globe=await loadModel("./models/glass_globe.glb")
globe.position.set(-0.5,0.75,0.2)
globe.scale.setScalar(0.4)
scene.add(globe)

const marble=await loadModel("./models/marble_table_2.glb")
marble.position.set(1.2,0,0)
marble.scale.setScalar(0.8)
scene.add(marble)

updateLook()

}

init()

function animate(){
requestAnimationFrame(animate)
renderer.render(scene,camera)
}

animate()

window.addEventListener("resize",()=>{
camera.aspect=window.innerWidth/window.innerHeight
camera.updateProjectionMatrix()
renderer.setSize(window.innerWidth,window.innerHeight)
})

</script>

</body>
</html>
