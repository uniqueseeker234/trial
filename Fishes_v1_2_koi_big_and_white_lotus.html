<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<title>UI Test</title>

<style>

/* ===== BODY ===== */
body {
  margin: 0;
  background: radial-gradient(circle at center, #000814, #000);
  font-family: 'Inter', sans-serif;
  color: white;
}

/* TITLE */
.title {
  text-align: center;
  margin-top: 20px;
  font-family: 'Orbitron', sans-serif;
  font-size: 20px;
  color: cyan;
  text-shadow: 0 0 10px cyan;
}

/* CONTAINER */
.container {
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ===== CARD ===== */
.card {
  position: relative;
  height: 110px;
  border-radius: 18px;
  overflow: hidden;
  backdrop-filter: blur(12px);
  transition: 0.3s;
}

/* ===== VIDEO BACKGROUND ===== */
.bg-video {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  top: 0;
  left: 0;
  z-index: 0;
}

/* ===== OVERLAY ===== */
.search::after,
.explore::after,
.compare::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 1;
}

/* TEXT */
.card h2 {
  position: absolute;
  bottom: 15px;
  left: 15px;
  margin: 0;
  font-size: 16px;
  z-index: 2;
}

/* ===== COLORS ===== */
.search { border: 1px solid cyan; }
.search:hover { box-shadow: 0 0 20px cyan, 0 0 40px cyan; }

.explore { border: 1px solid lime; }
.explore:hover { box-shadow: 0 0 20px lime, 0 0 40px lime; }

.compare { border: 1px solid violet; }
.compare:hover { box-shadow: 0 0 20px violet, 0 0 40px violet; }

/* ===== INDIA SPECIAL ===== */
.india {
  background: black;
  border: 1px solid cyan;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* REMOVE BG IMAGE */
.india::before {
  display: none;
}
.india::after {
  display: none;
}

/* INDIA IMAGE */
.india-img {
  position: absolute;
  width: 48%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, calc(-50% - 1px));
  z-index: 1;
}

/* INDIA TEXT */
.india h2 {
  position: absolute;
  bottom: 10px;
  left: 15px;
  z-index: 2;
}

/* INDIA GLOW */
.india:hover {
  box-shadow: 0 0 25px cyan, 0 0 50px cyan;
}

/* ===== CONTROLS ===== */
.controls {
  display:none;
  margin: 20px;
  padding: 10px;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
  backdrop-filter: blur(10px);
  font-size: 12px;
}

.controls input {
  width: 100%;
  margin-bottom: 10px;
}

@media (min-width: 768px) {

  .container {
    max-width: 700px;
    margin: auto;
  }

  .card {
    height: 150px;
  }

  .india-img {
    width: 40%;
    transform: translate(-50%, -50%);
  }

}

</style>
</head>

<body>

<div class="title">ALGAE ARCHIVE SYSTEM</div>

<div class="container">

  <!-- SEARCH -->
  <div class="card search">
    <video autoplay muted loop playsinline class="bg-video">
      <source src="images2/search.mp4" type="video/mp4">
    </video>
    <h2>SEARCH ALGAE</h2>
  </div>

  <!-- EXPLORE -->
  <div class="card explore">
    <video autoplay muted loop playsinline class="bg-video">
      <source src="images2/explore.mp4" type="video/mp4">
    </video>
    <h2>EXPLORE WORLD</h2>
  </div>

  <!-- COMPARE -->
  <div class="card compare">
    <video autoplay muted loop playsinline class="bg-video">
      <source src="images2/compare.mp4" type="video/mp4">
    </video>
    <h2>COMPARE ALGAE</h2>
  </div>

  <!-- INDIA CARD -->
  <div class="card india">
    <img src="images2/india-map.jpg" class="india-img">
    <h2>COMMON ALGAE IN INDIA</h2>
  </div>

</div>

<!-- SLIDER CONTROLS -->
<div class="controls">
  <label>Size: <span id="sizeValue">70</span>%</label>
  <input type="range" min="40" max="100" value="70" id="sizeSlider">

  <label>Vertical Position: <span id="yValue">0</span>px</label>
  <input type="range" min="-50" max="50" value="0" id="ySlider">
</div>

<script>
const img = document.querySelector(".india-img");

const sizeSlider = document.getElementById("sizeSlider");
const ySlider = document.getElementById("ySlider");

const sizeValue = document.getElementById("sizeValue");
const yValue = document.getElementById("yValue");

function updateTransform() {
  img.style.transform =
    "translate(-50%, calc(-50% + " + ySlider.value + "px))";
}

sizeSlider.addEventListener("input", () => {
  img.style.width = sizeSlider.value + "%";
  sizeValue.textContent = sizeSlider.value;
});

ySlider.addEventListener("input", () => {
  updateTransform();
  yValue.textContent = ySlider.value;
});

sizeValue.textContent = sizeSlider.value;
yValue.textContent = ySlider.value;
updateTransform();
</script>

</body>
</html>
