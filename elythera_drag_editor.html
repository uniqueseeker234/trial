<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elythera Drag Editor</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}
#hud {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 20;
  color: white;
  background: rgba(0,0,0,0.58);
  padding: 10px 12px;
  border-radius: 12px;
  line-height: 1.45;
  font-size: 13px;
  max-width: 320px;
}
#coords {
  position: fixed;
  bottom: 10px;
  left: 10px;
  z-index: 20;
  color: white;
  background: rgba(0,0,0,0.58);
  padding: 8px 10px;
  border-radius: 10px;
  font-size: 12px;
  min-width: 220px;
}
#list {
  position: fixed;
  top: 10px;
  right: 10px;
  z-index: 20;
  color: white;
  background: rgba(0,0,0,0.58);
  padding: 10px 12px;
  border-radius: 12px;
  font-size: 13px;
  min-width: 180px;
}
#list .item {
  padding: 6px 8px;
  margin: 4px 0;
  border-radius: 8px;
  background: rgba(255,255,255,0.08);
  cursor: pointer;
}
#list .item.active {
  background: rgba(120,200,255,0.35);
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="hud">
  <strong>Elythera Drag Editor</strong><br>
  Drag to orbit around the room.<br>
  Click an object to select it.<br>
  Drag the gizmo arrows to move it.<br>
  Press <b>W</b> move, <b>E</b> rotate, <b>R</b> scale.<br>
  Press <b>Q</b> local/world toggle.<br>
  Press <b>Esc</b> to deselect.
</div>

<div id="coords">No object selected</div>
<div id="list"><strong>Objects</strong><div id="items"></div></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.01, 3000);
camera.position.set(0, 1.6, 4.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xffffff, 0x999999, 2.2);
scene.add(hemi);

const dir = new THREE.DirectionalLight(0xffffff, 2.0);
dir.position.set(5, 10, 7);
scene.add(dir);

const fill = new THREE.PointLight(0xffffff, 1.8, 40);
fill.position.set(-4, 3, 4);
scene.add(fill);

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;
orbit.dampingFactor = 0.08;
orbit.target.set(0, 1.2, 0);
orbit.minDistance = 1.2;
orbit.maxDistance = 12;
orbit.maxPolarAngle = Math.PI * 0.49;

const transform = new TransformControls(camera, renderer.domElement);
transform.setSize(0.85);
scene.add(transform);

transform.addEventListener('dragging-changed', (event) => {
  orbit.enabled = !event.value;
});

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const loader = new GLTFLoader();
const coords = document.getElementById('coords');
const itemsWrap = document.getElementById('items');

const roots = {};
const clickable = [];
let selected = null;

function addListButton(name, obj) {
  const btn = document.createElement('div');
  btn.className = 'item';
  btn.textContent = name;
  btn.onclick = () => selectObject(obj, name);
  itemsWrap.appendChild(btn);
  obj.userData.listButton = btn;
}

function clearActiveButtons() {
  for (const key in roots) {
    const btn = roots[key] && roots[key].userData ? roots[key].userData.listButton : null;
    if (btn) btn.classList.remove('active');
  }
}

function updateCoords() {
  if (!selected) {
    coords.textContent = 'No object selected';
    return;
  }
  const p = selected.position;
  const s = selected.scale;
  const r = selected.rotation;
  coords.innerHTML =
    '<strong>' + (selected.userData.label || 'Object') + '</strong><br>' +
    'pos: ' + p.x.toFixed(2) + ', ' + p.y.toFixed(2) + ', ' + p.z.toFixed(2) + '<br>' +
    'rot: ' + (THREE.MathUtils.radToDeg(r.x)).toFixed(0) + '°, ' +
                  (THREE.MathUtils.radToDeg(r.y)).toFixed(0) + '°, ' +
                  (THREE.MathUtils.radToDeg(r.z)).toFixed(0) + '°<br>' +
    'scale: ' + s.x.toFixed(2) + ', ' + s.y.toFixed(2) + ', ' + s.z.toFixed(2);
}

function selectObject(obj, label) {
  selected = obj;
  selected.userData.label = label || selected.userData.label || 'Object';
  transform.attach(selected);
  clearActiveButtons();
  if (selected.userData.listButton) selected.userData.listButton.classList.add('active');
  updateCoords();
}

function registerRoot(name, obj) {
  obj.userData.label = name;
  roots[name] = obj;
  clickable.push(obj);
  addListButton(name, obj);
}

function loadProp(url, name, setup) {
  loader.load(
    url,
    (gltf) => {
      const obj = gltf.scene;
      setup(obj);
      scene.add(obj);
      registerRoot(name, obj);
    },
    undefined,
    (err) => console.error('Failed to load', url, err)
  );
}

loader.load(
  './models/room.glb',
  (gltf) => {
    const room = gltf.scene;
    scene.add(room);

    room.traverse((child) => {
      if (child.isMesh) {
        if (Array.isArray(child.material)) {
          child.material.forEach((m) => {
            if (!m) return;
            m.side = THREE.DoubleSide;
            if (m.color && m.color.r < 0.1 && m.color.g < 0.1 && m.color.b < 0.1) {
              m.color.set(0xffffff);
            }
          });
        } else if (child.material) {
          child.material.side = THREE.DoubleSide;
          if (child.material.color && child.material.color.r < 0.1 && child.material.color.g < 0.1 && child.material.color.b < 0.1) {
            child.material.color.set(0xffffff);
          }
        }
      }
    });

    const box = new THREE.Box3().setFromObject(room);
    const center = box.getCenter(new THREE.Vector3());
    room.position.sub(center);
    orbit.target.set(0, 1.15, 0);
  },
  undefined,
  (err) => console.error('Failed to load room.glb', err)
);

loadProp('./models/research_table.glb', 'Table', (obj) => {
  obj.position.set(0, 0, -1.0);
  obj.scale.set(1, 1, 1);
});

loadProp('./models/journal.glb', 'Journal', (obj) => {
  obj.position.set(0.15, 0.82, -1.0);
  obj.scale.set(0.5, 0.5, 0.5);
});

loadProp('./models/laptop.glb', 'Laptop', (obj) => {
  obj.position.set(-0.35, 0.82, -1.0);
  obj.scale.set(0.6, 0.6, 0.6);
});

loadProp('./models/microscope.glb', 'Microscope', (obj) => {
  obj.position.set(1.05, 0.0, -1.0);
  obj.scale.set(0.6, 0.6, 0.6);
});

loadProp('./models/books.glb', 'Books', (obj) => {
  obj.position.set(-1.0, 0.0, -1.0);
  obj.scale.set(0.7, 0.7, 0.7);
});

loadProp('./models/coffee_cup.glb', 'Cup', (obj) => {
  obj.position.set(0.35, 0.82, -1.0);
  obj.scale.set(0.4, 0.4, 0.4);
});

loadProp('./models/glass_globe.glb', 'Globe', (obj) => {
  obj.position.set(0.0, 0.9, -0.45);
  obj.scale.set(1, 1, 1);
});

loadProp('./models/algae_specimen_jar_lowpoly.glb', 'Algae Jar', (obj) => {
  obj.position.set(0.7, 0.85, -1.0);
  obj.scale.set(1.0, 1.0, 1.0);
});

const texLoader = new THREE.TextureLoader();
const algaeTexture = texLoader.load('https://upload.wikimedia.org/wikipedia/commons/0/0e/Volvox_globator.jpg');
const tv = new THREE.Mesh(
  new THREE.PlaneGeometry(1.6, 0.9),
  new THREE.MeshBasicMaterial({ map: algaeTexture })
);
tv.position.set(2.0, 1.3, -1.0);
scene.add(tv);
registerRoot('TV Screen', tv);

function getRootObject(obj) {
  let current = obj;
  while (current) {
    if (clickable.indexOf(current) !== -1) return current;
    current = current.parent;
  }
  return null;
}

function onPointerDown(event) {
  if (transform.dragging) return;

  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);
  const intersects = raycaster.intersectObjects(scene.children, true);

  for (let i = 0; i < intersects.length; i++) {
    const root = getRootObject(intersects[i].object);
    if (root) {
      selectObject(root, root.userData.label);
      return;
    }
  }

  selected = null;
  transform.detach();
  clearActiveButtons();
  updateCoords();
}

renderer.domElement.addEventListener('pointerdown', onPointerDown);

window.addEventListener('keydown', (event) => {
  const key = event.key.toLowerCase();
  if (key === 'w') transform.setMode('translate');
  if (key === 'e') transform.setMode('rotate');
  if (key === 'r') transform.setMode('scale');
  if (key === 'q') transform.setSpace(transform.space === 'local' ? 'world' : 'local');
  if (key === 'escape') {
    selected = null;
    transform.detach();
    clearActiveButtons();
    updateCoords();
  }
});

transform.addEventListener('change', updateCoords);
updateCoords();

function animate() {
  requestAnimationFrame(animate);
  orbit.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
