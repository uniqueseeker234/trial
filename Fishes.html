<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<title>Algae Filter System</title>

<style>

/* ===== BODY ===== */
body {
  margin: 0;
  background: radial-gradient(circle at center, #000814, #000);
  font-family: 'Inter', sans-serif;
  color: white;
}

/* TITLE */
.title {
  text-align: center;
  margin: 20px;
  font-family: 'Orbitron', sans-serif;
  font-size: 22px;
  color: cyan;
  text-shadow: 0 0 15px cyan;
}

/* PANEL */
.panel-ui {
  margin: 15px;
  padding: 15px;
  border-radius: 18px;
  background: rgba(0, 255, 255, 0.03);
  border: 1px solid rgba(0,255,255,0.3);
}

/* SECTION TITLE */
.section-title {
  margin-bottom: 10px;
  font-size: 14px;
  color: cyan;
}

/* GROUP */
.group {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

/* BUTTON */
.filter-btn {
  padding: 8px 14px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.05);
  cursor: pointer;
}

.filter-btn.active {
  background: rgba(0,255,255,0.2);
  border-color: cyan;
}

/* SEARCH */
.search-box {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
}

/* RESULTS */
.results {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}

/* CARD */
.card {
  width: 200px;
  margin: 10px;
  padding: 10px;
  border-radius: 12px;
  border: 1px solid cyan;
  cursor: pointer;
}

.card img {
  width: 100%;
  border-radius: 10px;
}

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  justify-content: center;
  align-items: center;
  overflow-y: auto;
  padding: 20px;
}

.close {
  position: fixed;
  top: 20px;
  right: 25px;
  color: red;
  font-size: 25px;
  cursor: pointer;
}

/* ===== FULL PANEL ===== */
.panel {
  max-width: 95%;
  width: 560px;
  padding: 25px;
  border-radius: 16px;
  background: rgba(0,255,255,0.05);
  border: 1px solid rgba(0,255,255,0.4);
  box-shadow: 0 0 25px cyan;
}

.images {
  display: flex;
  gap: 10px;
}
.images img {
  width: 50%;
  border: 1px solid cyan;
}

.section { margin-top: 10px; }
.section h4 { color: cyan; }

</style>
</head>

<body>

<div class="title">ALGAE FILTER SYSTEM</div>

<!-- SEARCH -->
<div class="panel-ui">
  <input type="text" id="search" class="search-box" placeholder="Search algae...">
</div>

<!-- CLASS -->
<div class="panel-ui">
  <div class="section-title">CLASS</div>
  <div class="group">
    <div class="filter-btn">Chlorophyceae</div>
    <div class="filter-btn">Cyanophyceae</div>
    <div class="filter-btn">Phaeophyceae</div>
    <div class="filter-btn">Rhodophyceae</div>
  </div>
</div>

<!-- HABITAT -->
<div class="panel-ui">
  <div class="section-title">HABITAT</div>
  <div class="group">
    <div class="filter-btn">Freshwater</div>
    <div class="filter-btn">Marine</div>
    <div class="filter-btn">Soil</div>
  </div>
</div>

<div class="results" id="results"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="close" onclick="closeModal()">X</div>
  <div id="modalContent"></div>
</div>

<script>

/* DATA */
const algae = [
{
  name:"Cladophora",
  class:"Chlorophyceae",
  habitat:"Freshwater",
  short:"Filamentous green algae",
  full: `
  <div class="panel">

    <div class="images">
      <img src="images2/Cladophora1.jpg">
      <img src="images2/Cladophora2.jpg">
    </div>

    <h2>Cladophora</h2>

    <div class="section">
      <h4>Systematic Position</h4>
      <p>Division: Chlorophyta <br> Class: Ulvophyceae <br> Order: Cladophorales</p>
    </div>

    <div class="section">
      <h4>Morphology</h4>
      <p>Filamentous branched multicellular thallus</p>
    </div>

  </div>
  `
},

{
  name:"Spirogyra",
  class:"Chlorophyceae",
  habitat:"Freshwater",
  short:"Spiral chloroplast algae",
  full:`<div class="panel"><h2>Spirogyra</h2></div>`
}
];

/* FILTER */
const buttons=document.querySelectorAll(".filter-btn");

buttons.forEach(btn=>{
  btn.onclick=()=>{
    btn.classList.toggle("active");

    /* SMART RULE */
    if(btn.innerText==="Phaeophyceae"){
      document.querySelectorAll(".filter-btn").forEach(b=>{
        if(b.innerText==="Freshwater"||b.innerText==="Soil"){
          b.style.display="none";
        }
      });
    }

    update();
  }
});

document.getElementById("search").oninput=update;

function update(){
  const active=[...document.querySelectorAll(".active")].map(b=>b.innerText);
  const search=document.getElementById("search").value.toLowerCase();

  const filtered=algae.filter(a=>
    a.name.toLowerCase().includes(search) &&
    active.every(f=>a.class===f || a.habitat===f)
  );

  show(filtered);
}

function show(list){
  const r=document.getElementById("results");

  if(list.length===0){
    r.innerHTML="No algae found";
    return;
  }

  r.innerHTML=list.map(a=>`
    <div class="card" onclick="openCard('${a.name}')">
      <img src="images2/${a.name}1.jpg">
      <h4>${a.name}</h4>
      <p>${a.short}</p>
    </div>
  `).join("");
}

function openCard(name){
  const a=algae.find(x=>x.name===name);
  document.getElementById("modal").style.display="flex";
  document.getElementById("modalContent").innerHTML=a.full;
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

update();

</script>

</body>
</html>
