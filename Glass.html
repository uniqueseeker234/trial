<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Algae Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
body{
  margin:0;
  font-family:sans-serif;
  color:white;
  overflow-x:hidden;
}

/* BLURRED BACKGROUND IMAGE */
body::before{
  content:"";
  position:fixed;
  inset:0;

  background: url("images2/bg.jpg") center/cover no-repeat;

  filter: blur(12px) brightness(0.4);
  z-index:-1;
}

/* OPTIONAL DEPTH LAYER */
body::after{
  content:"";
  position:fixed;
  inset:0;
  background: radial-gradient(circle at center, rgba(0,0,0,0.3), #000814);
  z-index:-1;
}
/* TITLE */
.title{
  text-align:center;
  padding:20px;
  font-size:26px;
  color:white;
  letter-spacing:2px;
  font-family: 'Special Elite', monospace;

  text-shadow: 0 0 10px rgba(255,255,255,0.3);
}
/* GRID */
.gallery{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(140px,1fr));
  gap:25px;
  padding:25px;
}

/* WRAPPER (handles animation safely) */
.polaroid-wrapper{
  animation: float 5s ease-in-out infinite;
}

/* POLAROID CARD */
.polaroid{
  background:white;
  padding:10px 10px 15px;
  border-radius:6px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.6);
  text-align:center;

  transform: rotate(var(--rot));
  transition: transform 0.3s ease;

  position: relative;
  z-index: 1;
}

/* IMAGE */
.polaroid img{
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:4px;
}

/* NAME */
.polaroid p{
  margin-top:8px;
  font-size:13px;
  color:black;
  font-family: 'Permanent Marker', cursive;
}

/* HOVER */
.polaroid:hover{
  transform: scale(1.08) rotate(0deg);
  z-index: 10;
}

/* FLOAT ANIMATION */
@keyframes float{
  0%{ transform: translateY(0px); }
  50%{ transform: translateY(-10px); }
  100%{ transform: translateY(0px); }
}

/* RANDOM ROTATIONS */
.polaroid-wrapper:nth-child(1){ --rot: -3deg; }
.polaroid-wrapper:nth-child(2){ --rot: 2deg; }
.polaroid-wrapper:nth-child(3){ --rot: -2deg; }
.polaroid-wrapper:nth-child(4){ --rot: 3deg; }
.polaroid-wrapper:nth-child(5){ --rot: -1deg; }
.polaroid-wrapper:nth-child(6){ --rot: 2deg; }

/* RANDOM ANIMATION DELAY */
.polaroid-wrapper:nth-child(2){ animation-delay: 1s; }
.polaroid-wrapper:nth-child(3){ animation-delay: 2s; }
.polaroid-wrapper:nth-child(4){ animation-delay: 0.5s; }
.polaroid-wrapper:nth-child(5){ animation-delay: 1.5s; }
</style>
</head>

<body>

<div class="title">ALGAE GALLERY</div>

<div class="gallery">

  <div class="polaroid-wrapper">
    <div class="polaroid">
      <img src="images2/Cladophora1.jpg" onerror="this.src='images2/default.jpg'">
      <p>Cladophora</p>
    </div>
  </div>

  <div class="polaroid-wrapper">
    <div class="polaroid">
      <img src="images2/Ulva lactuca1.jpg" onerror="this.src='images2/default.jpg'">
      <p>Ulva lactuca</p>
    </div>
  </div>

  <div class="polaroid-wrapper">
    <div class="polaroid">
      <img src="images2/Chlorella1.jpg" onerror="this.src='images2/default.jpg'">
      <p>Chlorella</p>
    </div>
  </div>

  <div class="polaroid-wrapper">
    <div class="polaroid">
      <img src="images2/Spirogyra1.jpg" onerror="this.src='images2/default.jpg'">
      <p>Spirogyra</p>
    </div>
  </div>

  <div class="polaroid-wrapper">
    <div class="polaroid">
      <img src="images2/Botryococcus1.jpg" onerror="this.src='images2/default.jpg'">
      <p>Botryococcus</p>
    </div>
  </div>

  <div class="polaroid-wrapper">
    <div class="polaroid">
      <img src="images2/Polysiphonia1.jpg" onerror="this.src='images2/default.jpg'">
      <p>Polysiphonia</p>
    </div>
  </div>

</div>

</body>
</html>
