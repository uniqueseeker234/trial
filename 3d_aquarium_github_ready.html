<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compare Animation</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at center, #020617, #000814);
  overflow:hidden;
}

/* CONTAINER */
.container{
  position:relative;
  width:95%;
  max-width:900px;
  height:520px;
}

/* TITLE */
.title{
  position:absolute;
  top:55%;
  left:50%;
  transform:translate(-50%, -50%);
  color:gold;
  font-size:32px;
  letter-spacing:5px;

  animation: moveUp 1.5s ease forwards;
}

@keyframes moveUp{
  to{
    top:20px;   /* 🔥 NOW TRUE TOP */
    transform:translateX(-50%);
    font-size:24px;
  }
}

/* BOX */
.box{
  position:absolute;
  top:80px;
  left:0;
  width:100%;
  height:420px;

  transform: perspective(900px) rotateX(6deg);
}

/* LINES */
.line{
  position:absolute;
  background:gold;
  box-shadow:0 0 15px gold, 0 0 40px rgba(255,215,0,0.5);
}

/* OUTER BOX */
.top{
  top:0;
  left:0;
  height:3px;
  width:0;
  animation: drawWidth 0.8s forwards;
  animation-delay:1.6s;
}

.right{
  top:0;
  right:0;
  width:3px;
  height:0;
  animation: drawHeight 0.8s forwards;
  animation-delay:2.4s;
}

.bottom{
  bottom:0;
  right:0;
  height:3px;
  width:0;
  animation: drawWidth 0.8s forwards;
  animation-delay:3.2s;
}

.left{
  bottom:0;
  left:0;
  width:3px;
  height:0;
  animation: drawHeight 0.8s forwards;
  animation-delay:4s;
}

/* CENTER */
.center{
  top:0;
  left:50%;
  width:3px;
  height:0;
  transform:translateX(-50%);
  animation: drawHeight 1s forwards;
  animation-delay:4.8s;
}

/* ROWS */
.row{
  left:0;
  height:3px;
  width:0;
  animation: drawWidth 0.8s forwards;
}

.r1{ top:70px; animation-delay:5.4s;}
.r2{ top:140px; animation-delay:5.6s;}
.r3{ top:210px; animation-delay:5.8s;}
.r4{ top:280px; animation-delay:6s;}
.r5{ top:350px; animation-delay:6.2s;}

/* HEADINGS */
.head{
  position:absolute;
  top:20px;
  width:50%;
  text-align:center;
  color:gold;
  font-size:18px;
  opacity:0;
  animation: fadeIn 1s forwards;
  animation-delay:6.8s;
}

.leftHead{ left:0; }
.rightHead{ right:0; }

/* ANIMATIONS */
@keyframes drawWidth{
  to{ width:100%; }
}

@keyframes drawHeight{
  to{ height:100%; }
}

@keyframes fadeIn{
  to{ opacity:1; }
}
</style>

</head>

<body>

<div class="container">

  <div class="title">COMPARE ALGAE</div>

  <div class="box">

    <!-- OUTER -->
    <div class="line top"></div>
    <div class="line right"></div>
    <div class="line bottom"></div>
    <div class="line left"></div>

    <!-- CENTER -->
    <div class="line center"></div>

    <!-- ROWS -->
    <div class="line row r1"></div>
    <div class="line row r2"></div>
    <div class="line row r3"></div>
    <div class="line row r4"></div>
    <div class="line row r5"></div>

    <!-- HEADINGS -->
    <div class="head leftHead">Algae 1</div>
    <div class="head rightHead">Algae 2</div>

  </div>

</div>

</body>
</html>
