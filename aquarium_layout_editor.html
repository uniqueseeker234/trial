<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<title>Algae Archive System</title>

<style>

/* ===== BODY ===== */
body {
  margin: 0;
  background: radial-gradient(circle at center, #000814, #000);
  font-family: 'Inter', sans-serif;
  color: white;
}

/* TITLE */
.title {
  text-align: center;
  margin: 20px;
  font-family: 'Orbitron', sans-serif;
  font-size: 24px;
  color: cyan;
  text-shadow: 0 0 20px cyan;
}

/* PANEL */
.panel-ui {
  margin: 20px 15px;
  padding: 18px;
  border-radius: 18px;
  background: rgba(0,255,255,0.03);
  border: 1px solid rgba(0,255,255,0.3);
}

/* SECTION TITLE */
.section-title {
  margin-bottom: 12px;
  color: cyan;
  font-size: 14px;
  letter-spacing: 1px;
}

/* GROUP */
.group {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* BUTTON */
.filter-btn {
  padding: 12px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.05);
  cursor: pointer;
  transition: 0.25s;
  box-shadow:
    0 5px 10px rgba(0,0,0,0.6),
    inset 0 0 5px rgba(255,255,255,0.1);
}

.filter-btn:hover {
  transform: translateY(-2px);
  box-shadow:
    0 0 10px cyan,
    0 10px 20px rgba(0,0,0,0.8);
}

.filter-btn.active {
  background: rgba(0,255,255,0.2);
  border-color: cyan;
  box-shadow:
    0 0 15px cyan,
    0 0 30px cyan;
}

.filter-btn:active {
  transform: scale(0.95);
}

/* SEARCH */
.search-box {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
}

/* RESULTS */
.results {
  padding: 10px;
}

/* CARD */
.card {
  display: flex;
  gap: 12px;
  margin: 15px;
  padding: 12px;
  border-radius: 16px;
  border: 1px solid rgba(0,255,255,0.4);
  background: rgba(0,255,255,0.04);
  backdrop-filter: blur(10px);
  box-shadow:
    0 0 10px rgba(0,255,255,0.2),
    inset 0 0 10px rgba(0,255,255,0.1);
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.03);
  box-shadow:
    0 0 20px cyan,
    inset 0 0 15px rgba(0,255,255,0.3);
}

.card img {
  width: 90px;
  height: 90px;
  object-fit: cover;
  border-radius: 12px;
  border: 1px solid cyan;
  box-shadow: 0 0 10px rgba(0,255,255,0.5);
}

.card-text h4 {
  margin: 0;
}

.card-text p {
  margin: 5px 0 0;
  color: #bdfcff;
}

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: none;
  overflow-y: auto;
  padding: 20px;
}

.close {
  position: fixed;
  top: 20px;
  right: 20px;
  color: red;
  font-size: 25px;
  cursor: pointer;
}

/* FULL CARD */
.panel {
  max-width: 560px;
  margin: 20px auto;
  padding: 25px;
  border-radius: 20px;
  background: rgba(0,255,255,0.05);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(0,255,255,0.4);
  box-shadow:
    0 0 25px cyan,
    0 0 70px rgba(0,255,255,0.4),
    inset 0 0 25px rgba(0,255,255,0.2);
}

</style>
</head>

<body>

<div class="title">ALGAE ARCHIVE SYSTEM</div>

<!-- SEARCH -->
<div class="panel-ui">
  <input type="text" id="search" class="search-box" placeholder="Search algae...">
</div>

<!-- UPDATED SCIENTIFIC FILTER -->
<div class="panel-ui">
  <div class="section-title">SCIENTIFIC GROUPS</div>
  <div class="group">
    <div class="filter-btn">Chlorophyta</div>
    <div class="filter-btn">Charophyta</div>
    <div class="filter-btn">Cyanobacteria</div>
    <div class="filter-btn">Rhodophyta</div>
    <div class="filter-btn">Phaeophyta</div>
    <div class="filter-btn">Bacillariophyta</div>
    <div class="filter-btn">Xanthophyta</div>
    <div class="filter-btn">Protists</div>
  </div>
</div>

<!-- HABITAT -->
<div class="panel-ui">
  <div class="section-title">HABITAT</div>
  <div class="group">
    <div class="filter-btn">Freshwater</div>
    <div class="filter-btn">Marine</div>
    <div class="filter-btn">Soil</div>
  </div>
</div>

<div class="results" id="results"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="close" onclick="closeModal()">X</div>
  <div id="modalContent"></div>
</div>

<script>

/* DATA — FULLY CORRECTED ONLY */
const algae = [

{name:"Cladophora",class:"Chlorophyta",habitat:"Freshwater",short:"Filamentous green algae"},
{name:"Chlorococcum",class:"Chlorophyta",habitat:"Soil",short:"Unicellular green algae"},
{name:"Coelastrum",class:"Chlorophyta",habitat:"Freshwater",short:"Colonial spherical algae"},
{name:"Cosmarium",class:"Charophyta",habitat:"Freshwater",short:"Desmid algae"},
{name:"Dunaliella",class:"Chlorophyta",habitat:"Marine",short:"Salt-tolerant algae"},
{name:"Haematococcus",class:"Chlorophyta",habitat:"Freshwater",short:"Astaxanthin algae"},
{name:"Micractinium",class:"Chlorophyta",habitat:"Freshwater",short:"Spiny algae"},
{name:"Monoraphidium",class:"Chlorophyta",habitat:"Freshwater",short:"Elongated algae"},
{name:"Oedogonium",class:"Chlorophyta",habitat:"Freshwater",short:"Filament algae"},
{name:"Pediastrum",class:"Chlorophyta",habitat:"Freshwater",short:"Star colony"},
{name:"Scenedesmus",class:"Chlorophyta",habitat:"Freshwater",short:"Linear colony"},
{name:"Spirogyra",class:"Charophyta",habitat:"Freshwater",short:"Spiral algae"},
{name:"Stigeoclonium",class:"Chlorophyta",habitat:"Freshwater",short:"Branched algae"},
{name:"Volvox",class:"Chlorophyta",habitat:"Freshwater",short:"Motile colony"},

{name:"Tetraselmis",class:"Chlorophyta",habitat:"Marine",short:"Motile algae"},
{name:"Trebouxia",class:"Chlorophyta",habitat:"Soil",short:"Lichen algae"},
{name:"Ulva lactuca",class:"Chlorophyta",habitat:"Marine",short:"Sea lettuce"},
{name:"Chara",class:"Charophyta",habitat:"Freshwater",short:"Plant-like algae"},

{name:"Microcystis",class:"Cyanobacteria",habitat:"Freshwater",short:"Bloom algae"},
{name:"Nostoc",class:"Cyanobacteria",habitat:"Freshwater",short:"Nitrogen fixer"},
{name:"Oscillatoria",class:"Cyanobacteria",habitat:"Freshwater",short:"Filament algae"},
{name:"Stichococcus",class:"Chlorophyta",habitat:"Soil",short:"Terrestrial algae"},

{name:"Canistrocarpus",class:"Phaeophyta",habitat:"Marine",short:"Brown algae"},
{name:"Cystoseira",class:"Phaeophyta",habitat:"Marine",short:"Bushy algae"},
{name:"Ectocarpus",class:"Phaeophyta",habitat:"Marine",short:"Filament algae"},
{name:"Laminaria",class:"Phaeophyta",habitat:"Marine",short:"Kelp"},
{name:"Macrocystis",class:"Phaeophyta",habitat:"Marine",short:"Giant kelp"},
{name:"Nereocystis",class:"Phaeophyta",habitat:"Marine",short:"Bull kelp"},
{name:"Padina",class:"Phaeophyta",habitat:"Marine",short:"Fan algae"},
{name:"Saccharina",class:"Phaeophyta",habitat:"Marine",short:"Edible kelp"},
{name:"Sargassum",class:"Phaeophyta",habitat:"Marine",short:"Floating algae"},
{name:"Stypopodium",class:"Phaeophyta",habitat:"Marine",short:"Leaf algae"},
{name:"Turbinaria",class:"Phaeophyta",habitat:"Marine",short:"Tough algae"},

{name:"Botryocladia",class:"Rhodophyta",habitat:"Marine",short:"Red algae"},
{name:"Furcellaria",class:"Rhodophyta",habitat:"Marine",short:"Carrageenan algae"},
{name:"Hypnea pannosa",class:"Rhodophyta",habitat:"Marine",short:"Hooked algae"},
{name:"Lithothamnion",class:"Rhodophyta",habitat:"Marine",short:"Calcareous algae"},
{name:"Polysiphonia",class:"Rhodophyta",habitat:"Marine",short:"Filament algae"},
{name:"Porphyra",class:"Rhodophyta",habitat:"Marine",short:"Edible algae"},
{name:"Titanophora",class:"Rhodophyta",habitat:"Marine",short:"Leaf algae"},

{name:"Chaetoceros",class:"Bacillariophyta",habitat:"Marine",short:"Diatom"},
{name:"Phaeodactylum",class:"Bacillariophyta",habitat:"Marine",short:"Model diatom"},
{name:"Pinnularia",class:"Bacillariophyta",habitat:"Freshwater",short:"Boat diatom"},

{name:"Vaucheria",class:"Xanthophyta",habitat:"Soil",short:"Yellow-green algae"},

{name:"Schizochytrium",class:"Protists",habitat:"Marine",short:"Omega-3 organism"},
{name:"Ankistrodesmus",class:"Chlorophyta",habitat:"Freshwater",short:"Needle algae"},
{name:"Botryococcus",class:"Chlorophyta",habitat:"Freshwater",short:"Oil algae"},
{name:"Chlorella",class:"Chlorophyta",habitat:"Freshwater",short:"Unicellular algae"},
{name:"Ulothrix",class:"Chlorophyta",habitat:"Freshwater",short:"Filament algae"},
{name:"Acetabularia",class:"Chlorophyta",habitat:"Marine",short:"Umbrella algae"}

];

/* FILTER SYSTEM (UNCHANGED) */
const btns = document.querySelectorAll(".filter-btn");

btns.forEach(btn=>{
  btn.onclick=()=>{
    btn.classList.toggle("active");
    update();
  }
});

document.getElementById("search").oninput = update;

function update(){
  const active=[...document.querySelectorAll(".active")].map(x=>x.innerText);
  const search=document.getElementById("search").value.toLowerCase();

  const filtered=algae.filter(a=>
    a.name.toLowerCase().includes(search) &&
    active.every(f=>a.class===f || a.habitat===f)
  );

  show(filtered);
}

function show(list){
  const r=document.getElementById("results");

  r.innerHTML=list.map(a=>`
  <div class="card" onclick="openCard('${a.name}')">
    <img src="images2/${a.name}1.jpg" onerror="this.src='images2/default.jpg'">
    <div class="card-text">
      <h4>${a.name}</h4>
      <p>${a.short}</p>
    </div>
  </div>
  `).join("");
}

function openCard(name){
  const a=algae.find(x=>x.name===name);
  document.getElementById("modal").style.display="block";
  document.getElementById("modalContent").innerHTML = a.full || `
    <div class="panel"><h2>${name}</h2><p>Full data coming soon</p></div>
  `;
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

update();

</script>

</body>
</html>
