<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Microscope Viewer • Smooth Seated POV</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#05070c;
}

canvas{
  display:block;
}

#hint{
  position:fixed;
  top:12px;
  left:12px;
  z-index:20;

  padding:12px 14px;

  background:rgba(0,0,0,0.45);
  backdrop-filter:blur(10px);

  border-radius:16px;

  color:white;

  font-family:Arial;
  font-size:12px;

  border:1px solid rgba(255,255,255,0.10);
}
</style>
</head>

<body>

<div id="hint">
Drag screen to look around microscope
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
(() => {

/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x05070c);

/* =========================
   RENDERER
========================= */

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

renderer.outputEncoding = THREE.sRGBEncoding;

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);

/* =========================
   CAMERA
========================= */

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth/window.innerHeight,
  0.01,
  100
);

/* =========================
   LIGHTS
========================= */

const hemi = new THREE.HemisphereLight(
  0xffffff,
  0x222233,
  1.2
);

scene.add(hemi);

const dir = new THREE.DirectionalLight(
  0xffffff,
  1.1
);

dir.position.set(5,8,5);

dir.castShadow = true;

scene.add(dir);

/* =========================
   CAMERA POSITION
========================= */

const CAMERA_POS = new THREE.Vector3(
  2.53,
  0.48,
  -0.70
);

/* =========================
   VIEW LIMITS
========================= */

const CENTER_YAW = -1.86;

const MIN_YAW = -2.05;
const MAX_YAW = -1.08;

const MIN_PITCH = -0.15;
const MAX_PITCH = 0.18;

/* =========================
   SMOOTH CAMERA SYSTEM
========================= */

let targetYaw = CENTER_YAW;
let currentYaw = CENTER_YAW;

let targetPitch = 0.02;
let currentPitch = 0.02;

/* =========================
   DRAG CONTROLS
========================= */

let dragging = false;

let lastX = 0;
let lastY = 0;

renderer.domElement.addEventListener(
  "pointerdown",
  e => {

    dragging = true;

    lastX = e.clientX;
    lastY = e.clientY;
  }
);

window.addEventListener(
  "pointerup",
  () => dragging = false
);

window.addEventListener(
  "pointermove",
  e => {

    if(!dragging) return;

    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;

    lastX = e.clientX;
    lastY = e.clientY;

    /* smoother faster movement */

    targetYaw -= dx * 0.0045;

    targetPitch -= dy * 0.0025;

    /* limits */

    targetYaw = THREE.MathUtils.clamp(
      targetYaw,
      MIN_YAW,
      MAX_YAW
    );

    targetPitch = THREE.MathUtils.clamp(
      targetPitch,
      MIN_PITCH,
      MAX_PITCH
    );

  }
);

/* =========================
   LOAD GLB
========================= */

const loader = new THREE.GLTFLoader();

function load(path){

  return new Promise((resolve,reject)=>{

    loader.load(
      path,
      g => resolve(g.scene),
      undefined,
      reject
    );

  });

}

(async()=>{

/* ROOM */

const room = await load("./room.glb");

scene.add(room);

room.traverse(o=>{

  if(!o.isMesh) return;

  o.castShadow = true;
  o.receiveShadow = true;

  const mats = Array.isArray(o.material)
    ? o.material
    : [o.material];

  mats.forEach(m=>{

    if(!m) return;

    m.side = THREE.DoubleSide;

    if(m.map){
      m.map.encoding = THREE.sRGBEncoding;
    }

  });

});

/* TABLE */

const table = await load(
  "./models/lumen_hologram_table.glb"
);

room.add(table);

table.position.set(
  1.60,
  0.10,
  -0.80
);

table.scale.set(
  0.75,
  0.75,
  0.75
);

table.rotation.y = -3.14;

/* MICROSCOPE */

const microscope = await load(
  "./models/microscope.glb"
);

room.add(microscope);

microscope.position.set(
  1.54,
  0.45,
  -0.28
);

microscope.scale.set(
  0.14,
  0.14,
  0.14
);

microscope.rotation.set(
  -0.02,
  1.7,
  0
);

/* CHAIR */

const chair = await load(
  "./round_chair.glb"
);

room.add(chair);

chair.position.set(
  -0.35,
  -0.15,
  1.50
);

chair.scale.set(
  0.40,
  0.40,
  0.40
);

chair.rotation.y = 0.05;

/* JOURNAL */

const journal = await load(
  "./models/journal.glb"
);

room.add(journal);

journal.position.set(
  1.58,
  0.37,
  -0.62
);

journal.scale.set(
  0.05,
  0.05,
  0.05
);

journal.rotation.set(
  -1.66,
  0.68,
  1.69
);

})();

/* =========================
   CAMERA UPDATE
========================= */

function updateCamera(){

  /* smooth interpolation */

  currentYaw +=
    (targetYaw - currentYaw) * 0.08;

  currentPitch +=
    (targetPitch - currentPitch) * 0.08;

  camera.position.copy(CAMERA_POS);

  const dir = new THREE.Vector3(
    Math.sin(currentYaw),
    currentPitch,
    -Math.cos(currentYaw)
  );

  camera.lookAt(
    camera.position.clone().add(dir)
  );

}

/* =========================
   ANIMATION LOOP
========================= */

function animate(){

  requestAnimationFrame(animate);

  updateCamera();

  renderer.render(scene,camera);

}

animate();

/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      window.innerWidth/window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

})();
</script>

</body>
</html>
