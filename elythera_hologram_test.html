<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elythera Hologram Test</title>
  <style>
    :root{
      --blue:#6fd2ff;
      --sky:#56c8ff;
      --green:#67ff7f;
      --violet:#b67dff;
      --orange:#ffb14f;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:#000;
      overflow:hidden;
      font-family:Arial, Helvetica, sans-serif;
      color:#dff5ff;
    }
    .scene{
      position:relative;
      width:100vw;
      height:100vh;
      background:#000;
      overflow:hidden;
    }
    .title{
      position:absolute;
      top:18px;
      left:50%;
      transform:translateX(-50%);
      z-index:20;
      text-transform:uppercase;
      letter-spacing:.35em;
      font-weight:700;
      font-size:clamp(20px, 3vw, 42px);
      text-shadow:0 0 12px rgba(111,210,255,.25);
      pointer-events:none;
    }
    .subtitle{
      position:absolute;
      top:58px;
      left:50%;
      transform:translateX(-50%);
      z-index:20;
      text-transform:uppercase;
      letter-spacing:.18em;
      font-size:11px;
      color:rgba(223,245,255,.72);
      pointer-events:none;
    }
    .crew{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:contain;
      object-position:center center;
      z-index:1;
      user-select:none;
      pointer-events:none;
      filter:drop-shadow(0 0 18px rgba(80,160,255,.08));
    }
    .fx{
      position:absolute;
      transform:translate(-50%,-50%);
      opacity:0;
      pointer-events:none;
      z-index:5;
      will-change:transform, opacity, filter;
    }
    .particles{
      width:150px;
      mix-blend-mode:screen;
      animation:
        fxIn 1.2s ease forwards,
        particleDrift 4.8s ease-in-out infinite;
      animation-delay:var(--delay), calc(var(--delay) + 1.2s);
    }
    .ring{
      width:130px;
      mix-blend-mode:screen;
      animation:
        fxInRing 1.1s ease forwards,
        ringFloat 5s ease-in-out infinite,
        ringGlow 14s linear infinite;
      animation-delay:calc(var(--delay) + .55s), calc(var(--delay) + 1.65s), calc(var(--delay) + 1.65s);
      transform-origin:center center;
    }
    .wave{
      width:170px;
      mix-blend-mode:screen;
      animation:
        fxInWave 1.15s ease forwards,
        wavePulse 4.6s ease-in-out infinite;
      animation-delay:calc(var(--delay) + .2s), calc(var(--delay) + 1.35s);
    }
    .logo{
      width:104px;
      z-index:7;
      mix-blend-mode:screen;
      filter:drop-shadow(0 0 14px rgba(255,255,255,.18));
      animation:
        logoAppear 1.05s ease forwards,
        logoFloat 4.4s ease-in-out infinite;
      animation-delay:calc(var(--delay) + 1.2s), calc(var(--delay) + 2.25s);
    }
    .palm-glow{
      position:absolute;
      width:90px;
      height:90px;
      transform:translate(-50%,-50%) scale(.45);
      border-radius:50%;
      opacity:0;
      pointer-events:none;
      z-index:4;
      filter:blur(12px);
      background:radial-gradient(circle, rgba(255,255,255,.95) 0%, var(--glow) 18%, rgba(255,255,255,.08) 38%, rgba(0,0,0,0) 72%);
      animation:
        palmBuild 1s ease forwards,
        palmPulse 3.2s ease-in-out infinite;
      animation-delay:calc(var(--delay) - .1s), calc(var(--delay) + .9s);
    }
    @keyframes palmBuild{
      0%{opacity:0; transform:translate(-50%,-50%) scale(.25)}
      65%{opacity:.95; transform:translate(-50%,-50%) scale(1.18)}
      100%{opacity:.68; transform:translate(-50%,-50%) scale(1)}
    }
    @keyframes palmPulse{
      0%,100%{opacity:.55; filter:blur(12px)}
      50%{opacity:.92; filter:blur(18px)}
    }
    @keyframes fxIn{
      0%{opacity:0; transform:translate(-50%,-50%) scale(.2)}
      50%{opacity:.95; transform:translate(-50%,-50%) scale(1.06)}
      100%{opacity:.72; transform:translate(-50%,-50%) scale(1)}
    }
    @keyframes fxInRing{
      0%{opacity:0; transform:translate(-50%,-50%) scale(.25) rotate(0deg)}
      65%{opacity:.95; transform:translate(-50%,-50%) scale(1.12) rotate(8deg)}
      100%{opacity:.82; transform:translate(-50%,-50%) scale(1) rotate(0deg)}
    }
    @keyframes fxInWave{
      0%{opacity:0; transform:translate(-50%,-50%) scale(.5)}
      70%{opacity:.9; transform:translate(-50%,-50%) scale(1.08)}
      100%{opacity:.64; transform:translate(-50%,-50%) scale(1)}
    }
    @keyframes logoAppear{
      0%{opacity:0; transform:translate(-50%,-50%) scale(.15)}
      65%{opacity:1; transform:translate(-50%,-50%) scale(1.14)}
      100%{opacity:1; transform:translate(-50%,-50%) scale(1)}
    }
    @keyframes particleDrift{
      0%,100%{transform:translate(-50%,-50%) rotate(-2deg) translateY(0px)}
      50%{transform:translate(-50%,-50%) rotate(2deg) translateY(-8px)}
    }
    @keyframes ringFloat{
      0%,100%{transform:translate(-50%,-50%) rotate(0deg) translateY(0px)}
      50%{transform:translate(-50%,-50%) rotate(0deg) translateY(-6px)}
    }
    @keyframes ringGlow{
      0%,100%{filter:drop-shadow(0 0 12px rgba(255,255,255,.14))}
      50%{filter:drop-shadow(0 0 18px rgba(255,255,255,.22))}
    }
    @keyframes wavePulse{
      0%,100%{opacity:.5; transform:translate(-50%,-50%) scale(1)}
      50%{opacity:.8; transform:translate(-50%,-50%) scale(1.06)}
    }
    @keyframes logoFloat{
      0%,100%{transform:translate(-50%,-50%) translateY(0px)}
      50%{transform:translate(-50%,-50%) translateY(-7px)}
    }

    .vixen { left:13.2%; top:52.0%; --delay:.15s; --glow: var(--blue); }
    .mareoj{ left:38.8%; top:48.8%; --delay:.45s; --glow: var(--green); }
    .vel   { left:56.0%; top:56.0%; --delay:.75s; --glow: var(--violet); }
    .lyra  { left:73.0%; top:56.6%; --delay:1.05s; --glow: var(--orange); }
    .uniq  { left:89.3%; top:51.7%; --delay:1.35s; --glow: var(--sky); }

    .vixen.ring,.uniq.ring { width:122px; }
    .mareoj.ring { width:130px; }
    .vel.ring { width:118px; }
    .lyra.ring { width:122px; }

    .vixen.logo,.uniq.logo { width:100px; }
    .mareoj.logo { width:108px; }
    .vel.logo { width:108px; }
    .lyra.logo { width:102px; }

    .vixen.wave,.uniq.wave { width:170px; }
    .mareoj.wave { width:176px; }
    .vel.wave { width:162px; }
    .lyra.wave { width:166px; }

    .vixen.particles,.uniq.particles { width:142px; }
    .mareoj.particles { width:148px; }
    .vel.particles { width:138px; }
    .lyra.particles { width:140px; }

    .legend{
      position:absolute;
      bottom:14px;
      left:50%;
      transform:translateX(-50%);
      z-index:30;
      font-size:11px;
      letter-spacing:.12em;
      color:rgba(223,245,255,.64);
      text-transform:uppercase;
      text-align:center;
      background:rgba(0,0,0,.26);
      border:1px solid rgba(111,210,255,.12);
      padding:8px 12px;
      border-radius:999px;
      backdrop-filter: blur(4px);
      pointer-events:none;
    }

    @media (max-width: 900px){
      .crew{object-position:center 54%}
      .title{top:14px}
      .subtitle{top:47px}
      .palm-glow{width:68px;height:68px}
      .vixen { left:13.5%; top:53.2%; }
      .mareoj{ left:38.9%; top:50.2%; }
      .vel   { left:56.0%; top:57.0%; }
      .lyra  { left:73.1%; top:57.8%; }
      .uniq  { left:89.2%; top:52.8%; }
      .logo{width:78px}
      .ring{width:96px}
      .particles,.wave{width:128px}
    }
    @media (max-width: 640px){
      .title{font-size:18px; letter-spacing:.18em}
      .subtitle{font-size:9px; top:40px}
      .legend{display:none}
      .crew{object-position:center 58%}
      .palm-glow{width:52px;height:52px; filter:blur(9px)}
      .vixen { left:13.6%; top:54.0%; }
      .mareoj{ left:39.1%; top:51.2%; }
      .vel   { left:56.2%; top:58.0%; }
      .lyra  { left:73.1%; top:58.8%; }
      .uniq  { left:89.1%; top:53.8%; }
      .logo{width:60px}
      .ring{width:76px}
      .particles,.wave{width:96px}
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="title">ELYTHERA</div>
    <div class="subtitle">Hologram activation test</div>

    <img class="crew" src="assets/elythera/elythera_team.png" alt="Elythera Team">

    <div class="palm-glow vixen"></div>
    <img class="fx wave vixen" src="assets/effects/energy_wave_blue.png" alt="">
    <img class="fx particles vixen" src="assets/effects/particles_blue.png" alt="">
    <img class="fx ring vixen" src="assets/effects/glow_ring_blue.png" alt="">
    <img class="fx logo vixen" src="assets/elythera/logo_identifier.png" alt="Identifier">

    <div class="palm-glow mareoj"></div>
    <img class="fx wave mareoj" src="assets/effects/energy_wave_green.png" alt="">
    <img class="fx particles mareoj" src="assets/effects/particles_green.png" alt="">
    <img class="fx ring mareoj" src="assets/effects/glow_ring_green.png" alt="">
    <img class="fx logo mareoj" src="assets/elythera/logo_pond.png" alt="Pond">

    <div class="palm-glow vel"></div>
    <img class="fx wave vel" src="assets/effects/energy_wave_purple.png" alt="">
    <img class="fx particles vel" src="assets/effects/particles_purple.png" alt="">
    <img class="fx ring vel" src="assets/effects/glow_ring_purple.png" alt="">
    <img class="fx logo vel" src="assets/elythera/logo_archive.png" alt="Archive">

    <div class="palm-glow lyra"></div>
    <img class="fx wave lyra" src="assets/effects/energy_wave_orange.png" alt="">
    <img class="fx particles lyra" src="assets/effects/particles_orange.png" alt="">
    <img class="fx ring lyra" src="assets/effects/glow_ring_orange.png" alt="">
    <img class="fx logo lyra" src="assets/elythera/logo_photohouse.png" alt="PhotoHouse">

    <div class="palm-glow uniq"></div>
    <img class="fx wave uniq" src="assets/effects/energy_wave_locator.png" alt="">
    <img class="fx particles uniq" src="assets/effects/particles_locator.png" alt="">
    <img class="fx ring uniq" src="assets/effects/glow_ring_locator.png" alt="">
    <img class="fx logo uniq" src="assets/elythera/logo_locator.png" alt="Locator">

    <div class="legend">Wave → particles → ring → logo</div>
  </div>
</body>
</html>
